[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/markup",
    "crates/playback",
    "crates/theme",
    "crates/i18n",
    "crates/settings",
    "crates/audio",
    "crates/bridge",
    "crates/chat",
    "crates/bilibili",
    "crates/blive",
    "crates/douyin",
    "crates/youtube",
    "crates/twitch",
    "crates/core",
    "crates/p2p",
    "crates/plugins",
    "crates/secrets",
    "crates/update",
    "crates/steam",
    "crates/frame",
    "app",
    "editor",
]
default-members = ["app", "editor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
nanatype-model = { path = "crates/model" }
nanatype-markup = { path = "crates/markup" }
nanatype-playback = { path = "crates/playback" }
# Without default features: the app turns `builtin-fonts` on (or off).
nanatype-theme = { path = "crates/theme", default-features = false }
nanatype-i18n = { path = "crates/i18n" }
nanatype-settings = { path = "crates/settings" }
nanatype-audio = { path = "crates/audio" }
nanatype-bridge = { path = "crates/bridge" }
nanatype-chat = { path = "crates/chat" }
nanatype-bilibili = { path = "crates/bilibili" }
nanatype-blive = { path = "crates/blive" }
nanatype-douyin = { path = "crates/douyin" }
nanatype-youtube = { path = "crates/youtube" }
nanatype-twitch = { path = "crates/twitch" }
nanatype-core = { path = "crates/core" }
nanatype-p2p = { path = "crates/p2p" }
nanatype-plugins = { path = "crates/plugins" }
nanatype-secrets = { path = "crates/secrets" }
nanatype-update = { path = "crates/update" }
nanatype-steam = { path = "crates/steam" }
nanatype-frame = { path = "crates/frame" }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI", rev = "15963fd21ae7530bbf325e6367795914b0ece2e9", default-features = false }
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI", rev = "15963fd21ae7530bbf325e6367795914b0ece2e9", default-features = false }
nana-text = { git = "https://github.com/sena-nana/NanaUI", rev = "15963fd21ae7530bbf325e6367795914b0ece2e9" }
nana-ui-devtools = { git = "https://github.com/sena-nana/NanaUI", rev = "15963fd21ae7530bbf325e6367795914b0ece2e9" }
nana-ui = { git = "https://github.com/sena-nana/NanaUI", rev = "15963fd21ae7530bbf325e6367795914b0ece2e9", default-features = false, features = [
    "hosted",
    "bundled-fonts",
    "wgpu-interop",
    "wgpu-backends",
    "icons-tabler",
    # Also provides css!, used by the application even without view! templates.
    "view-macro",
    "packaged-resources",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-segmentation = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

# Keep full debugger support for workspace code, but avoid generating third-party
# type/variable information. Dependency backtraces still include source lines.
[profile.dev.package."*"]
debug = "line-tables-only"

# Result extraction crosses the Lua C API thousands of times for a full canvas.
# Keep both sides of those Wasmtime calls optimized in dev/test too, so debug
# overhead does not exhaust the same 200 ms response deadline as shipped builds.
[profile.dev.package.nanatype-plugins]
opt-level = 2

[profile.dev.package.wasmtime]
opt-level = 2

[profile.release]
debug = "line-tables-only"

# Shipped builds: optimize size while retaining loop vectorization and a PDB.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
split-debuginfo = "packed"

# Optional all-z build; runtime tradeoffs: docs/release-profile-performance.md.
[profile.dist-small]
inherits = "dist"
opt-level = "z"
