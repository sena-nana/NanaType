[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/markup",
    "crates/playback",
    "crates/theme",
    "crates/i18n",
    "crates/settings",
    "crates/audio",
    "crates/bridge",
    "crates/bilibili",
    "crates/douyin",
    "crates/core",
    "crates/p2p",
    "app",
]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
nanatype-model = { path = "crates/model" }
nanatype-markup = { path = "crates/markup" }
nanatype-playback = { path = "crates/playback" }
# Without default features: the app turns `builtin-fonts` on (or off).
nanatype-theme = { path = "crates/theme", default-features = false }
nanatype-i18n = { path = "crates/i18n" }
nanatype-settings = { path = "crates/settings" }
nanatype-audio = { path = "crates/audio" }
nanatype-bridge = { path = "crates/bridge" }
nanatype-bilibili = { path = "crates/bilibili" }
nanatype-douyin = { path = "crates/douyin" }
nanatype-core = { path = "crates/core" }
nanatype-p2p = { path = "crates/p2p" }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI", rev = "b76a5549e72b1cc12f975fc8bfdec67c126ff875", default-features = false }
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI", rev = "b76a5549e72b1cc12f975fc8bfdec67c126ff875", default-features = false }
nana-ui-devtools = { git = "https://github.com/sena-nana/NanaUI", rev = "b76a5549e72b1cc12f975fc8bfdec67c126ff875" }
nana-ui = { git = "https://github.com/sena-nana/NanaUI", rev = "b76a5549e72b1cc12f975fc8bfdec67c126ff875", default-features = false, features = [
    "hosted",
    "bundled-fonts",
    "wgpu-interop",
    "wgpu-backends",
    "icons-tabler",
    "view-macro",
    "native-export",
    "packaged-resources",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-segmentation = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
debug = "line-tables-only"

# Shipped builds: thin LTO, one codegen unit, stripped symbols kept in a PDB.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
