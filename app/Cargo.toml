[package]
name = "nanatype"
version.workspace = true
edition.workspace = true
license = "MIT AND CC-BY-NC-4.0"
rust-version.workspace = true
description = "NanaType — typewriter dialogue for VTubers"

[lib]
name = "nanatype"
path = "src/lib.rs"

[[bin]]
name = "nanatype"
path = "src/main.rs"

# Screenshot tools that stage the update states.
[[example]]
name = "snapshots"
required-features = ["updates"]

[features]
default = ["builtin-fonts", "updates"]
# Embed crates/theme/fonts/ for the built-in skins (docs/fonts.md). Build
# with `--no-default-features` to leave them out: those skins then fall
# back to installed fonts.
builtin-fonts = ["nanatype-frame/builtin-fonts"]
# The GitHub Releases update check (docs/updates.md). Steam builds update
# through SteamPipe instead.
updates = ["dep:nanatype-update"]
# The Steam build: launches through Steam and reads Workshop subscriptions.
# Build it with --no-default-features --features builtin-fonts,steam.
steam = ["nanatype-steam/steamworks"]

[dependencies]
nanatype-model.workspace = true
nanatype-markup.workspace = true
nanatype-playback.workspace = true
nanatype-theme.workspace = true
nanatype-i18n = { workspace = true, features = ["app"] }
nanatype-settings.workspace = true
nanatype-audio.workspace = true
nanatype-speech.workspace = true
nanatype-bridge.workspace = true
nanatype-chat.workspace = true
nanatype-blive.workspace = true
nanatype-twitch.workspace = true
nanatype-core.workspace = true
nanatype-p2p.workspace = true
nanatype-plugins.workspace = true
nanatype-secrets.workspace = true
nanatype-obs.workspace = true
nanatype-update = { workspace = true, optional = true }
nanatype-steam.workspace = true
nanatype-frame.workspace = true
nanatype-diag.workspace = true
nanatype-scheduling.workspace = true
getrandom.workspace = true
# Spout and Syphon output of the broadcast windows.
nana-ui = { workspace = true, features = ["native-export"] }
nana-text.workspace = true
ttf-parser = { workspace = true, features = ["std"] }
nana-ui-platform.workspace = true
nana-ui-core.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
arboard = "3"
raw-window-handle.workspace = true
imagesize.workspace = true
tiny-skia.workspace = true
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
ureq.workspace = true
blake3.workspace = true
gif = "0.14"
flate2 = { workspace = true, default-features = true }
# Downloads use iter_download and our own cache writer, not its filesystem helpers.
grammers-client = { version = "=0.11.0", default-features = false, features = ["proxy"] }
grammers-session = { version = "=0.11.0", default-features = false, features = ["serde"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
rasterlottie = { version = "=0.2.4", default-features = false }
webm-iterable = "0.7.1"
# Includes the upstream MSVC prebuilt/source-build fixes.
shiguredo_libvpx.workspace = true
url.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pollster.workspace = true
# The diagnostics package (docs/logging.md); the same build theme uses.
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nanalive-syphon = { git = "https://github.com/sena-nana/nanalive-spout", rev = "9963359c6068c7954bc7301968b527514250270e" }
objc2 = "0.6"
objc2-app-kit.workspace = true
objc2-foundation = "0.3"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLCommandBuffer", "MTLCommandQueue"] }

# Upstream ships prebuilt Apple Silicon archives; Intel Macs build from source.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
shiguredo_libvpx = { workspace = true, features = ["source-build"] }

[target.'cfg(windows)'.dependencies]
nanalive-spout = { git = "https://github.com/sena-nana/nanalive-spout", rev = "9963359c6068c7954bc7301968b527514250270e", default-features = false, features = ["gpu-dx11-shared"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Display",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Time",
    "Win32_Security_Cryptography",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true
nana-ui-devtools = { workspace = true, features = ["runtime-agent"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole"] }
