[package]
name = "nanatype"
version.workspace = true
edition.workspace = true
license = "MIT AND CC-BY-NC-4.0"
rust-version.workspace = true
description = "NanaType — typewriter dialogue for VTubers"

[lib]
name = "nanatype"
path = "src/lib.rs"

[[bin]]
name = "nanatype"
path = "src/main.rs"

[features]
default = ["builtin-fonts"]
# Embed crates/theme/fonts/ for the built-in skins (docs/fonts.md). Build
# with `--no-default-features` to leave them out: those skins then fall
# back to installed fonts.
builtin-fonts = ["nanatype-theme/builtin-fonts"]

[dependencies]
nanatype-model.workspace = true
nanatype-markup.workspace = true
nanatype-playback.workspace = true
nanatype-theme.workspace = true
nanatype-i18n.workspace = true
nanatype-settings.workspace = true
nanatype-audio.workspace = true
nanatype-bridge.workspace = true
nanatype-bilibili.workspace = true
nanatype-douyin.workspace = true
nanatype-core.workspace = true
nanatype-p2p.workspace = true
nana-ui.workspace = true
nana-ui-platform.workspace = true
nana-ui-core.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
arboard = "3"
raw-window-handle = "0.6"
imagesize = "0.15"
tiny-skia = "0.12"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tray-icon = "0.21"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
blake3 = "1"
gif = "0.14"
flate2 = "1"
grammers-client = { version = "=0.11.0", features = ["proxy"] }
grammers-session = { version = "=0.11.0", default-features = false, features = ["serde"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }
rasterlottie = { version = "=0.2.4", default-features = false }
webm-iterable = "0.7.1"
# Includes the upstream MSVC prebuilt/source-build fixes.
shiguredo_libvpx = "=2026.2.0-canary.3"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pollster = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"

# Upstream ships prebuilt Apple Silicon archives; Intel Macs build from source.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
shiguredo_libvpx = { version = "=2026.2.0-canary.3", features = ["source-build"] }

[target.'cfg(windows)'.dependencies]
nanalive-spout = { git = "https://github.com/sena-nana/nanalive-spout", rev = "72352c0da9bec2e11c2f4f6b28ddfd020525fbb7", default-features = false, features = ["gpu-dx11-shared"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Display",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Time",
    "Win32_Security_Cryptography",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
pollster = "1"
nana-ui-devtools = { workspace = true, features = ["runtime-agent"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole"] }
