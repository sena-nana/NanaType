[package]
name = "nanatype-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Capability-free Lua/Wasm plugins and bounded UI protocol"

[dependencies]
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "=49.0.0", default-features = false, features = ["runtime", "std"] }

[build-dependencies]
wasmtime = { version = "=49.0.0", default-features = false, features = ["runtime", "cranelift", "all-arch", "std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nanatype-plugin-worker"
path = "src/main.rs"
