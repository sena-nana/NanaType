[package]
name = "nanatype-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Capability-free Lua/Wasm plugins and bounded UI protocol"

[dependencies]
nanatype-diag.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmtime = { workspace = true, features = ["runtime", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
wasmtime = { workspace = true, features = ["runtime", "cranelift", "all-arch", "std"] }
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "nanatype-plugin-worker"
path = "src/main.rs"
