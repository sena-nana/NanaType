[package]
name = "nanatype-frame"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The framework NanaType and NanaType Editor share: skin rendering, the UI kit, previews and the plugin host"

[features]
default = []
# Embed crates/theme/fonts/ for the built-in skins (docs/fonts.md).
builtin-fonts = ["nanatype-theme/builtin-fonts"]

[dependencies]
nanatype-model.workspace = true
nanatype-markup.workspace = true
nanatype-theme.workspace = true
nanatype-i18n.workspace = true
nanatype-settings.workspace = true
nanatype-core.workspace = true
nanatype-plugins.workspace = true
nanatype-diag.workspace = true
nana-ui.workspace = true
nana-ui-core.workspace = true
nana-ui-platform.workspace = true
nana-text.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
ttf-parser = { workspace = true, features = ["std"] }
imagesize.workspace = true
tiny-skia.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }
blake3.workspace = true
pollster.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
wgpu = { workspace = true, features = ["metal"] }

# The GPU backends for both apps. On Windows NanaUI renders transparent windows
# through DirectComposition, which only DX12 drives; Vulkan and GLES would only
# serve as a fallback for machines with no DX12 adapter, and WARP is one.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Time"] }
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[dev-dependencies]
tempfile.workspace = true
nana-ui-devtools = { workspace = true, features = ["runtime-agent"] }
