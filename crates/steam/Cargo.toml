[package]
name = "nanatype-steam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NanaType on Steam: launch through Steam, Workshop items, and session transport"

[features]
# Link the Steamworks SDK. Without it every call is inert, so the app needs
# no Steam-specific code paths to build without Steam.
steamworks = ["dep:steamworks"]

[dependencies]
nanatype-p2p.workspace = true
steamworks = { version = "=0.13.1", optional = true, features = ["raw-bindings"] }
crossbeam-channel.workspace = true
tokio = { workspace = true, features = ["sync"] }
