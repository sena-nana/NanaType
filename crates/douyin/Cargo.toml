[package]
name = "nanatype-douyin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Douyin live chat with native Rust signing, transport and decoding"

[dependencies]
nanatype-secrets.workspace = true
serde_json.workspace = true
crossbeam-channel = "0.5"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
prost = "0.14"
flate2 = "1"
base64 = "0.22"
md-5 = "0.10"
sm3 = "0.4"
getrandom = "0.4"
url = "2"


[dev-dependencies]
tempfile = "3"
