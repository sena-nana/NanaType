[package]
name = "nanatype-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Two-person NanaType sessions over encrypted iroh connections"

[dependencies]
nanatype-diag.workspace = true
nanatype-model.workspace = true
nanatype-core.workspace = true
serde.workspace = true
serde_json.workspace = true
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "fs"] }
base64.workspace = true
blake3.workspace = true
rand = "0.10"
