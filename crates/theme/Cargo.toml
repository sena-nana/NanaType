[package]
name = "nanatype-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NanaType skin packages: manifest, inheritance, validation, install and export"

[features]
# Embed the fonts in `fonts/` for `builtin:` font references (docs/fonts.md).
# Off: nothing is embedded and those roles fall back to their `families`.
# With no font files in `fonts/` it adds nothing either way.
default = ["builtin-fonts"]
builtin-fonts = []
# Package authoring for NanaType Editor: drafts, in-place manifest edits,
# formatting and signing. NanaType itself installs and verifies without it.
editor = ["dep:toml_edit"]

[dependencies]
nana-ui-core.workspace = true
nanatype-model.workspace = true
nanatype-playback.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "display"] }
# The package editor edits manifests in place, keeping comments and key order.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"], optional = true }
# Skin export uses standard Deflate levels, without the optional Zopfli encoder.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
imagesize = "0.15"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
blake3 = "1"
ed25519-dalek = "3"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[build-dependencies]
serde_json.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"
# Noto Sans SC (OFL-1.1), already in every build through NanaUI: the test
# font for the `builtin:` font table.
nana-ui-core = { workspace = true, features = ["bundled-font-regular"] }
