[meta]
id = "nanatype.vanilla"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "minimal"]
name = { zh-CN = "香草", en-US = "Vanilla", ja-JP = "バニラ" }
description = { zh-CN = "极简白条与左侧强调色，名字收在框内，适合直播字幕", en-US = "A minimal white bar with an accent stripe and the name inside; made for streams", ja-JP = "左にアクセントラインのシンプルな白帯、名前は枠内に。配信向け" }
schema = 2

[chrome]
accent = "#4a7dff"
surface = "#ffffff"
text = "#22263a"

[dialogue]
region = [760, 170]
padding = [26, 46, 26, 14]
shader_effects = []

[dialogue.box]
contour = "rounded"
color = "#fffffff2"
border_color = "#4a7dff"
border_width = 0
border_widths = [0, 0, 0, 4]
radius = 0
radii = [0, 6, 6, 0]
gradient = { angle = 90, stops = [[0, "#eef3fff2"], [0.35, "#fffffff2"]] }
shadows = [{ color = "#22263a26", dy = 4, blur = 14 }]
frame = { image = "vanilla/still.png", slice = [44, 70, 18, 26], layout_inset = false }

[dialogue.text]
color = "#22263a"
size = 26

[dialogue.nameplate]
color = "#00000000"
text_color = "#4a7dff"
size = 16
radius = 0
padding = [0, 1]
offset = [26, 14]
border_color = "#4a7dff"
border_widths = [0, 0, 1, 0]

[dialogue.continue]
glyph = "●"
color = "#4a7dff"
size = 10
motion = "pulse"
period_s = 1.0

[history]
bubble_contour = "rounded"
name_color = "#4a7dff"
bubble_color = "#fffffff2"
bubble_border = "#4a7dff"
bubble_radius = 0
bubble_radii = [0, 6, 6, 0]
bubble_border_width = 0
bubble_shadows = [{ color = "#22263a14", dy = 2, blur = 8 }, { color = "#4a7dff", dx = 3, inset = true }]
avatar = { shape = "square", size = 36 }

[history.text]
color = "#22263a"

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0


[shaders.responsive_print]
source = "vanilla/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [1]

[shaders.compact_print]
source = "vanilla/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2]

[shaders.minimal_print]
source = "vanilla/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 72], box = { contour = "rounded", color = "#fffffff2", border_color = "#4a7dff", border_width = 0, border_widths = [0, 0, 0, 4], radius = 0, radii = [0, 6, 6, 0], gradient = { angle = 90, stops = [[0, "#eef3fff2"], [0.35, "#fffffff2"]] }, shadows = [{ color = "#22263a26", dy = 4, blur = 14 }], width_fraction = 1 }, nameplate = { color = "#00000000", text_color = "#4a7dff", size = 16, radius = 0, padding = [4, 4], offset = [-8, 12], border_color = "#4a7dff", border_widths = [0, 0, 1, 0], anchor = "top_right", rotate = 0 }, continue = { glyph = "●", color = "#4a7dff", size = 10, motion = "pulse", period_s = 1.0, anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#00000000", text_color = "#4a7dff", size = 16, radius = 0, padding = [0, 1], offset = [12, 4], border_color = "#4a7dff", border_widths = [0, 0, 1, 0], anchor = "top_left", rotate = 0 }, box = { contour = "rounded", color = "#fffffff2", border_color = "#4a7dff", border_width = 0, border_widths = [0, 0, 0, 4], radius = 0, radii = [0, 6, 6, 0], gradient = { angle = 90, stops = [[0, "#eef3fff2"], [0.35, "#fffffff2"]] }, shadows = [{ color = "#22263a26", dy = 4, blur = 14 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#00000000", text_color = "#4a7dff", size = 16, radius = 0, padding = [0, 1], offset = [12, 4], border_color = "#4a7dff", border_widths = [0, 0, 1, 0], anchor = "top_left", rotate = 0 }, box = { contour = "rounded", color = "#fffffff2", border_color = "#4a7dff", border_width = 0, border_widths = [0, 0, 0, 4], radius = 0, radii = [0, 6, 6, 0], gradient = { angle = 90, stops = [[0, "#eef3fff2"], [0.35, "#fffffff2"]] }, shadows = [{ color = "#22263a26", dy = 4, blur = 14 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { contour = "rounded", color = "#fffffff2", border_color = "#4a7dff", border_width = 0, border_widths = [0, 0, 0, 4], radius = 0, radii = [0, 6, 6, 0], gradient = { angle = 90, stops = [[0, "#eef3fff2"], [0.35, "#fffffff2"]] }, shadows = [{ color = "#22263a26", dy = 4, blur = 14 }], width_fraction = 1 } }
