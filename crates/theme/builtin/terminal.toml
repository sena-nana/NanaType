[meta]
id = "nanatype.terminal"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["retro", "minimal"]
name = { zh-CN = "终端", en-US = "Terminal", ja-JP = "ターミナル" }
description = { zh-CN = "黑底绿字的命令行窗口，带标题栏与闪烁光标", en-US = "A green-on-black console window with a title bar and a blinking cursor", ja-JP = "黒地に緑文字のコンソール。タイトルバーと点滅カーソル付き" }
schema = 2

[chrome]
appearance = "dark"
accent = "#33ff66"
surface = "#0d140e"
text = "#c8ffd4"

[fonts.body]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 400

[fonts.name]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 400

[fonts.accent]
families = ["Cascadia Mono", "Consolas", "Segoe UI Symbol"]
weight = 400

[dialogue]
padding = [22, 40, 22, 14]
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "terminal"
color = "#0a0f0af2"
border_color = "#1f5f2a"
border_width = 1
radius = 4
shadows = [{ color = "#33ff6626", blur = 16 }]

frame = { image = "terminal/still.png", slice = [28, 28, 16, 54], layout_inset = false }

[dialogue.text]
color = "#33ff66"
size = 24
letter_spacing = 0.5
shadow = { color = "#33ff6680", blur = 6 }

[dialogue.nameplate]
color = "#00000000"
text_color = "#33ff66"
size = 13
radius = 0
padding = [0, 0]
anchor = "top_right"
offset = [-12, 4]
text_shadow = { color = "#33ff6680", blur = 4 }

[dialogue.continue]
glyph = "█"
color = "#33ff66"
size = 16
motion = "blink"
period_s = 1.0

[dialogue.reveal]
base_ms = 35
cjk_factor = 1.6

[dialogue.reveal.entrance]
kind = "none"
ms = 0

[history]
name_size = 17
name_weight = 400
time_size = 12
entrance = "none"
panel = { color = "#0A0F0AF5", border_color = "#286637", border_width = 1, radius = 2, padding = [12, 12, 12, 12], margin = [8, 8, 8, 8] }
title = { text = "> HISTORY", color = "#33FF66", background = "#102416", size = 13, weight = 400, height = 36, padding = 14 }
bubble_contour = "terminal"
name_color = "#33ff66"
bubble_color = "#0a0f0ae6"
bubble_border = "#286637"
bubble_radius = 2
time_color = "#4f8f5e"
avatar = { shape = "square", size = 32, radius = 0, color = "#0A0F0A", ring_color = "#33ff66", ring_width = 1 }

[history.text]
color = "#33ff66"
size = 17
shadow = { color = "#33ff6660", blur = 4 }

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0

[shaders.artwork]
source = "terminal/artwork.wgsl"
period_s = 16
intensity = 1
