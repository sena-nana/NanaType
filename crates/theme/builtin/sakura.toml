[meta]
id = "nanatype.sakura"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["cute"]
name = { zh-CN = "樱花", en-US = "Sakura", ja-JP = "さくら" }
description = { zh-CN = "粉色渐变圆角框，花瓣点缀与爱心提示", en-US = "A pink gradient box with petals and a heart continue mark", ja-JP = "ピンクのグラデーションに花びらとハートのマーク" }
schema = 2

[chrome]
accent = "#f06a9c"
surface = "#ffffff"
text = "#5e2a42"

[fonts.accent]
families = ["Segoe UI Symbol", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[dialogue]
region = [760, 210]
padding = [30, 28, 28, 16]
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "rounded"
color = "#ffeef5f2"
border_color = "#f7a8c4"
border_width = 2
radius = 24
margin = [0, 0, 18, 0]
gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }
shadows = [{ color = "#f7a8c466", dy = 6, blur = 18 }]
frame = { image = "sakura/still.png", slice = [44, 142, 30, 30], layout_inset = false }

[dialogue.tail]
side = "bottom"
at = 0.8
width = 24
length = 18
lean = 8
color = "#ffe6efff"
shadow = false

[dialogue.text]
color = "#7a3050"

[dialogue.nameplate]
color = "#FAD7E5"
text_color = "#7a3050"
radius = 12
padding = [14, 3]
offset = [24, -14]
gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }
shadows = [{ color = "#ff8fb855", dy = 3, blur = 8 }]
border_color = "#F5B3CA"
border_width = 0.8

[dialogue.continue]
glyph = "♥"
color = "#f06a9c"
size = 16
motion = "pulse"
period_s = 1.0
offset = [-24, -10]

[history]
bubble_contour = "rounded"
name_color = "#f06a9c"
bubble_color = "#fff0f5f2"
bubble_border = "#f7a8c4"
bubble_border_width = 1.5
bubble_radius = 16
bubble_gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }
bubble_shadows = [{ color = "#f7a8c433", dy = 3, blur = 10 }]
name_plate = { color = "#FAD7E5", gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }, text_color = "#7A3050", border_color = "#F5B3CA", border_width = 0.8, radius = 12, padding = [8, 1] }
avatar = { shape = "circle", size = 40, ring_color = "#ffb3cf", ring_width = 2 }
time_color = "#c48aa2"

[history.text]
color = "#7a3050"

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0

[shaders.artwork]
source = "sakura/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["sakura/ornament.png"]
