[meta]
id = "nanatype.sakura"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["cute"]
name = { zh-CN = "樱花", en-US = "Sakura", ja-JP = "さくら" }
description = { zh-CN = "粉色渐变圆角框，花瓣点缀与爱心提示", en-US = "A pink gradient box with petals and a heart continue mark", ja-JP = "ピンクのグラデーションに花びらとハートのマーク" }
schema = 2

[chrome]
accent = "#f06a9c"
surface = "#ffffff"
text = "#5e2a42"

[fonts.accent]
families = ["Segoe UI Symbol", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[dialogue]
region = [760, 210]
padding = [30, 28, 28, 16]
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "rounded"
color = "#ffeef5f2"
border_color = "#f7a8c4"
border_width = 2
radius = 24
margin = [0, 0, 18, 0]
gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }
shadows = [{ color = "#f7a8c466", dy = 6, blur = 18 }]
frame = { image = "sakura/still.png", slice = [44, 142, 30, 30], layout_inset = false }

[dialogue.tail]
side = "bottom"
at = 0.8
width = 24
length = 18
lean = 8
color = "#ffe6efff"
shadow = false

[dialogue.text]
color = "#7a3050"

[dialogue.nameplate]
color = "#FAD7E5"
text_color = "#7a3050"
radius = 12
padding = [14, 3]
offset = [24, -14]
gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }
shadows = [{ color = "#ff8fb855", dy = 3, blur = 8 }]
border_color = "#F5B3CA"
border_width = 0.8

[dialogue.continue]
glyph = "♥"
color = "#f06a9c"
size = 16
motion = "pulse"
period_s = 1.0
offset = [-24, -10]

[history]
bubble_contour = "rounded"
name_color = "#f06a9c"
bubble_color = "#fff0f5f2"
bubble_border = "#f7a8c4"
bubble_border_width = 1.5
bubble_radius = 16
bubble_gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }
bubble_shadows = [{ color = "#f7a8c433", dy = 3, blur = 10 }]
name_plate = { color = "#FAD7E5", gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }, text_color = "#7A3050", border_color = "#F5B3CA", border_width = 0.8, radius = 12, padding = [8, 1] }
avatar = { shape = "circle", size = 40, ring_color = "#ffb3cf", ring_width = 2 }
time_color = "#c48aa2"

[history.text]
color = "#7a3050"

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0

[shaders.artwork]
source = "sakura/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["sakura/ornament.png"]


[shaders.responsive_print]
source = "sakura/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [1]
textures = ["sakura/ornament.png"]

[shaders.compact_print]
source = "sakura/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [2]
textures = ["sakura/ornament.png"]

[shaders.minimal_print]
source = "sakura/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]
textures = ["sakura/ornament.png"]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 72], box = { contour = "rounded", color = "#ffeef5f2", border_color = "#f7a8c4", border_width = 2, radius = 24, margin = [0, 0, 18, 0], gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }, shadows = [{ color = "#f7a8c466", dy = 6, blur = 18 }], width_fraction = 1 }, nameplate = { color = "#FAD7E5", text_color = "#7a3050", radius = 12, padding = [4, 4], offset = [-8, 12], gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }, shadows = [{ color = "#ff8fb855", dy = 3, blur = 8 }], border_color = "#F5B3CA", border_width = 0.8, anchor = "top_right", rotate = 0 }, continue = { glyph = "♥", color = "#f06a9c", size = 16, motion = "pulse", period_s = 1.0, offset = [12, -8], anchor = "bottom_left" }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#FAD7E5", text_color = "#7a3050", radius = 12, padding = [14, 3], offset = [12, 4], gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }, shadows = [{ color = "#ff8fb855", dy = 3, blur = 8 }], border_color = "#F5B3CA", border_width = 0.8, anchor = "top_left", rotate = 0 }, box = { contour = "rounded", color = "#ffeef5f2", border_color = "#f7a8c4", border_width = 2, radius = 24, margin = [0, 0, 18, 0], gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }, shadows = [{ color = "#f7a8c466", dy = 6, blur = 18 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#FAD7E5", text_color = "#7a3050", radius = 12, padding = [14, 3], offset = [12, 4], gradient = { angle = 180, stops = [[0, "#FFEAF2"], [1, "#FACBDE"]] }, shadows = [{ color = "#ff8fb855", dy = 3, blur = 8 }], border_color = "#F5B3CA", border_width = 0.8, anchor = "top_left", rotate = 0 }, box = { contour = "rounded", color = "#ffeef5f2", border_color = "#f7a8c4", border_width = 2, radius = 24, margin = [0, 0, 0, 0], gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }, shadows = [{ color = "#f7a8c466", dy = 6, blur = 18 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { contour = "rounded", color = "#ffeef5f2", border_color = "#f7a8c4", border_width = 2, radius = 24, margin = [0, 0, 0, 0], gradient = { angle = 135, stops = [[0, "#fff0f5f5"], [1, "#ffe1ecf2"]] }, shadows = [{ color = "#f7a8c466", dy = 6, blur = 18 }], width_fraction = 1 } }
