[meta]
id = "nanatype.comic"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["game", "cute"]
name = { zh-CN = "漫画", en-US = "Comic", ja-JP = "コミック" }
description = { zh-CN = "黑色粗线、硬投影和带影子的尾巴，黄色倾斜名牌", en-US = "Heavy black lines, a hard drop shadow, a shadowed tail and a tilted yellow tag", ja-JP = "太い黒線とベタ影、影つきのしっぽ、傾いた黄色の名札" }
schema = 2

[chrome]
accent = "#ffcc00"
surface = "#ffffff"
text = "#111111"

[fonts.body]
weight = 800

[fonts.name]
weight = 900

[dialogue]
region = [760, 202]
padding = [28, 30, 28, 18]
shader_effects = []

[dialogue.box]
contour = "comic"
color = "#ffffff"
border_color = "#000000"
border_width = 4
radius = 14
margin = [32, 8, 30, 0]
shadows = [{ color = "#000000", dx = 8, dy = 8 }]
frame = { image = "comic/still.png", slice = [52, 86, 32, 32], layout_inset = false }

[dialogue.tail]
side = "bottom"
at = 0.12
width = 36
length = 28
lean = -12

[dialogue.text]
color = "#111111"

[dialogue.nameplate]
contour = "ribbon"
color = "#ffd400"
text_color = "#111111"
radius = 4
padding = [14, 3]
offset = [22, -20]
border_color = "#000000"
border_width = 3
rotate = -3
shadows = [{ color = "#000000", dx = 4, dy = 4 }]
gradient = { angle = 180, stops = [[0, "#FFDE40"], [1, "#FFCA00"]] }

[dialogue.continue]
glyph = "▶"
color = "#111111"
motion = "pulse"
period_s = 0.8
offset = [-24, -14]

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0
shake_px = 2.4
jump_px = 8
screen_shake_px = 10

[history]
bubble_contour = "comic"
name_color = "#111111"
bubble_color = "#ffffff"
bubble_border = "#000000"
bubble_border_width = 3
bubble_radius = 8
bubble_shadows = [{ color = "#000000", dx = 4, dy = 3 }]
name_plate = { contour = "ribbon", color = "#ffd400", text_color = "#111111", radius = 3, padding = [9, 2] }
avatar = { shape = "circle", size = 40, ring_color = "#000000", ring_width = 3 }

[history.text]
color = "#111111"
