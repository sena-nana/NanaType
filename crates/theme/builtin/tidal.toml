[meta]
schema = 2
id = "nanatype.tidal"
version = "1.1.2"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "elegant"]
name = { zh-CN = "潮汐水族馆", en-US = "Tidal Aquarium", ja-JP = "潮のアクアリウム" }
description = { zh-CN = "流体玻璃、水母标本与深海阅读面；完整程序版画", en-US = "Original procedural print artwork", ja-JP = "オリジナルのプロシージャル版画" }

[chrome]
appearance = "dark"
accent = "#79D4CE"
surface = "#103D49"
text = "#E5F8F5"

[dialogue]
region = [920, 220]
overscan = 16
padding = [38, 66, 211, 30]
shader_effects = [{ shader = "artwork", target = "artwork" }]
box = { color = "#103D49", border_color = "#EEF9F6", frame = { image = "tidal/still.png", slice = [0, 0, 0, 0] } }
text = { color = "#E5F8F5", size = 26, line_height = 1.45 }
nameplate = { color = "#EEF9F6", text_color = "#103D49", border_color = "#79D4CE", border_width = 1, gradient = { angle = 160, stops = [[0, "#FFFFFF"], [0.45, "#EEF9F6"], [1, "#CBE6DF"]] }, radius = 14, padding = [12, 3], offset = [38, 13], size = 19 }
continue = { glyph = "· · ·", color = "#79D4CE", motion = "none" }

[shaders.artwork]
static_fallback = true
source = "tidal/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["tidal/ornament.png"]

[shaders.responsive_artwork]
static_fallback = true
source = "tidal/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["tidal/ornament.png"]
params = [1, 1]

[shaders.responsive_compact]
static_fallback = true
source = "tidal/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["tidal/ornament.png"]
params = [1, 0, 1]

[history]
name_color = "#79D4CE"
time_color = "#A1CFCB"
bubble_color = "#103D49"
bubble_border = "#EEF9F690"
bubble_border_width = 1
bubble_contour = "chat"
bubble_radius = 16
bubble_gradient = { angle = 160, stops = [[0, "#245A65"], [0.4, "#154754"], [1, "#103D49"]] }
bubble_shadows = [{ color = "#EEF9F633", spread = 2, inset = true }, { color = "#001E2926", dy = 2, blur = 6 }]
name_plate = { color = "#EEF9F6", text_color = "#103D49", gradient = { angle = 160, stops = [[0, "#FFFFFF"], [0.45, "#EEF9F6"], [1, "#CBE6DF"]] }, border_color = "#79D4CE", border_width = 1, radius = 10, padding = [9, 2] }
avatar = { shape = "circle", size = 36, color = "#CBE6DF", ring_color = "#79D4CE", ring_width = 1 }
panel = { color = "#0B303BF5", border_color = "#79D4CE", border_width = 1, radius = 20, padding = [14, 14, 14, 18], margin = [8, 8, 8, 8], shadows = [{ color = "#EEF9F626", spread = 4, inset = true }] }
title = { text = "HISTORY", color = "#EEF9F6", size = 14, weight = 500, height = 56, padding = 18 }
text = { color = "#E5F8F5" }

[[history.decor]]
inset = [6, 6, 6, 6]
border_color = "#79D4CE50"
border_width = 0.8
radius = 15
layer = "below"

[[history.decor]]
anchor = "top_right"
offset = [-12, 4]
size = [40, 48]
image = "tidal/ornament.png"

[[history.decor]]
anchor = "bottom_right"
offset = [-12, -12]
size = [64, 96]
image = "tidal/ornament.png"
opacity = 0.10
layer = "below"

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#103D49", border_color = "#EEF9F6", width_fraction = 1, border_width = 1, radius = 18 }, nameplate = { color = "#EEF9F6", text_color = "#103D49", border_color = "#79D4CE", border_width = 1, gradient = { angle = 160, stops = [[0, "#FFFFFF"], [0.45, "#EEF9F6"], [1, "#CBE6DF"]] }, radius = 14, padding = [4, 4], offset = [-8, 12], size = 19, anchor = "top_right", rotate = 0 }, continue = { glyph = "· · ·", color = "#79D4CE", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [{ color = "#226774", opacity = 0.9, contour = "rounded", radius = 999, size = [112, 112], aspect_ratio = 1, anchor = "bottom_left", offset = [12, -24], max_fraction = [0.32, 0.18], min_window = [240, 360] }, { image = "tidal/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 52, 16], nameplate = { color = "#EEF9F6", text_color = "#103D49", border_color = "#79D4CE", border_width = 1, gradient = { angle = 160, stops = [[0, "#FFFFFF"], [0.45, "#EEF9F6"], [1, "#CBE6DF"]] }, radius = 14, padding = [12, 3], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#103D49", border_color = "#EEF9F6", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [{ image = "tidal/ornament.png", size = [32, 40], aspect_ratio = 0.8, anchor = "bottom_right", offset = [-8, -8], min_window = [280, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#EEF9F6", text_color = "#103D49", border_color = "#79D4CE", border_width = 1, gradient = { angle = 160, stops = [[0, "#FFFFFF"], [0.45, "#EEF9F6"], [1, "#CBE6DF"]] }, radius = 14, padding = [12, 3], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#103D49", border_color = "#EEF9F6", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 84], decor = [{ image = "tidal/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 92], decor = [{ color = "#226774", opacity = 0.9, contour = "rounded", radius = 999, size = [56, 56], aspect_ratio = 1, anchor = "bottom_left", offset = [12, -18], max_fraction = [0.32, 0.18], min_window = [240, 280] }, { image = "tidal/ornament.png", size = [56, 70], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 }, min_window = [160, 260] }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_compact", target = "artwork" }], box = { color = "#103D49", border_color = "#EEF9F6", width_fraction = 1, border_width = 1, radius = 18 } }
