[meta]
schema = 2
id = "nanatype.machine_learning"
version = "1.0.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["minimal", "game"]
name = { zh-CN = "机器学习", en-US = "Machine Learning", ja-JP = "機械学習" }
description = { zh-CN = "石墨黑神经实验室，字符快速演算并锁定，整段乱码随机消隐", en-US = "A graphite neural lab: characters scramble, lock in, and vanish in random order", ja-JP = "黒鉛色のニューラルラボ。文字が高速に変換・収束し、ランダムに消える" }

[chrome]
appearance = "dark"
accent = "#64E8E0"
surface = "#0B101C"
text = "#B7F4F1"

[fonts.body]
families = ["Segoe UI", "Microsoft YaHei UI", "Noto Sans CJK SC", "sans-serif"]
weight = 400

[fonts.name]
families = ["Segoe UI", "Microsoft YaHei UI", "Noto Sans CJK SC", "sans-serif"]
weight = 500

[dialogue]
region = [860, 200]
overscan = 16
padding = [28, 50, 28, 24]
box = { color = "#0B101CEB", border_color = "#365264", border_width = 1, radius = 4, contour = "hud" }
text = { color = "#B7F4F1", size = 28, line_height = 1.45 }
nameplate = { color = "#00000000", text_color = "#64E8E0", size = 16, padding = [0, 0], offset = [28, 14] }
portrait = { visible = false }
continue = { glyph = "", motion = "none" }
shader_effects = [{ shader = "network", target = "background" }]

[dialogue.reveal]
entrance = { kind = "fade", ms = 185 }
exit = { ms = 400, scope = "text" }
scramble = { alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+-=<>[]{}()/", interval_ms = 25, entrance_ms = 140, exit_hold_ms = 80, exit_ms = 400 }

[shaders.network]
source = "machine_learning/artwork.wgsl"
animated = false
static_fallback = true

[history]
name_color = "#64E8E0"
time_color = "#8193A8"
avatar = { shape = "square", size = 28, radius = 4, color = "#152232", ring_color = "#365264", ring_width = 1 }
bubble_color = "#0B101CEB"
bubble_border = "#365264"
bubble_border_width = 1
bubble_contour = "hud"
bubble_radius = 4
bubble_padding = [16, 12]
entrance = "none"
text = { color = "#B7F4F1", size = 19, line_height = 1.45 }

[dialogue.responsive]
landscape = {}
portrait = { padding = [22, 50, 52, 26], nameplate = { anchor = "top_right", color = "#00000000", text_color = "#64E8E0", size = 16, padding = [0, 0], offset = [-22, 14] } }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [18, 46, 18, 18], nameplate = { anchor = "top_left", color = "#00000000", text_color = "#64E8E0", size = 16, padding = [0, 0], offset = [18, 12] } }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [14, 46, 40, 18], nameplate = { anchor = "top_right", color = "#00000000", text_color = "#64E8E0", size = 14, padding = [0, 0], offset = [-12, 12] } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, shader_effects = [] }
