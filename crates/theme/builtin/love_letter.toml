[meta]
schema = 2
id = "nanatype.love_letter"
version = "1.0.0"
author = "NanaType"
license = "CC0-1.0 (design); Arphic Public License (stroke data); OFL-1.1 (font)"
tags = ["cute", "elegant"]
name = { zh-CN = "情书", en-US = "Love Letter", ja-JP = "ラブレター" }
description = { zh-CN = "奶油信纸与玫瑰墨迹，按笔顺错峰书写，整段温柔消融", en-US = "Rose ink on cream stationery, overlapping handwritten strokes and a shared ink dissolve", ja-JP = "クリーム色の便箋に薔薇色のインク。筆順に沿って綴り、文章全体が溶けてゆく" }

[chrome]
appearance = "light"
accent = "#BA7385"
surface = "#FFF9EF"
text = "#784B56"

[fonts.body]
file = "love_letter/fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
weight = 400

[fonts.name]
file = "love_letter/fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
weight = 400

[dialogue]
region = [900, 240]
overscan = 16
padding = [42, 58, 38, 30]
box = { color = "#FFF9EF", border_color = "#DDB7BB", border_width = 1, radius = 7, material = "paper", shadow = { color = "#6D3F4B18", dy = 3, blur = 12 } }
text = { color = "#784B56", size = 32, line_height = 1.6 }
nameplate = { color = "#00000000", text_color = "#AE6F80", size = 19, padding = [0, 0], offset = [42, 18] }
portrait = { visible = false }
continue = { glyph = "♡", color = "#BA7385", size = 17, motion = "none", offset = [-18, -12] }

[[dialogue.decor]]
anchor = "top_right"
offset = [-18, 16]
size = [24, 24]
text = "♡"
text_color = "#CA95A2"
text_size = 24

[[dialogue.decor]]
anchor = "top_left"
offset = [26, 45]
size = ["92%", 1]
color = "#DDB7BB70"

[dialogue.reveal]
entrance = { kind = "fade", ms = 500, material = "write", scope = "glyph" }
exit = { ms = 700, material = "dissolve", scope = "text" }
handwriting = { data = "love_letter/strokes.nthz" }

[materials.write]
source = "love_letter/write.wgsl"

[materials.dissolve]
source = "love_letter/dissolve.wgsl"

[materials.paper]
source = "love_letter/paper.wgsl"

[history]
panel = { color = "#FFF9EF", border_color = "#DDB7BB", border_width = 1, radius = 7, padding = [16, 14, 16, 14], margin = [8, 8, 8, 8], material = "paper" }
name_color = "#AE6F80"
name_weight = 400
time_color = "#947778"
avatar = { shape = "none" }
bubble_color = "#FFF9EF"
bubble_border = "#DDB7BB"
bubble_border_width = 1
bubble_radius = 7
bubble_padding = [20, 14]
bubble_material = "paper"
text = { color = "#784B56", size = 23, line_height = 1.6 }

[effects]
contrast_guard = 0

[dialogue.responsive]
landscape = {}
portrait = { padding = [24, 58, 24, 30], nameplate = { anchor = "top_right", color = "#00000000", text_color = "#AE6F80", size = 19, padding = [0, 0], offset = [-24, 16] }, decor = [{ anchor = "bottom_left", offset = [16, -16], size = [24, 24], text = "♡", text_color = "#CA95A2", text_size = 24 }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [22, 52, 22, 24], nameplate = { color = "#00000000", text_color = "#AE6F80", size = 18, padding = [0, 0], offset = [22, 15] }, decor = [{ anchor = "top_right", offset = [-16, 12], size = [22, 22], text = "♡", text_color = "#CA95A2", text_size = 22 }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [12, 14, 12, 14], nameplate = { visible = false }, decor = [] }
