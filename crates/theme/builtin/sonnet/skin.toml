[chrome]
accent = "#e5bf83"
appearance = "dark"
surface = "#29262b"
text = "#fff8ea"

[dialogue]
overscan = 16.0
padding = [36.0, 48.0, 36.0, 28.0]
region = [960.0, 190.0]

[dialogue.box]
border_color = "#cbe0ef"

[dialogue.continue]
bob_px = 3.0
color = "#0876d0"

[[dialogue.decor]]
anchor = "top_left"
border_style = "solid"
border_width = 0.0
color = "#e5bf83cc"
font = "accent"
layer = "above"
offset = [17.0, 16.0]
opacity = 1.0
polygon = [[50.0, 0.0], [60.0, 40.0], [100.0, 50.0], [60.0, 60.0], [50.0, 100.0], [40.0, 60.0], [0.0, 50.0], [40.0, 40.0]]
radius = 0.0
rotate = 0.0
shadows = []
size = [9.0, 9.0]
text = ""
text_color = "text"
text_size = 16.0
when = "always"

[[dialogue.decor]]
anchor = "top_right"
border_style = "solid"
border_width = 0.0
color = "#e5bf8366"
font = "accent"
layer = "above"
offset = [-32.0, 25.0]
opacity = 1.0
polygon = []
radius = 0.0
rotate = 0.0
shadows = []
size = [100.0, 1.0]
text = ""
text_color = "text"
text_size = 16.0
when = "always"

[dialogue.nameplate]
offset = [36.0, 12.0]
padding = [0.0, 0.0]
radius = 10.0
text_color = "#e5bf83"

[dialogue.nameplate.stroke]
color = "#211b2580"
width = 0.6000000238418579

[dialogue.responsive.landscape]

[dialogue.responsive.portrait]
padding = [24.0, 50.0, 24.0, 36.0]

[[dialogue.responsive.portrait.decor]]
anchor = "bottom_left"
aspect_ratio = 1.0
