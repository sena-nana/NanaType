text_color = "text"
text_size = 16.0
when = "always"

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-18.0, 14.0]

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
padding = [18.0, 42.0, 18.0, 22.0]

[[dialogue.responsive.rules.layout.decor]]
anchor = "top_left"
border_style = "solid"
border_width = 0.0
color = "#e5bf83cc"
font = "accent"
layer = "above"
