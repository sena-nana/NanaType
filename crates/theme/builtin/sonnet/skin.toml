[[dialogue.responsive.rules.layout.decor]]
anchor = "top_right"
border_style = "solid"
border_width = 0.0
color = "#e5bf8366"
font = "accent"
layer = "above"
max_fraction = [0.30000001192092896, 1.0]
min_window = [240.0, 140.0]
offset = [-32.0, 25.0]
opacity = 1.0
polygon = []
radius = 0.0
rotate = 0.0
shadows = []
size = [100.0, 1.0]
text = ""
text_color = "text"
text_size = 16.0
when = "always"

[dialogue.responsive.rules.layout.nameplate]
offset = [36.0, 10.0]
size = 17.0

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 14.0, 12.0, 14.0]
unset = ["nameplate.stroke"]

[dialogue.responsive.rules.layout.nameplate]
color = "#0876d0"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
text_color = "#ffffff"
visible = false

[dialogue.reveal.entrance]
kind = "fade"
material = "appear"
ms = 360

[dialogue.reveal.exit]
material = "dissolve"
ms = 700
scope = "text"

[dialogue.reveal.light]
color = "#ffd593"
intensity = 1.0
radius = 12.0

[dialogue.text]
color = "#fff8ea"
line_height = 1.5499999523162842
size = 32.0

[dialogue.text.shadow]
blur = 3.0
color = "#17121db0"
dx = 0.0
dy = 1.0

[dialogue.text.stroke]
color = "#29222b99"
width = 0.800000011920929

[fonts.body]
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
weight = 400

[fonts.latin]
families = ["Tangerine", "Segoe Script", "Noto Sans SC"]
file = "builtin:fonts/Tangerine-Bold.ttf"
weight = 700

[fonts.name]
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
weight = 400

[history]
