border_width = 0.0
color = "#e5bf83cc"
font = "accent"
layer = "above"
offset = [17.0, -20.0]
opacity = 1.0
polygon = [[50.0, 0.0], [60.0, 40.0], [100.0, 50.0], [60.0, 60.0], [50.0, 100.0], [40.0, 60.0], [0.0, 50.0], [40.0, 40.0]]
radius = 0.0
rotate = 0.0
shadows = []
