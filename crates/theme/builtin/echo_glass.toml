# Design reference: https://github.com/sheep-realms/Echo-Live (Sheep-realms and contributors).
# CC0-1.0 below covers NanaType's own contributions to this local skin implementation.
[meta]
id = "nanatype.echo_glass"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming"]
name = { zh-CN = "Echo-Live 玻璃", en-US = "Echo-Live Glass", ja-JP = "Echo-Live ガラス" }
description = { zh-CN = "还原 Echo-Live 的玻璃主题：自下而上的黑色渐变、黑边白字，菜单栏靠右", en-US = "Echo-Live's glass theme: a black fade rising from the bottom, outlined white text and a right-aligned menu row", ja-JP = "Echo-Live のガラステーマを再現：下から立ち上がる黒のグラデーション、縁取りの白文字、右寄せメニュー" }
schema = 2

[chrome]
appearance = "dark"
accent = "#1a62be"
surface = "#1a1a20"
text = "#ffffff"

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

# Echo-Live draws on a 1920-wide page; every length here is two thirds of it.
# Its columns are 1 : 6 : 1, and the menu row is 4em tall.
[dialogue]
region = [1280, 180]
padding = [173, 52, 173, 50]
shader_effects = []

[dialogue.box]
color = "#00000000"
border_width = 0
radius = 0
gradient = { angle = 0, stops = [[0, "#00000099"], [0.45, "#00000080"], [1, "#00000000"]] }

# The menu row's own darker fade.

[[dialogue.decor]]
anchor = "bottom"
size = ["100%", 70]
gradient = { angle = 0, stops = [[0, "#000000"], [1, "#00000000"]] }

# SAVE LOAD Q.SAVE Q.LOAD ⭰ ⯬ 🡄 🡆 ⯮ ⭲ HISTORY ╳, flush right.
[[dialogue.decor]]
anchor = "bottom_right"
offset = [-569, -26]
size = [46, 22]
text = "SAVE"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_right"
offset = [-508, -26]
size = [48, 22]
text = "LOAD"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_right"
offset = [-433, -26]
size = [62, 22]
text = "Q.SAVE"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_right"
offset = [-356, -26]
size = [64, 22]
text = "Q.LOAD"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_right"
offset = [-291, -26]
size = [52, 22]
text = "« ‹ › »"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_right"
offset = [-200, -26]
size = [78, 22]
text = "HISTORY"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_right"
offset = [-169, -26]
size = [18, 22]
text = "✕"
when = "display"
text_color = "#dddddd"
text_size = 18
font = "body"

[dialogue.text]
color = "#ffffff"
size = 27
stroke = { color = "#000000", width = 1.5 }
shadow = { color = "#000000", blur = 2.5 }

[dialogue.nameplate]
color = "#00000000"
text_color = "#ffffff"
size = 27
radius = 0
padding = [0, 0]
offset = [146, 13]
stroke = { color = "#000000", width = 1.5 }
text_shadow = { color = "#000000", blur = 2.5 }

[dialogue.continue]
glyph = ""
motion = "none"

# 30 ms a character; CJK skips a tick.
[dialogue.reveal]
base_ms = 30
cjk_factor = 2.0
punct = { comma_ms = 0, stop_ms = 0, ellipsis_ms = 0 }

[dialogue.reveal.entrance]
kind = "none"
ms = 0

# Echo-Live's history page at half size (its base font is 36px): one row
# per line with name, message and HH:MM:SS side by side, no bubbles.
[history]
width = 640
height = 480
layout = "inline"
name_width = 124
name_size = 18
time_size = 16
time_seconds = true
gap = 9
entrance = "none"
# Like Echo-Live, the line still on the dialogue box joins once it clears.
hide_latest = true
bubble_color = "#00000000"
bubble_border_width = 0
bubble_radius = 0
bubble_padding = [0, 0]
avatar = { shape = "none" }
name_weight = 400
name_color = "#ffffff"
name_stroke = { color = "#000000", width = 1.5 }
time_color = "#dddddd"
panel = { color = "#00000000", padding = [18, 18, 18, 18], gradient = { stops = [[0, "#00000099"], [0.15, "#00000099"], [1, "#00000000"]] } }

[history.text]
color = "#ffffff"
size = 18
line_height = 1.4
stroke = { color = "#000000", width = 1 }
shadow = { color = "#000000", blur = 2 }
