[meta]
id = "nanatype.parchment"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["classic", "elegant"]
name = { zh-CN = "羊皮纸", en-US = "Parchment", ja-JP = "羊皮紙" }
description = { zh-CN = "暖色纸张、双线边框与花饰，配宋体", en-US = "Warm paper with a double rule, a fleuron and a serif face", ja-JP = "温かい紙に二重罫と花飾り、明朝体" }
schema = 2

[chrome]
accent = "#7a4824"
surface = "#fffcf5"
text = "#3e2a1c"

[fonts.body]
families = ["Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC"]
weight = 600

[fonts.name]
families = ["Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC"]
weight = 700

[fonts.accent]
families = ["Segoe UI Symbol", "Noto Serif SC", "SimSun"]
weight = 400

[dialogue]
padding = [28, 28, 28, 18]
shader_effects = []

[dialogue.box]
color = "#f4e4c4"
border_color = "#7a5430"
border_width = 2
radius = 6
gradient = { kind = "radial", stops = [[0, "#fbf1dc"], [1, "#ecd6ae"]] }
shadow = { color = "#3c1e0a59", dy = 6, blur = 14 }

frame = { image = "parchment/still.png", slice = [60, 152, 60, 152], layout_inset = false }

[dialogue.text]
color = "#3e2a1c"
size = 30

[dialogue.nameplate]
color = "#5c341c"
text_color = "#fff4dc"
size = 20
radius = 2
padding = [14, 3]
offset = [24, -16]
shadows = [{ color = "#3c1e0a40", dy = 2, blur = 4 }]
border_color = "#C9A46A"
border_width = 1
gradient = { angle = 180, stops = [[0, "#75462B"], [1, "#51301F"]] }

[dialogue.continue]
color = "#7a4824"

[history]
name_color = "#7a4824"
bubble_color = "#f4e4c4f0"
bubble_border = "#7a543099"
bubble_radius = 6
bubble_gradient = { kind = "radial", stops = [[0, "#fbf1dcf5"], [1, "#ecd6aef0"]] }
bubble_shadows = [{ color = "#3c1e0a26", dy = 2, blur = 6 }]
time_color = "#967e66"
avatar = { shape = "circle", size = 40, ring_color = "#7a5430", ring_width = 2 }

[history.text]
color = "#3e2a1c"

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0
