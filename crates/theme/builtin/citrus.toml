[meta]
schema = 2
id = "nanatype.citrus"
version = "1.1.2"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "cute"]
name = { zh-CN = "柠檬汽水", en-US = "Citrus Soda", ja-JP = "シトラスソーダ" }
description = { zh-CN = "汽水标签、水果剖面与网点拼贴；完整程序版画", en-US = "Original procedural print artwork", ja-JP = "オリジナルのプロシージャル版画" }

[chrome]
appearance = "light"
accent = "#F4A340"
surface = "#FFF8DD"
text = "#644A28"

[dialogue]
region = [920, 220]
overscan = 16
padding = [69, 68, 202, 28]
shader_effects = [{ shader = "artwork", target = "artwork" }]
box = { color = "#FFF8DD", border_color = "#73BDA8", frame = { image = "citrus/still.png", slice = [0, 0, 0, 0] } }
text = { color = "#644A28", size = 26, line_height = 1.45 }
nameplate = { color = "#F4A340", text_color = "#4C351D", border_color = "#FFF8DD", border_width = 1, gradient = { angle = 180, stops = [[0, "#FFD17C"], [1, "#F4A340"]] }, shadows = [{ color = "#73BDA87A", dy = 2, blur = 0 }], radius = 3, padding = [12, 3], offset = [69, 12], rotate = -2, size = 19 }
continue = { glyph = "· · ·", color = "#F4A340", motion = "none" }

[shaders.artwork]
static_fallback = true
source = "citrus/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["citrus/ornament.png"]

[shaders.responsive_artwork]
static_fallback = true
source = "citrus/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["citrus/ornament.png"]
params = [1, 1]

[shaders.responsive_compact]
static_fallback = true
source = "citrus/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["citrus/ornament.png"]
params = [1, 0, 1]

[history]
name_color = "#644A28"
time_color = "#7B7650"
bubble_color = "#FFF8DD"
bubble_border = "#73BDA8"
bubble_border_width = 1
bubble_contour = "slant"
bubble_radius = 3
bubble_gradient = { angle = 135, stops = [[0, "#FFFCED"], [1, "#FFF1C4"]] }
bubble_shadows = [{ color = "#73BDA870", dx = 2, dy = 2 }]
name_plate = { color = "#F4A340", text_color = "#4C351D", gradient = { angle = 180, stops = [[0, "#FFD17C"], [1, "#F4A340"]] }, border_color = "#FFF8DD", border_width = 1, shadows = [{ color = "#73BDA8", dy = 2 }], radius = 3, padding = [9, 2] }
avatar = { shape = "square", size = 36, radius = 3, color = "#F4A340", ring_color = "#FFF8DD", ring_width = 1 }
panel = { color = "#FFF8DDFA", border_color = "#73BDA8", border_width = 1, radius = 4, padding = [14, 14, 14, 18], margin = [8, 10, 10, 8], shadows = [{ color = "#73BDA8", dx = 2, dy = 2 }] }
title = { text = "HISTORY", color = "#4C351D", background = "#D4EADF", size = 14, weight = 600, height = 56, padding = 18 }
text = { color = "#644A28" }

[[history.decor]]
anchor = "top_right"
size = [74, 56]
polygon = [[30, 0], [100, 0], [100, 100], [0, 100]]
color = "#73BDA8"
layer = "below"

[[history.decor]]
anchor = "top_right"
offset = [-12, 6]
size = [44, 44]
image = "citrus/ornament.png"

[[history.decor]]
anchor = "bottom_right"
offset = [-14, -14]
size = [64, 64]
motif = "citrus_slice"
color = "#F4A340"
opacity = 0.14
layer = "below"

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#FFF8DD", border_color = "#73BDA8", width_fraction = 1, border_width = 1, radius = 18 }, nameplate = { color = "#F4A340", text_color = "#4C351D", border_color = "#FFF8DD", border_width = 1, gradient = { angle = 180, stops = [[0, "#FFD17C"], [1, "#F4A340"]] }, shadows = [{ color = "#73BDA87A", dy = 2, blur = 0 }], radius = 3, padding = [4, 4], offset = [-8, 12], rotate = 0, size = 19, anchor = "top_right" }, continue = { glyph = "· · ·", color = "#F4A340", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [{ image = "citrus/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 52, 16], nameplate = { color = "#F4A340", text_color = "#4C351D", border_color = "#FFF8DD", border_width = 1, gradient = { angle = 180, stops = [[0, "#FFD17C"], [1, "#F4A340"]] }, shadows = [{ color = "#73BDA87A", dy = 2, blur = 0 }], radius = 3, padding = [12, 3], offset = [12, 4], rotate = 0, size = 19, anchor = "top_left" }, box = { color = "#FFF8DD", border_color = "#73BDA8", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [{ image = "citrus/ornament.png", size = [32, 40], aspect_ratio = 0.8, anchor = "bottom_right", offset = [-8, -8], min_window = [280, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#F4A340", text_color = "#4C351D", border_color = "#FFF8DD", border_width = 1, gradient = { angle = 180, stops = [[0, "#FFD17C"], [1, "#F4A340"]] }, shadows = [{ color = "#73BDA87A", dy = 2, blur = 0 }], radius = 3, padding = [12, 3], offset = [12, 4], rotate = 0, size = 19, anchor = "top_left" }, box = { color = "#FFF8DD", border_color = "#73BDA8", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 84], decor = [{ image = "citrus/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 92], decor = [{ image = "citrus/ornament.png", size = [56, 70], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 }, min_window = [160, 260] }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_compact", target = "artwork" }], box = { color = "#FFF8DD", border_color = "#73BDA8", width_fraction = 1, border_width = 1, radius = 18 } }
