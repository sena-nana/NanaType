[chrome]
accent = "#b0302a"
surface = "#fbfaf6"
text = "#1e1e1e"

[dialogue]
padding = [36.0, 46.0, 120.0, 24.0]
region = [780.0, 204.0]

[dialogue.box]
border_color = "#86775e00"
border_width = 0.0
color = "#fbfaf6"
margin = [14.0, 4.0, 6.0, 4.0]
radius = 2.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [16, 16, 30, 40]

[[dialogue.box.shadows]]
blur = 8.0
color = "#1e1e1e1f"
dx = 0.0
dy = 2.0
inset = false
spread = 0.0

[dialogue.continue]
bob_px = 3.0
color = "#b0302a"
glyph = "〆"
motion = "bob"
offset = [-22.0, -14.0]
size = 18.0

[[dialogue.decor]]
anchor = "top_left"
color = "#b0302a"
contour = "seal"
font = "accent"
layer = "above"
offset = [36.0, 14.0]
radius = 2.0
size = [22.0, 22.0]
text = "印"
text_color = "#fbfaf6"
text_size = 15.0
when = "speaker"

[[dialogue.decor]]
anchor = "bottom_right"
aspect_ratio = 0.680701732635498
image = "bamboo.png"
layer = "above"
offset = [12.0, 0.0]
opacity = 0.95
size = [144.0, 212.0]
when = "always"

[dialogue.nameplate]
color = "#00000000"
offset = [66.0, 13.0]
padding = [0.0, 0.0]
size = 20.0
text_color = "#1e1e1e"

[dialogue.reply]
color = "#6e6a62"
opacity = 1.0
size = 16.0

[[dialogue.responsive.landscape.decor]]
