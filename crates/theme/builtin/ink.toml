[meta]
id = "nanatype.ink"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["elegant"]
name = { zh-CN = "水墨", en-US = "Ink Wash", ja-JP = "水墨" }
description = { zh-CN = "宣纸底色、墨竹画作与朱红印章，配楷书", en-US = "Rice paper, an ink bamboo painting and a red seal, set in a brush-script face", ja-JP = "和紙の地に墨竹と朱の落款、楷書体で" }
schema = 2

[chrome]
accent = "#b0302a"
surface = "#fdfaf3"
text = "#222222"

[fonts.body]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "SimSun"]
weight = 400

[fonts.name]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "SimSun"]
weight = 700

[fonts.accent]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "SimSun"]
weight = 700

[dialogue]
padding = [28, 40, 64, 18]
shader_effects = []

[dialogue.box]
color = "#faf7effa"
border_color = "#86775e52"
border_width = 0.8
radius = 4
gradient = { kind = "radial", stops = [[0, "#fffdf8fa"], [1, "#e8dfccf5"]] }
shadows = [{ color = "#2222221f", dy = 4, blur = 16 }]

# A public-domain Zheng Xie bamboo detail, overlaid without redrawing.
frame = { image = "ink/still.png", slice = [34, 90, 24, 64], layout_inset = false }

[[dialogue.decor]]
image = "ink/bamboo.png"
anchor = "bottom_right"
offset = [12, 14]
size = [76, 138]
opacity = 0.95

# Red seal.
[[dialogue.decor]]
contour = "seal"
anchor = "top_right"
offset = [-20, 16]
size = [30, 34]
radius = 4
color = "#b0302a"
rotate = -6
text = "印"
text_color = "#fff3ea"
text_size = 19

[dialogue.text]
color = "#222222"
size = 30

[dialogue.nameplate]
color = "#00000000"
text_color = "#222222"
size = 20
radius = 0
padding = [8, 0]
offset = [24, 12]
border_color = "#b0302a"
border_widths = [0, 0, 0, 3]

[dialogue.continue]
glyph = "〆"
color = "#b0302a"
size = 18
offset = [-22, -12]

[dialogue.reveal.entrance]
kind = "fade"
ms = 220

[history]
name_weight = 400
name_plate = { color = "#00000000", text_color = "#222222", border_color = "#B0302A", border_widths = [0, 0, 0, 3], radius = 0, padding = [7, 1] }
panel = { color = "#F6F0E2F8", border_color = "#86775E52", border_width = 0.8, radius = 1, padding = [14, 14, 14, 18], margin = [8, 8, 8, 8] }
title = { text = "HISTORY", color = "#222222", size = 14, weight = 400, height = 52, padding = 18 }
name_color = "#222222"
bubble_color = "#f6f0e2f2"
bubble_radius = 4
bubble_border = "#86775e52"
bubble_border_width = 0.8
bubble_gradient = { kind = "radial", stops = [[0, "#faf6eef5"], [1, "#ece4d4f0"]] }
bubble_shadows = [{ color = "#2222221a", dy = 2, blur = 8 }]
avatar = { shape = "square", size = 40, ring_color = "#b0302a", ring_width = 2 }
time_color = "#8a8070"

[[history.decor]]
inset = [4, 4, 4, 4]
motif = "paper"
color = "#86775E"
opacity = 0.08
layer = "below"

[[history.decor]]
anchor = "top_right"
offset = [-18, 12]
size = [24, 24]
contour = "seal"
color = "#B0302A"
text = "印"
text_color = "#F6F0E2"
text_size = 17
font = "body"
rotate = -6

[[history.decor]]
anchor = "bottom_right"
offset = [-10, -12]
size = [90, 132]
image = "ink/bamboo.png"
opacity = 0.16
layer = "below"

[history.text]
color = "#222222"
size = 19

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0


[shaders.responsive_print]
source = "ink/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [1]

[shaders.compact_print]
source = "ink/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2]

[shaders.minimal_print]
source = "ink/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [{ image = "ink/bamboo.png", anchor = "bottom_right", offset = [12, 14], size = [76, 138], opacity = 0.95, aspect_ratio = 0.6807017543859649, max_fraction = [0.3, 1.2] }, { contour = "seal", anchor = "top_right", offset = [-20, 16], size = [30, 34], radius = 4, color = "#b0302a", rotate = -6, text = "印", text_color = "#fff3ea", text_size = 19 }] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#faf7effa", border_color = "#86775e52", border_width = 0.8, radius = 4, gradient = { kind = "radial", stops = [[0, "#fffdf8fa"], [1, "#e8dfccf5"]] }, shadows = [{ color = "#2222221f", dy = 4, blur = 16 }], width_fraction = 1 }, nameplate = { color = "#00000000", text_color = "#222222", size = 20, radius = 0, padding = [4, 4], offset = [-8, 12], border_color = "#b0302a", border_widths = [0, 0, 0, 3], anchor = "top_right", rotate = 0 }, continue = { glyph = "〆", color = "#b0302a", size = 18, offset = [12, -8], anchor = "bottom_left" }, portrait = { visible = false }, decor = [{ image = "ink/bamboo.png", anchor = "bottom_left", offset = [14, -14], size = [76, 138], opacity = 0.95, aspect_ratio = 0.5507246376811594, max_fraction = [0.32, 0.18], min_window = [240, 360] }, { contour = "seal", anchor = "bottom_right", offset = [-18, -20], size = [24, 28], radius = 4, color = "#b0302a", rotate = -6, text = "印", text_color = "#fff3ea", text_size = 19, aspect_ratio = 0.8571428571428571, min_window = [240, 360] }], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [20, 44, 20, 68], nameplate = { color = "#00000000", text_color = "#222222", size = 20, radius = 0, padding = [8, 0], offset = [12, 4], border_color = "#b0302a", border_widths = [0, 0, 0, 3], anchor = "top_left", rotate = 0 }, box = { color = "#faf7effa", border_color = "#86775e52", border_width = 0.8, radius = 4, gradient = { kind = "radial", stops = [[0, "#fffdf8fa"], [1, "#e8dfccf5"]] }, shadows = [{ color = "#2222221f", dy = 4, blur = 16 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [{ image = "ink/bamboo.png", anchor = "bottom_right", offset = [-12, -8], size = [32, 58], opacity = 0.95, aspect_ratio = 0.5507246376811594, min_window = [240, 180] }, { contour = "seal", anchor = "bottom_left", offset = [12, -14], size = [24, 28], radius = 4, color = "#b0302a", rotate = -6, text = "印", text_color = "#fff3ea", text_size = 19, aspect_ratio = 0.8571428571428571, min_window = [240, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#00000000", text_color = "#222222", size = 20, radius = 0, padding = [8, 0], offset = [12, 4], border_color = "#b0302a", border_widths = [0, 0, 0, 3], anchor = "top_left", rotate = 0 }, box = { color = "#faf7effa", border_color = "#86775e52", border_width = 0.8, radius = 4, gradient = { kind = "radial", stops = [[0, "#fffdf8fa"], [1, "#e8dfccf5"]] }, shadows = [{ color = "#2222221f", dy = 4, blur = 16 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 132], decor = [{ image = "ink/bamboo.png", anchor = "bottom_left", offset = [14, -14], size = [76, 138], opacity = 0.95, aspect_ratio = 0.5507246376811594, max_fraction = [0.32, 0.18], min_window = [160, 260] }, { contour = "seal", anchor = "bottom_right", offset = [-18, -20], size = [24, 28], radius = 4, color = "#b0302a", rotate = -6, text = "印", text_color = "#fff3ea", text_size = 19, aspect_ratio = 0.8571428571428571, min_window = [240, 360] }], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 88], decor = [{ image = "ink/bamboo.png", anchor = "bottom_left", offset = [14, -14], size = [40, 72.63157894736842], opacity = 0.95, aspect_ratio = 0.5507246376811594, max_fraction = [0.32, 0.18], min_window = [160, 260] }, { contour = "seal", anchor = "bottom_right", offset = [-18, -20], size = [18, 21], radius = 4, color = "#b0302a", rotate = -6, text = "印", text_color = "#fff3ea", text_size = 19, aspect_ratio = 0.8571428571428571, min_window = [240, 260] }], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { color = "#faf7effa", border_color = "#86775e52", border_width = 0.8, radius = 4, gradient = { kind = "radial", stops = [[0, "#fffdf8fa"], [1, "#e8dfccf5"]] }, shadows = [{ color = "#2222221f", dy = 4, blur = 16 }], width_fraction = 1 } }
