[meta]
id = "nanatype.ink"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["elegant"]
name = { zh-CN = "水墨", en-US = "Ink Wash", ja-JP = "水墨" }
description = { zh-CN = "宣纸底色、墨竹画作与朱红印章，配楷书", en-US = "Rice paper, an ink bamboo painting and a red seal, set in a brush-script face", ja-JP = "和紙の地に墨竹と朱の落款、楷書体で" }
schema = 2

[chrome]
accent = "#b0302a"
surface = "#fdfaf3"
text = "#222222"

[fonts.body]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "SimSun"]
weight = 400

[fonts.name]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "SimSun"]
weight = 700

[fonts.accent]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "SimSun"]
weight = 700

[dialogue]
padding = [28, 40, 64, 18]
shader_effects = []

[dialogue.box]
color = "#faf7effa"
border_color = "#86775e52"
border_width = 0.8
radius = 4
gradient = { kind = "radial", stops = [[0, "#fffdf8fa"], [1, "#e8dfccf5"]] }
shadows = [{ color = "#2222221f", dy = 4, blur = 16 }]

# A public-domain Zheng Xie bamboo detail, overlaid without redrawing.
frame = { image = "ink/still.png", slice = [34, 90, 24, 64], layout_inset = false }

[[dialogue.decor]]
image = "ink/bamboo.png"
anchor = "bottom_right"
offset = [12, 14]
size = [76, 138]
opacity = 0.95

# Red seal.
[[dialogue.decor]]
contour = "seal"
anchor = "top_right"
offset = [-20, 16]
size = [30, 34]
radius = 4
color = "#b0302a"
rotate = -6
text = "印"
text_color = "#fff3ea"
text_size = 19

[dialogue.text]
color = "#222222"
size = 30

[dialogue.nameplate]
color = "#00000000"
text_color = "#222222"
size = 20
radius = 0
padding = [8, 0]
offset = [24, 12]
border_color = "#b0302a"
border_widths = [0, 0, 0, 3]

[dialogue.continue]
glyph = "〆"
color = "#b0302a"
size = 18
offset = [-22, -12]

[dialogue.reveal.entrance]
kind = "fade"
ms = 220

[history]
name_color = "#222222"
bubble_color = "#f6f0e2f2"
bubble_radius = 4
bubble_border = "#86775e52"
bubble_border_width = 0.8
bubble_gradient = { kind = "radial", stops = [[0, "#faf6eef5"], [1, "#ece4d4f0"]] }
bubble_shadows = [{ color = "#2222221a", dy = 2, blur = 8 }]
avatar = { shape = "square", size = 40, ring_color = "#b0302a", ring_width = 2 }
time_color = "#8a8070"

[history.text]
color = "#222222"
size = 19

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0
