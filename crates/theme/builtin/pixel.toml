[meta]
id = "nanatype.pixel"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["game", "retro"]
name = { zh-CN = "掌机像素", en-US = "Pocket Pixel", ja-JP = "ポケットピクセル" }
description = { zh-CN = "四阶绿色的复古掌机画面，方角粗框与像素字", en-US = "Four shades of green like an old handheld, with square frames and pixel type", ja-JP = "4階調の緑で昔の携帯ゲーム機風。角ばった枠とドット文字" }
schema = 2

[chrome]
accent = "#306230"
surface = "#c4d7a0"
text = "#0f380f"

[fonts.body]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "SimSun"]
weight = 400

[fonts.name]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "SimSun"]
weight = 400

[dialogue]
padding = [24, 26, 24, 16]
overflow = "page"
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "pixel"
color = "#9bbc0f"
border_color = "#0f380f"
border_width = 4
radius = 0
shadows = [
    { color = "#0f380f", dx = 4, dy = 4 },
    { color = "#30623055", blur = 22, inset = true },
]

frame = { image = "pixel/still.png", slice = [18, 50, 18, 20], layout_inset = false }

[dialogue.text]
color = "#0f380f"
size = 24
line_height = 1.5

[dialogue.nameplate]
contour = "pixel"
size = 24
color = "#0f380f"
text_color = "#9bbc0f"
radius = 0
padding = [12, 3]
offset = [14, -16]
border_color = "#306230"
border_width = 2

[dialogue.continue]
glyph = "▼"
color = "#0f380f"
motion = "blink"
period_s = 0.8

[dialogue.reveal]
base_ms = 45

[dialogue.reveal.entrance]
kind = "none"
ms = 0

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0
shake_px = 2
jump_px = 4

[history]
name_size = 24
name_weight = 400
time_size = 12
entrance = "none"
reply = { size = 12 }
panel = { contour = "pixel", color = "#C4D7A0", border_color = "#0F380F", border_width = 3, radius = 0, padding = [12, 12, 12, 12], margin = [8, 8, 10, 8], shadows = [{ color = "#306230", dx = 2, dy = 2 }] }
bubble_contour = "pixel"
name_color = "#0f380f"
bubble_color = "#9bbc0f"
bubble_border = "#0f380f"
bubble_border_width = 3
bubble_radius = 0
bubble_shadows = [{ color = "#0f380f", dx = 2, dy = 2 }]
time_color = "#306230"
avatar = { shape = "square", size = 36, radius = 0, color = "#9BBC0F", ring_color = "#0f380f", ring_width = 2 }

[history.text]
size = 24
line_height = 1.5
color = "#0f380f"

# Chat rows at the same 24 px, so they stay on the font's grid too.
[history.chat]
text_scale = 1.0
bubble_opacity = 1.0

[mention]
fill = "#306230"
text_color = "#C4D7A0"
scale = 1.0

[shaders.artwork]
source = "pixel/artwork.wgsl"
period_s = 16
intensity = 1


[shaders.responsive_print]
source = "pixel/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [1]

[shaders.compact_print]
source = "pixel/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [2]

[shaders.minimal_print]
source = "pixel/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 72], box = { contour = "pixel", color = "#9bbc0f", border_color = "#0f380f", border_width = 4, radius = 0, shadows = [{ color = "#0f380f", dx = 4, dy = 4 }, { color = "#30623055", blur = 22, inset = true }], width_fraction = 1 }, nameplate = { contour = "pixel", size = 24, color = "#0f380f", text_color = "#9bbc0f", radius = 0, padding = [4, 4], offset = [-8, 12], border_color = "#306230", border_width = 2, anchor = "top_right", rotate = 0 }, continue = { glyph = "▼", color = "#0f380f", motion = "blink", period_s = 0.8, anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { contour = "pixel", size = 24, color = "#0f380f", text_color = "#9bbc0f", radius = 0, padding = [12, 3], offset = [12, 4], border_color = "#306230", border_width = 2, anchor = "top_left", rotate = 0 }, box = { contour = "pixel", color = "#9bbc0f", border_color = "#0f380f", border_width = 4, radius = 0, shadows = [{ color = "#0f380f", dx = 4, dy = 4 }, { color = "#30623055", blur = 22, inset = true }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { contour = "pixel", size = 24, color = "#0f380f", text_color = "#9bbc0f", radius = 0, padding = [12, 3], offset = [12, 4], border_color = "#306230", border_width = 2, anchor = "top_left", rotate = 0 }, box = { contour = "pixel", color = "#9bbc0f", border_color = "#0f380f", border_width = 4, radius = 0, shadows = [{ color = "#0f380f", dx = 4, dy = 4 }, { color = "#30623055", blur = 22, inset = true }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { contour = "pixel", color = "#9bbc0f", border_color = "#0f380f", border_width = 4, radius = 0, shadows = [{ color = "#0f380f", dx = 4, dy = 4 }, { color = "#30623055", blur = 22, inset = true }], width_fraction = 1 } }
