[meta]
id = "nanatype.pixel"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["game", "retro"]
name = { zh-CN = "掌机像素", en-US = "Pocket Pixel", ja-JP = "ポケットピクセル" }
description = { zh-CN = "四阶绿色的复古掌机画面，方角粗框与像素字", en-US = "Four shades of green like an old handheld, with square frames and pixel type", ja-JP = "4階調の緑で昔の携帯ゲーム機風。角ばった枠とドット文字" }
schema = 2

[chrome]
accent = "#306230"
surface = "#c4d7a0"
text = "#0f380f"

[fonts.body]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "SimSun"]
weight = 400

[fonts.name]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "SimSun"]
weight = 400

[dialogue]
padding = [24, 26, 24, 16]
overflow = "page"
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "pixel"
color = "#9bbc0f"
border_color = "#0f380f"
border_width = 4
radius = 0
shadows = [
    { color = "#0f380f", dx = 4, dy = 4 },
    { color = "#30623055", blur = 22, inset = true },
]

frame = { image = "pixel/still.png", slice = [18, 50, 18, 20], layout_inset = false }

[dialogue.text]
color = "#0f380f"
size = 24
line_height = 1.5

[dialogue.nameplate]
contour = "pixel"
size = 24
color = "#0f380f"
text_color = "#9bbc0f"
radius = 0
padding = [12, 3]
offset = [14, -16]
border_color = "#306230"
border_width = 2

[dialogue.continue]
glyph = "▼"
color = "#0f380f"
motion = "blink"
period_s = 0.8

[dialogue.reveal]
base_ms = 45

[dialogue.reveal.entrance]
kind = "none"
ms = 0

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0
shake_px = 2
jump_px = 4

[history]
bubble_contour = "pixel"
name_color = "#0f380f"
bubble_color = "#9bbc0f"
bubble_border = "#0f380f"
bubble_border_width = 3
bubble_radius = 0
bubble_shadows = [{ color = "#0f380f", dx = 2, dy = 2 }]
time_color = "#306230"
avatar = { shape = "square", size = 36, ring_color = "#0f380f", ring_width = 2 }

[history.text]
size = 24
line_height = 1.5
color = "#0f380f"

# Chat rows at the same 24 px, so they stay on the font's grid too.
[history.chat]
text_scale = 1.0

[shaders.artwork]
source = "pixel/artwork.wgsl"
period_s = 16
intensity = 1
