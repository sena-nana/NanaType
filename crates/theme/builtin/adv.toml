[meta]
id = "nanatype.adv"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["game"]
name = { zh-CN = "ADV 经典", en-US = "ADV Classic", ja-JP = "ADVクラシック" }
description = { zh-CN = "全宽深色玻璃条，金色描边名字，视觉小说风格", en-US = "Full-width dark glass bar with a gold outlined name, visual-novel style", ja-JP = "全幅のダークガラスに金色の縁取り名前、ノベルゲーム風" }
schema = 2

[chrome]
appearance = "dark"
accent = "#ffd27f"
surface = "#1c1c22"
text = "#f2f2f5"

[dialogue]
region = [1280, 180]
padding = [52, 54, 52, 22]
overflow = "page"
shader_effects = []

[dialogue.box]
contour = "cinema"
color = "#0a0a10e6"
border_color = "#ffffff26"
border_width = 1
radius = 10
width_fraction = 0.96
gradient = { stops = [[0, "#1a1a24cc"], [1, "#0a0a10e6"]] }
shadows = [{ color = "#ffffff33", dy = 1, inset = true }]

# Gold rule under the name, fading out.
frame = { image = "adv/still.png", slice = [52, 180, 22, 56], layout_inset = false }

[dialogue.text]
color = "#ffffff"
size = 30
line_height = 1.5
shadow = { color = "#000000cc", dx = 2, dy = 2, blur = 3 }

[dialogue.nameplate]
color = "#00000000"
text_color = "#ffd27f"
size = 24
offset = [44, 10]
padding = [4, 1]
radius = 0
stroke = { color = "#000000", width = 3 }

[dialogue.continue]
glyph = "▼"
color = "#ffd27f"
size = 18
offset = [-24, -14]

[dialogue.reveal.entrance]
kind = "fade"
ms = 180

[history]
bubble_contour = "cinema"
name_color = "#ffd27f"
bubble_color = "#0a0a10cc"
bubble_border = "#ffd27f33"
bubble_radius = 8
bubble_gradient = { stops = [[0, "#1a1a24cc"], [1, "#0a0a10e6"]] }
time_color = "#a0a0a8"
name_stroke = { color = "#000000", width = 2 }

[history.text]
color = "#ffffff"
