[chrome]
accent = "#ffffff"
appearance = "dark"
surface = "#0d0d12"
text = "#ffffff"

[dialogue]
overflow = "page"
padding = [96.0, 82.0, 96.0, 20.0]
region = [1280.0, 228.0]

[[dialogue.decor]]
anchor = "top_left"
color = "#ffffff"
offset = [96.0, 53.0]
size = [40.0, 2.0]
when = "speaker"

[[dialogue.decor.shadows]]
blur = 5.0
color = "#000000bf"
dx = 0.0
dy = 1.0
inset = false
spread = 0.0

[dialogue.box]
color = "#05050700"

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [72, 80, 24, 80]

[dialogue.continue]
bob_px = 3.0
color = "#ffffff"
glyph = "▼"
motion = "bob"
offset = [-90.0, -26.0]
size = 18.0

[dialogue.nameplate]
offset = [92.0, 14.0]
padding = [4.0, 1.0]
size = 26.0
text_color = "#ffffff"

[dialogue.nameplate.text_shadow]
blur = 5.0
color = "#000000bf"
dx = 0.0
dy = 1.0

[dialogue.reply]
color = "#b8bcc6"
size = 18.0

[dialogue.responsive.landscape]

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]
width_fraction = 1.0

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
color = "#3a3d46"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]
size = 17.0

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [18.0, 46.0, 18.0, 14.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
width_fraction = 1.0

[dialogue.responsive.rules.layout.nameplate]
color = "#3a3d46"
offset = [18.0, 11.0]
padding = [8.0, 2.0]
size = 17.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [18.0, 46.0, 18.0, 14.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
width_fraction = 1.0

[dialogue.responsive.rules.layout.nameplate]
color = "#3a3d46"
offset = [18.0, 11.0]
padding = [8.0, 2.0]
size = 17.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
width_fraction = 1.0

[dialogue.responsive.rules.layout.nameplate]
color = "#3a3d46"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
size = 18.0
text_color = "#ffffff"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal.entrance]
kind = "fade"
ms = 180

[dialogue.text]
color = "#ffffff"
line_height = 1.5
size = 34.0

[dialogue.text.shadow]
blur = 3.0
color = "#00000099"
dx = 0.0
dy = 1.0

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun"]
weight = 900

[history]
bubble_border = "#ffffff26"
bubble_border_width = 1.0
bubble_color = "#0d0d12e6"
bubble_radius = 2.0
entrance = "slide_up"
name_color = "#ffffff"
time_color = "#b8bcc6"

[history.avatar]
color = "#9aa0ac"

[history.bubble_gradient]
angle = 180.0
center = [50.0, 50.0]
circle = false
kind = "linear"
stops = [[0.0, "#0d0d12cc"], [1.0, "#050507e6"]]

[history.reply]
color = "#b8bcc6"

[history.text]
color = "#ffffff"

[mention]
avatar = true
fill = "#2a2a2f"
scale = 0.72
text_color = "#ffffff"

[shaders.compact_print]
animated = false
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
animated = false
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []
