[chrome]
accent = "#a99bff"
appearance = "dark"
surface = "#191c22"
text = "#e8ecf2"

[dialogue]
overscan = 16.0
padding = [32.0, 50.0, 56.0, 20.0]
region = [860.0, 200.0]

[[dialogue.decor]]
anchor = "top_left"
offset = [28.0, 19.0]
size = [20.0, 22.0]
text = "⬡"
text_color = "#a99bff"
text_size = 20.0
when = "speaker"

[dialogue.box]
border_color = "#2c303a"
border_width = 1.5
color = "#191c22"
radius = 6.0

[[dialogue.box.shadows]]
blur = 10.0
color = "#00000059"
dx = 0.0
dy = 4.0
inset = false
spread = 0.0

[dialogue.continue]
anchor = "bottom_right"
bob_px = 3.0
color = "#a99bff"
glyph = "⬢"
motion = "pulse"
offset = [-30.0, -22.0]
period_s = 1.0
size = 18.0

[dialogue.nameplate]
offset = [50.0, 19.0]
padding = [0.0, 0.0]
radius = 10.0
size = 17.0
text_color = "#a99bff"

[dialogue.reply]
color = "#7c8394"
size = 14.0

[dialogue.responsive.landscape]

[dialogue.responsive.portrait]
decor = []
padding = [22.0, 50.0, 52.0, 26.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-22.0, 14.0]

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
padding = [18.0, 42.0, 18.0, 16.0]

[[dialogue.responsive.rules.layout.decor]]
anchor = "top_left"
offset = [14.0, 11.0]
size = [18.0, 20.0]
text = "⬡"
text_color = "#a99bff"
text_size = 18.0
when = "speaker"

[dialogue.responsive.rules.layout.nameplate]
offset = [34.0, 12.0]

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [14.0, 46.0, 40.0, 18.0]

[dialogue.responsive.rules.layout.nameplate]
anchor = "top_right"
offset = [-12.0, 12.0]
size = 14.0

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
shader_effects = []

[dialogue.responsive.rules.layout.nameplate]
color = "#a99bff"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
size = 18.0
text_color = "#191c22"
visible = false

[dialogue.reveal.entrance]
kind = "fade"
ms = 185

[dialogue.reveal.exit]
ms = 400
scope = "text"

[dialogue.reveal.scramble]
alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+-=<>[]{}()/"
entrance_ms = 140
exit_hold_ms = 80
exit_ms = 400
interval_ms = 25

[[dialogue.shader_effects]]
shader = "network"
target = "background"

[dialogue.text]
color = "#e8ecf2"
line_height = 1.4500000476837158
size = 26.0

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 700

[history]
bubble_border = "#2c303a"
bubble_border_width = 1.0
bubble_color = "#191c22"
bubble_padding = [16.0, 12.0]
bubble_radius = 4.0
name_color = "#a99bff"
time_color = "#7c8394"

[history.avatar]
color = "#a99bff"
radius = 4.0
ring_color = "#2c303a"
ring_width = 1.0
shape = "square"
size = 28.0

[history.reply]
color = "#7c8394"

[history.text]
color = "#e8ecf2"
size = 19.0

[mention]
avatar = true
fill = "#2b2c3d"
scale = 0.72
text_color = "#cfc7ff"

[shaders.network]
animated = true
intensity = 1.0
params = []
period_s = 24.0
source = "artwork.wgsl"
static_fallback = true
textures = []
