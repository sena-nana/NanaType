[chrome]
accent = "#ff4fb8"
appearance = "dark"
surface = "#1b1128"
text = "#f3e9ff"

[dialogue]
padding = [42.0, 44.0, 48.0, 18.0]
region = [760.0, 192.0]

[dialogue.box]
color = "#120b1cf2"
margin = [6.0, 4.0, 6.0, 4.0]
radius = 22.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [40, 40, 40, 40]

[dialogue.continue]
bob_px = 3.0
color = "#ff4fb8"
glyph = "∨"
motion = "blink"
offset = [-34.0, -26.0]
period_s = 1.0
size = 22.0

[dialogue.nameplate]
color = "#1d1229"
offset = [32.0, 2.0]
padding = [10.0, 0.0]
radius = 8.0
size = 22.0
text_color = "#ffe3f4"

[dialogue.nameplate.stroke]
color = "#ff4fb8"
width = 1.5

[dialogue.nameplate.text_shadow]
blur = 8.0
color = "#ff4fb8"
dx = 0.0
dy = 0.0

[dialogue.reply]
color = "#9b6bff"
size = 14.0

[dialogue.responsive.landscape]
decor = []

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-2.0, 24.0]
padding = [4.0, 4.0]
size = 17.0

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [22.0, 36.0, 22.0, 14.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]
radius = 14.0

[dialogue.responsive.rules.layout.nameplate]
offset = [18.0, 1.0]
size = 17.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [22.0, 36.0, 22.0, 14.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]
radius = 14.0

[dialogue.responsive.rules.layout.nameplate]
offset = [18.0, 1.0]
size = 17.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame", "nameplate.stroke", "nameplate.text_shadow"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]

[dialogue.responsive.rules.layout.nameplate]
color = "#ff4fb8"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
text_color = "#1b1128"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal.entrance]
kind = "fade"
ms = 140

[[dialogue.shader_effects]]
shader = "artwork"
target = "artwork"

[dialogue.text]
color = "#f3e9ff"
line_height = 1.45
size = 27.0

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 800

[history]
bubble_border = "#ff4fb859"
bubble_border_width = 1.0
bubble_color = "#1b1128e6"
bubble_radius = 12.0
entrance = "slide_up"
name_color = "#ff4fb8"
time_color = "#9b6bff"

[history.avatar]
color = "#9b6bff"
ring_color = "#ff4fb8"
ring_width = 1.5

[[history.bubble_shadows]]
blur = 10.0
color = "#ff4fb833"
dx = 0.0
dy = 0.0
inset = false
spread = 0.0

[history.reply]
color = "#9b6bff"

[history.text]
color = "#f3e9ff"

[mention]
avatar = true
fill = "#3b1a3c"
scale = 0.72
text_color = "#ffc2e6"

[shaders.artwork]
active = ["line:0.6"]
animated = true
intensity = 1.0
params = []
period_s = 16.0
source = "artwork.wgsl"
static_fallback = false
textures = []

[shaders.compact_print]
active = ["line:0.6"]
animated = true
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
active = ["line:0.6"]
animated = true
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []
