[chrome]
accent = "#4a7dff"
text = "#22263a"

[dialogue]
padding = [26.0, 46.0, 26.0, 14.0]
region = [760.0, 170.0]

[dialogue.box]
border_color = "#4a7dff"
border_widths = [0.0, 0.0, 0.0, 4.0]
color = "#fffffff2"
contour = "rounded"
radii = [0.0, 6.0, 6.0, 0.0]

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [44, 70, 18, 26]

[dialogue.box.gradient]
angle = 90.0
center = [50.0, 50.0]
circle = false
kind = "linear"
stops = [[0.0, "#eef3fff2"], [0.3499999940395355, "#fffffff2"]]

[[dialogue.box.shadows]]
blur = 14.0
color = "#22263a26"
dx = 0.0
dy = 4.0
inset = false
spread = 0.0

[dialogue.continue]
bob_px = 3.0
color = "#4a7dff"
glyph = "●"
motion = "pulse"
period_s = 1.0
size = 10.0

[dialogue.nameplate]
border_color = "#4a7dff"
border_widths = [0.0, 0.0, 1.0, 0.0]
offset = [26.0, 14.0]
padding = [0.0, 1.0]
size = 16.0
text_color = "#4a7dff"

[dialogue.responsive.landscape]
decor = []

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 40.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
offset = [12.0, 4.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 40.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
offset = [12.0, 4.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame", "nameplate.border_color", "nameplate.border_widths"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
color = "#0876d0"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
size = 18.0
text_color = "#ffffff"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal.entrance]
kind = "fade"
ms = 140

[dialogue.text]
color = "#22263a"
size = 26.0

[effects]
contrast_guard = 3.0

[history]
bubble_border = "#4a7dff"
bubble_color = "#fffffff2"
bubble_contour = "rounded"
bubble_radii = [0.0, 6.0, 6.0, 0.0]
entrance = "slide_up"
name_color = "#4a7dff"
time_color = "#8aa0b4"

[history.avatar]
shape = "square"
size = 36.0

[[history.bubble_shadows]]
blur = 8.0
color = "#22263a14"
dx = 0.0
dy = 2.0
inset = false
spread = 0.0

[[history.bubble_shadows]]
blur = 0.0
color = "#4a7dff"
dx = 3.0
dy = 0.0
inset = true
spread = 0.0

[history.text]
color = "#22263a"

[shaders.compact_print]
animated = false
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
animated = false
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []
