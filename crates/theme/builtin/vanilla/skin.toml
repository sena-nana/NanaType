[chrome]
accent = "#8a6a3a"
appearance = "light"
surface = "#fbf8f1"
text = "#24201b"

[dialogue]
padding = [46.0, 54.0, 64.0, 18.0]
region = [760.0, 200.0]

[[dialogue.decor]]
anchor = "top_left"
color = "#8a6a3a"
offset = [46.0, 29.0]
size = [24.0, 2.0]
when = "speaker"

[dialogue.box]
border_color = "#3b2a20"
border_widths = [0.0, 0.0, 0.0, 6.0]
color = "#fbf8f1"
radius = 2.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [8, 8, 8, 12]

[[dialogue.box.shadows]]
blur = 10.0
color = "#24201b1f"
dx = 0.0
dy = 3.0
inset = false
spread = 0.0

[dialogue.continue]
anchor = "bottom_right"
color = "#3b2a20"
glyph = "⌖"
motion = "pulse"
offset = [-26.0, -20.0]
period_s = 1.0
size = 34.0

[dialogue.nameplate]
offset = [78.0, 18.0]
padding = [0.0, 0.0]
size = 17.0
text_color = "#8a6a3a"

[dialogue.reply]
color = "#6e655a"
size = 14.0

[dialogue.responsive.landscape]

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
padding = [18.0, 40.0, 16.0, 14.0]
unset = ["box.frame"]

[[dialogue.responsive.rules.layout.decor]]
anchor = "top_left"
color = "#8a6a3a"
offset = [18.0, 20.0]
size = [18.0, 2.0]
when = "speaker"

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
offset = [44.0, 9.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
padding = [18.0, 40.0, 16.0, 14.0]
unset = ["box.frame"]

[[dialogue.responsive.rules.layout.decor]]
anchor = "top_left"
color = "#8a6a3a"
offset = [18.0, 20.0]
size = [18.0, 2.0]
when = "speaker"

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
offset = [44.0, 9.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
color = "#8a6a3a"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
size = 18.0
text_color = "#ffffff"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal.entrance]
kind = "fade"
ms = 140

[dialogue.text]
color = "#24201b"
line_height = 1.45
size = 27.0

[effects]
contrast_guard = 3.0

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 700

[history]
bubble_border = "#24201b1a"
bubble_border_width = 1.0
bubble_color = "#fffdf8f2"
bubble_contour = "rounded"
bubble_radii = [0.0, 2.0, 2.0, 0.0]
entrance = "slide_up"
name_color = "#8a6a3a"
time_color = "#6e655a"

[history.avatar]
color = "#c9a86a"
radius = 2.0
shape = "square"
size = 36.0

[[history.bubble_shadows]]
blur = 8.0
color = "#24201b14"
dx = 0.0
dy = 2.0
inset = false
spread = 0.0

[[history.bubble_shadows]]
blur = 0.0
color = "#3b2a20"
dx = 4.0
dy = 0.0
inset = true
spread = 0.0

[history.reply]
color = "#6e655a"

[history.text]
color = "#24201b"

[mention]
avatar = true
fill = "#efe6d2"
scale = 0.72
text_color = "#5b4128"

[shaders.compact_print]
animated = false
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
animated = false
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []
