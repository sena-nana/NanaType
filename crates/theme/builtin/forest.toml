[meta]
schema = 2
id = "nanatype.forest"
version = "1.1.2"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "cute"]
name = { zh-CN = "森林精灵", en-US = "Forest Sprite", ja-JP = "森の妖精" }
description = { zh-CN = "植物标本、装订孔与无涂层纸张；完整程序版画", en-US = "Original procedural print artwork", ja-JP = "オリジナルのプロシージャル版画" }

[chrome]
appearance = "light"
accent = "#88A68A"
surface = "#F3F1E5"
text = "#263D32"

[dialogue]
region = [920, 220]
overscan = 16
padding = [56, 65, 181, 27]
shader_effects = [{ shader = "artwork", target = "artwork" }]
box = { color = "#F3F1E5", border_color = "#314C40", frame = { image = "forest/still.png", slice = [0, 0, 0, 0] } }
text = { color = "#263D32", size = 25, line_height = 1.45 }
nameplate = { color = "#F3F1E500", text_color = "#314C40", border_color = "#88A68A", border_widths = [0, 0, 0.8, 0], radius = 0, padding = [0, 0], offset = [56, 17], size = 19 }
continue = { glyph = "· · ·", color = "#88A68A", motion = "none" }

[shaders.artwork]
static_fallback = true
source = "forest/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["forest/ornament.png"]

[shaders.responsive_artwork]
static_fallback = true
source = "forest/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["forest/ornament.png"]
params = [1, 1]

[shaders.responsive_compact]
static_fallback = true
source = "forest/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["forest/ornament.png"]
params = [1, 0, 1]

[history]
name_color = "#314C40"
time_color = "#657B64"
bubble_color = "#F3F1E5"
bubble_border = "#88A68A"
bubble_border_width = 0.8
bubble_radius = 2
bubble_gradient = { angle = 180, stops = [[0, "#FDFBEF"], [1, "#F3F1E5"]] }
bubble_shadows = [{ color = "#314C401A", dy = 2 }]
name_plate = { color = "#00000000", text_color = "#314C40", border_color = "#88A68A", border_widths = [0, 0, 1, 0], radius = 0, padding = [2, 1] }
avatar = { shape = "square", size = 36, radius = 2, color = "#E0E7D5", ring_color = "#88A68A", ring_width = 1 }
panel = { color = "#F3F1E5FA", border_color = "#88A68A", border_width = 1, radius = 2, padding = [20, 14, 12, 18], margin = [8, 8, 8, 8], shadows = [{ color = "#314C4020", dx = 2, dy = 3 }] }
title = { text = "HISTORY", color = "#314C40", background = "#E5E8D9", size = 14, weight = 500, height = 52, padding = 20 }
text = { color = "#263D32" }

[[history.decor]]
inset = [4, 4, 4, 4]
motif = "paper"
color = "#657B64"
opacity = 0.10
layer = "below"

[[history.decor]]
anchor = "top_right"
offset = [-12, 4]
size = [38, 44]
image = "forest/ornament.png"

[[history.decor]]
anchor = "top_left"
offset = [7, 72]
size = [4, 4]
radius = 2
color = "#88A68A"

[[history.decor]]
anchor = "top_left"
offset = [7, 160]
size = [4, 4]
radius = 2
color = "#88A68A"

[[history.decor]]
anchor = "top_left"
offset = [7, 248]
size = [4, 4]
radius = 2
color = "#88A68A"

[[history.decor]]
anchor = "top_left"
offset = [7, 336]
size = [4, 4]
radius = 2
color = "#88A68A"

[[history.decor]]
anchor = "bottom_right"
offset = [-12, -14]
size = [72, 100]
image = "forest/ornament.png"
opacity = 0.12
layer = "below"

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#F3F1E5", border_color = "#314C40", width_fraction = 1, border_width = 1, radius = 18 }, nameplate = { color = "#F3F1E500", text_color = "#314C40", border_color = "#88A68A", border_widths = [0, 0, 0.8, 0], radius = 0, padding = [4, 4], offset = [-8, 12], size = 19, anchor = "top_right", rotate = 0 }, continue = { glyph = "· · ·", color = "#88A68A", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [{ image = "forest/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 52, 16], nameplate = { color = "#F3F1E500", text_color = "#314C40", border_color = "#88A68A", border_widths = [0, 0, 0.8, 0], radius = 0, padding = [0, 0], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#F3F1E5", border_color = "#314C40", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [{ image = "forest/ornament.png", size = [32, 40], aspect_ratio = 0.8, anchor = "bottom_right", offset = [-8, -8], min_window = [280, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#F3F1E500", text_color = "#314C40", border_color = "#88A68A", border_widths = [0, 0, 0.8, 0], radius = 0, padding = [0, 0], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#F3F1E5", border_color = "#314C40", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 84], decor = [{ image = "forest/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 92], decor = [{ image = "forest/ornament.png", size = [56, 70], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 }, min_window = [160, 260] }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_compact", target = "artwork" }], box = { color = "#F3F1E5", border_color = "#314C40", width_fraction = 1, border_width = 1, radius = 18 } }
