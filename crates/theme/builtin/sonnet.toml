[meta]
schema = 2
id = "nanatype.sonnet"
version = "1.0.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["elegant", "minimal"]
name = { zh-CN = "十四行诗", en-US = "Sonnet", ja-JP = "ソネット" }
description = { zh-CN = "透明诗句、手写花体与暖金星火，逐字凝光、整段化为光尘", en-US = "Transparent poetry, calligraphy and golden sparks; letters gather light and dissolve together", ja-JP = "透明な詩句とカリグラフィー。文字に金の光が灯り、詩全体が光の粒へほどける" }

[chrome]
appearance = "dark"
accent = "#E5BF83"
surface = "#29262B"
text = "#FFF8EA"

[fonts.body]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
weight = 400

[fonts.name]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
weight = 400

[fonts.latin]
file = "builtin:fonts/Tangerine-Bold.ttf"
families = ["Tangerine", "Segoe Script", "Noto Sans SC"]
weight = 700

[dialogue]
region = [960, 190]
overscan = 16
padding = [36, 48, 36, 28]
box = { color = "#00000000", border_width = 0, radius = 0 }
text = { color = "#FFF8EA", size = 32, line_height = 1.55, stroke = { color = "#29222B99", width = 0.8 }, shadow = { color = "#17121DB0", dy = 1, blur = 3 } }
nameplate = { color = "#00000000", text_color = "#E5BF83", size = 18, padding = [0, 0], offset = [36, 12], stroke = { color = "#211B2580", width = 0.6 } }
portrait = { visible = false }
continue = { glyph = "", motion = "none" }

[[dialogue.decor]]
anchor = "top_left"
offset = [17, 16]
size = [9, 9]
polygon = [[50, 0], [60, 40], [100, 50], [60, 60], [50, 100], [40, 60], [0, 50], [40, 40]]
color = "#E5BF83CC"

[[dialogue.decor]]
anchor = "top_right"
offset = [-32, 25]
size = [100, 1]
color = "#E5BF8366"

[dialogue.reveal]
entrance = { kind = "fade", ms = 360, material = "appear", scope = "glyph" }
exit = { ms = 700, material = "dissolve", scope = "text" }
light = { color = "#FFD593", intensity = 1, radius = 12 }

[materials.appear]
source = "sonnet/appear.wgsl"

[materials.dissolve]
source = "sonnet/dissolve.wgsl"

[history]
name_color = "#E5BF83"
name_weight = 400
time_color = "#C4B8A5"
avatar = { shape = "none" }
bubble_color = "#00000000"
bubble_border_width = 0
bubble_radius = 0
bubble_padding = [12, 10]
name_stroke = { color = "#29222B99", width = 0.6 }
text = { color = "#FFF8EA", size = 23, line_height = 1.5, stroke = { color = "#29222B99", width = 0.7 }, shadow = { color = "#17121DB0", dy = 1, blur = 2 } }

[effects]
contrast_guard = 0

[dialogue.responsive]
landscape = {  }
portrait = { padding = [24, 50, 24, 36], nameplate = { color = "#00000000", text_color = "#E5BF83", size = 18, padding = [0, 0], anchor = "top_right", offset = [-18, 14], stroke = { color = "#211B2580", width = 0.6 } }, decor = [{ anchor = "bottom_left", offset = [17, -20], size = [9, 9], polygon = [[50, 0], [60, 40], [100, 50], [60, 60], [50, 100], [40, 60], [0, 50], [40, 40]], color = "#E5BF83CC", aspect_ratio = 1 }, { anchor = "bottom_right", offset = [-32, -25], size = [100, 1], color = "#E5BF8366" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [18, 42, 18, 22], nameplate = { color = "#00000000", text_color = "#E5BF83", size = 17, padding = [0, 0], offset = [36, 10], stroke = { color = "#211B2580", width = 0.6 } }, decor = [{ anchor = "top_left", offset = [17, 16], size = [9, 9], polygon = [[50, 0], [60, 40], [100, 50], [60, 60], [50, 100], [40, 60], [0, 50], [40, 40]], color = "#E5BF83CC", min_window = [200, 140] }, { anchor = "top_right", offset = [-32, 25], size = [100, 1], color = "#E5BF8366", min_window = [240, 140], max_fraction = [0.3, 1] }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [12, 14, 12, 14], nameplate = { visible = false }, decor = [] }
