# Halo: the reference skin. Every other built-in starts from these defaults.
[meta]
id = "nanatype.halo"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["classic", "minimal"]
name = { zh-CN = "光环", en-US = "Halo", ja-JP = "ハロー" }
description = { zh-CN = "柔光白卡片配天蓝渐变名牌，清爽百搭", en-US = "A soft white card with a sky-blue gradient name pill; clean and versatile", ja-JP = "やわらかな白いカードに空色グラデーションの名札。すっきり万能" }
schema = 2

[dialogue]
padding = [28, 26, 24, 14]
shader_effects = []

[dialogue.box]
contour = "rounded"
color = "#fffffff2"
border_color = "#ffffff"
border_width = 1
radius = 30
gradient = { angle = 160, stops = [[0, "#fffffff7"], [1, "#eef6fdf2"]] }
shadows = [{ color = "#2388C922", dy = 5, blur = 18 }]

frame = { image = "halo/still.png", slice = [34, 34, 34, 34], layout_inset = false }

[dialogue.nameplate]
radius = 999
padding = [16, 5]
offset = [24, -15]
gradient = { angle = 90, stops = [[0, "#087FD1"], [1, "#249FDF"]] }
shadows = [{ color = "#0876d033", dy = 2, blur = 6 }]
border_color = "#D7EFFF"
border_width = 0.8

[history]
bubble_contour = "rounded"
bubble_radii = [18, 18, 18, 18]
bubble_gradient = { angle = 160, stops = [[0, "#fffffff5"], [1, "#eef6fdf0"]] }
bubble_shadows = [{ color = "#1b2f4b1a", dy = 3, blur = 10 }, { color = "#b7def580", dy = 1, inset = true }]
avatar = { shape = "circle", size = 40, ring_color = "#ffffff", ring_width = 2 }
name_plate = { color = "name", gradient = { angle = 90, stops = [[0, "#087FD1"], [1, "#249FDF"]] }, text_color = "name_text", border_color = "#D7EFFF", border_width = 0.8, radius = 999, padding = [9, 2] }

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0


[shaders.responsive_print]
source = "halo/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [1]

[shaders.compact_print]
source = "halo/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2]

[shaders.minimal_print]
source = "halo/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 72], box = { contour = "rounded", color = "#fffffff2", border_color = "#ffffff", border_width = 1, radius = 30, gradient = { angle = 160, stops = [[0, "#fffffff7"], [1, "#eef6fdf2"]] }, shadows = [{ color = "#2388C922", dy = 5, blur = 18 }], width_fraction = 1 }, nameplate = { radius = 999, padding = [4, 4], offset = [-8, 12], gradient = { angle = 90, stops = [[0, "#087FD1"], [1, "#249FDF"]] }, shadows = [{ color = "#0876d033", dy = 2, blur = 6 }], border_color = "#D7EFFF", border_width = 0.8, anchor = "top_right", rotate = 0 }, continue = { anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { radius = 999, padding = [16, 5], offset = [12, 4], gradient = { angle = 90, stops = [[0, "#087FD1"], [1, "#249FDF"]] }, shadows = [{ color = "#0876d033", dy = 2, blur = 6 }], border_color = "#D7EFFF", border_width = 0.8, anchor = "top_left", rotate = 0 }, box = { contour = "rounded", color = "#fffffff2", border_color = "#ffffff", border_width = 1, radius = 30, gradient = { angle = 160, stops = [[0, "#fffffff7"], [1, "#eef6fdf2"]] }, shadows = [{ color = "#2388C922", dy = 5, blur = 18 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { radius = 999, padding = [16, 5], offset = [12, 4], gradient = { angle = 90, stops = [[0, "#087FD1"], [1, "#249FDF"]] }, shadows = [{ color = "#0876d033", dy = 2, blur = 6 }], border_color = "#D7EFFF", border_width = 0.8, anchor = "top_left", rotate = 0 }, box = { contour = "rounded", color = "#fffffff2", border_color = "#ffffff", border_width = 1, radius = 30, gradient = { angle = 160, stops = [[0, "#fffffff7"], [1, "#eef6fdf2"]] }, shadows = [{ color = "#2388C922", dy = 5, blur = 18 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { contour = "rounded", color = "#fffffff2", border_color = "#ffffff", border_width = 1, radius = 30, gradient = { angle = 160, stops = [[0, "#fffffff7"], [1, "#eef6fdf2"]] }, shadows = [{ color = "#2388C922", dy = 5, blur = 18 }], width_fraction = 1 } }
