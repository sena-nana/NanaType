[meta]
schema = 2
id = "nanatype.crayon"
version = "1.0.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["cute", "elegant"]
name = { zh-CN = "蜡笔画", en-US = "Crayon", ja-JP = "クレヨン" }
description = { zh-CN = "米白画纸、柔彩蜡笔与小花涂鸦，文字带深色彩铅笔触", en-US = "Warm drawing paper, wax-crayon edges and a little flower, with dark colored-pencil lettering", ja-JP = "温かな画用紙、柔らかなクレヨンの線と小花、色鉛筆の文字" }

[chrome]
appearance = "light"
accent = "#B46A58"
surface = "#FFFBef"
text = "#51413A"

[fonts.body]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
weight = 400

[fonts.name]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
families = ["LXGW WenKai", "KaiTi", "Noto Sans SC"]
weight = 400

[dialogue]
region = [860, 230]
overscan = 12
padding = [40, 66, 126, 34]
box = { color = "#FFFBef", border_color = "#C29477", border_width = 0, radius = 7, material = "paper", frame = { image = "crayon/still.png", slice = [20, 20, 20, 20], layout_inset = false } }
text = { color = "#51413A", size = 26, line_height = 1.45, material = "pencil" }
nameplate = { color = "#00000000", text_color = "#A65B49", radius = 0, padding = [0, 0], offset = [40, 25], size = 20 }
continue = { glyph = "···", color = "#B46A58", motion = "none", offset = [-38, -24] }

[materials.paper]
source = "crayon/paper.wgsl"

[materials.bubble]
source = "crayon/paper.wgsl"
params = [1]

[materials.pencil]
source = "crayon/pencil.wgsl"

[history]
name_color = "#A65B49"
name_weight = 400
time_color = "#8B8070"
bubble_color = "#FFFBef"
bubble_border_width = 0
bubble_radius = 7
bubble_padding = [20, 17]
bubble_material = "bubble"
bubble_frame = { image = "crayon/bubble.png", slice = [18, 18, 18, 18] }
avatar = { shape = "circle", size = 36, color = "#EBE9DA", ring_color = "#91AA92", ring_width = 1.5 }
panel = { color = "#FAF5E9F8", radius = 10, padding = [14, 14, 12, 16], margin = [8, 8, 8, 8] }
text = { color = "#51413A", material = "pencil", size = 19, line_height = 1.5 }

[effects]
contrast_guard = 3.0

[dialogue.reveal.entrance]
kind = "fade"
ms = 180
material = "write"
scope = "glyph"

[dialogue.reveal.exit]
ms = 320
material = "erase"
scope = "text"

[materials.write]
source = "crayon/write.wgsl"

[materials.erase]
source = "crayon/erase.wgsl"

[materials.responsive_paper]
source = "crayon/paper.wgsl"
params = [1]

[shaders.paper_static]
source = "crayon/paper-background.wgsl"
intensity = 1
static_fallback = true
animated = false

[shaders.paper_narrow]
source = "crayon/paper-background.wgsl"
intensity = 1
static_fallback = true
animated = false
params = [2]

[shaders.paper_compact]
source = "crayon/paper-background.wgsl"
intensity = 1
static_fallback = true
animated = false
params = [1]

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [], shader_effects = [{ shader = "paper_static", target = "artwork" }] }
portrait = { padding = [20, 24, 56, 140], box = { color = "#FFFBef", border_color = "#C29477", border_width = 0, radius = 7, material = "responsive_paper", width_fraction = 1, frame = { image = "crayon/bubble.png", slice = [18, 18, 18, 18], layout_inset = false, fill = false } }, nameplate = { color = "#00000000", text_color = "#A65B49", radius = 0, padding = [4, 4], offset = [-8, 12], size = 20, anchor = "top_right", rotate = 0 }, continue = { glyph = "···", color = "#B46A58", motion = "none", offset = [12, -8], anchor = "bottom_left" }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "paper_static", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 72], nameplate = { color = "#00000000", text_color = "#A65B49", radius = 0, padding = [0, 0], offset = [12, 4], size = 20, anchor = "top_left", rotate = 0 }, box = { color = "#FFFBef", border_color = "#C29477", border_width = 0, radius = 7, material = "responsive_paper", width_fraction = 1, frame = { image = "crayon/bubble.png", slice = [18, 18, 18, 18], layout_inset = false, fill = false } }, shader_effects = [{ shader = "paper_narrow", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#00000000", text_color = "#A65B49", radius = 0, padding = [0, 0], offset = [12, 4], size = 20, anchor = "top_left", rotate = 0 }, box = { color = "#FFFBef", border_color = "#C29477", border_width = 0, radius = 7, material = "responsive_paper", width_fraction = 1, frame = { image = "crayon/bubble.png", slice = [18, 18, 18, 18], layout_inset = false, fill = false } }, shader_effects = [{ shader = "paper_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 72], decor = [], shader_effects = [{ shader = "paper_narrow", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 72], decor = [], shader_effects = [{ shader = "paper_narrow", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "paper_compact", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "paper_compact", target = "artwork" }], box = { color = "#FFFBef", border_color = "#C29477", border_width = 0, radius = 7, material = "responsive_paper", width_fraction = 1, frame = { image = "crayon/bubble.png", slice = [18, 18, 18, 18], layout_inset = false, fill = false } } }
