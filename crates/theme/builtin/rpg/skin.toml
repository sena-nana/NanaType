[chrome]
accent = "#ffd45c"
appearance = "dark"
surface = "#16205a"
text = "#ffffff"

[dialogue]
overflow = "page"
padding = [34.0, 30.0, 40.0, 22.0]
region = [760.0, 188.0]

[dialogue.box]
border_color = "#ffffff"
border_width = 3.0
color = "#14257e"
margin = [22.0, 0.0, 0.0, 0.0]
radius = 8.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [24, 24, 24, 24]

[dialogue.box.gradient]
angle = 180.0
center = [50.0, 50.0]
circle = false
kind = "linear"
stops = [[0.0, "#2a3fb8"], [1.0, "#14257e"]]

[dialogue.box.shadow]
blur = 6.0
color = "#050a3373"
dx = 0.0
dy = 3.0

[dialogue.continue]
