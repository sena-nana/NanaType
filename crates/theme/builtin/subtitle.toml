[meta]
id = "nanatype.subtitle"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "minimal"]
name = { zh-CN = "字幕", en-US = "Subtitle", ja-JP = "字幕" }
description = { zh-CN = "没有框，只有粗描边白字，叠在任何画面上都清楚", en-US = "No box, just bold outlined white text that reads over any scene", ja-JP = "枠なし、太い縁取りの白文字だけ。どんな画面でも読みやすい" }

[chrome]
appearance = "dark"
accent = "#ffd27f"
surface = "#1e1e22"
text = "#f2f2f5"

[fonts.body]
weight = 800

[fonts.name]
weight = 800

[dialogue]
region = [960, 170]
padding = [24, 38, 24, 10]

[dialogue.box]
color = "#00000000"
border_width = 0
radius = 0

[dialogue.text]
color = "#ffffff"
size = 34
line_height = 1.38
align = "center"
stroke = { color = "#000000", width = 5 }
shadow = { color = "#000000A0", dy = 2, blur = 2 }

[dialogue.nameplate]
color = "#00000000"
text_color = "#FFE1A3"
size = 19
padding = [0, 0]
anchor = "top"
offset = [0, 7]
stroke = { color = "#111115", width = 3.5 }

[dialogue.continue]
glyph = ""

[dialogue.reveal.entrance]
kind = "fade"
ms = 120

[history]
name_color = "#FFE1A3"
name_stroke = { color = "#000000", width = 2.5 }
# Like the dialogue: no box, outlined text.
bubble_color = "#00000000"
bubble_radius = 0
bubble_padding = [2, 0]
time_color = "#c8c8d0"

[history.text]
color = "#ffffff"
stroke = { color = "#000000", width = 3 }
