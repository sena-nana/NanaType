# Design reference: https://github.com/sheep-realms/Echo-Live (Sheep-realms and contributors).
# CC0-1.0 below covers NanaType's own contributions to this local skin implementation.
[meta]
id = "nanatype.echo_bubble"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "cute"]
name = { zh-CN = "Echo-Live 气泡", en-US = "Echo-Live Bubble", ja-JP = "Echo-Live バブル" }
description = { zh-CN = "还原 Echo-Live 的气泡主题：白色圆角框、灰色粗边与右下硬投影", en-US = "Echo-Live's bubble theme: a white rounded box with a thick grey border and a hard drop shadow", ja-JP = "Echo-Live のバブルテーマを再現：白い角丸の枠、太い灰色の縁と右下のハードシャドウ" }
schema = 2

[chrome]
accent = "#888888"
surface = "#ffffff"
text = "#000000"

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

# Echo-Live draws on a 1920-wide page; every length here is two thirds of it.
[dialogue]
region = [1280, 180]
padding = [66, 50, 54, 40]

# The box gives up 16px (here 11) on the right and bottom for its shadow.
shader_effects = []

[dialogue.box]
color = "#ffffff"
border_color = "#888888"
border_width = 5
radius = 20
margin = [0, 11, 11, 0]
shadows = [{ color = "#888888", dx = 11, dy = 11 }]

# SAVE LOAD Q.SAVE Q.LOAD ⭰ ⯬ 🡄 🡆 ⯮ ⭲ HISTORY ╳.
frame = { image = "echo_bubble/still.png", slice = [28, 90, 28, 28], layout_inset = false }

[[dialogue.decor]]
anchor = "bottom_left"
offset = [62, -12]
size = [46, 22]
text = "SAVE"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [121, -12]
size = [48, 22]
text = "LOAD"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [182, -12]
size = [62, 22]
text = "Q.SAVE"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [257, -12]
size = [64, 22]
text = "Q.LOAD"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [334, -12]
size = [52, 22]
text = "« ‹ › »"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [399, -12]
size = [78, 22]
text = "HISTORY"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [490, -12]
size = [18, 22]
text = "✕"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[dialogue.text]
color = "#000000"
size = 27

[dialogue.nameplate]
color = "#00000000"
text_color = "#000000"
size = 27
radius = 0
padding = [0, 0]
offset = [39, 18]

[dialogue.continue]
glyph = ""
motion = "none"

# 30 ms a character; CJK skips a tick.
[dialogue.reveal]
base_ms = 30
cjk_factor = 2.0
punct = { comma_ms = 0, stop_ms = 0, ellipsis_ms = 0 }

[dialogue.reveal.entrance]
kind = "none"
ms = 0

# Echo-Live's history page at half size (its base font is 36px): one row
# per line with name, message and HH:MM:SS side by side, no bubbles.
[history]
width = 640
height = 480
layout = "inline"
name_width = 120
name_size = 18
time_size = 16
time_seconds = true
gap = 9
entrance = "none"
# Like Echo-Live, the line still on the dialogue box joins once it clears.
hide_latest = true
bubble_color = "#00000000"
bubble_border_width = 0
bubble_radius = 0
bubble_padding = [0, 1]
avatar = { shape = "none" }
name_weight = 400
name_color = "#000000"
time_color = "#888888"
# The panel gives up 16px (here 8) on the right and bottom for its shadow.
panel = { color = "#ffffff", border_color = "#888888", border_width = 4, radius = 15, padding = [18, 18, 18, 18], margin = [0, 8, 8, 0], shadows = [{ color = "#888888", dx = 8, dy = 8 }] }

[history.text]
color = "#000000"
size = 18
line_height = 1.4

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0


[shaders.responsive_print]
source = "echo_bubble/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [1]

[shaders.compact_print]
source = "echo_bubble/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2]

[shaders.minimal_print]
source = "echo_bubble/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [{ anchor = "bottom_left", offset = [62, -12], size = [46, 22], text = "SAVE", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }, { anchor = "bottom_left", offset = [121, -12], size = [48, 22], text = "LOAD", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }, { anchor = "bottom_left", offset = [182, -12], size = [62, 22], text = "Q.SAVE", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }, { anchor = "bottom_left", offset = [257, -12], size = [64, 22], text = "Q.LOAD", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }, { anchor = "bottom_left", offset = [334, -12], size = [52, 22], text = "« ‹ › »", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }, { anchor = "bottom_left", offset = [399, -12], size = [78, 22], text = "HISTORY", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }, { anchor = "bottom_left", offset = [490, -12], size = [18, 22], text = "✕", when = "display", text_color = "#888888", text_size = 18, font = "body", min_window = [1000, 160] }] }
portrait = { padding = [20, 24, 56, 72], box = { color = "#ffffff", border_color = "#888888", border_width = 5, radius = 20, margin = [0, 11, 11, 0], shadows = [{ color = "#888888", dx = 11, dy = 11 }], width_fraction = 1 }, nameplate = { color = "#00000000", text_color = "#000000", size = 27, radius = 0, padding = [4, 4], offset = [-8, 12], anchor = "top_right", rotate = 0 }, continue = { glyph = "", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#00000000", text_color = "#000000", size = 27, radius = 0, padding = [0, 0], offset = [12, 4], anchor = "top_left", rotate = 0 }, box = { color = "#ffffff", border_color = "#888888", border_width = 5, radius = 20, margin = [0, 0, 0, 0], shadows = [{ color = "#888888", dx = 11, dy = 11 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#00000000", text_color = "#000000", size = 27, radius = 0, padding = [0, 0], offset = [12, 4], anchor = "top_left", rotate = 0 }, box = { color = "#ffffff", border_color = "#888888", border_width = 5, radius = 20, margin = [0, 0, 0, 0], shadows = [{ color = "#888888", dx = 11, dy = 11 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { color = "#ffffff", border_color = "#888888", border_width = 5, radius = 20, margin = [0, 0, 0, 0], shadows = [{ color = "#888888", dx = 11, dy = 11 }], width_fraction = 1 } }
