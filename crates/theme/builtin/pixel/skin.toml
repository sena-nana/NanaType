[chrome]
accent = "#306230"
surface = "#c4d7a0"
text = "#0f380f"

[dialogue]
overflow = "page"
padding = [24.0, 26.0, 24.0, 16.0]

[dialogue.box]
border_color = "#0f380f"
border_width = 4.0
color = "#9bbc0f"
contour = "pixel"

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [18, 50, 18, 20]

[[dialogue.box.shadows]]
blur = 0.0
color = "#0f380f"
dx = 4.0
dy = 4.0
inset = false
spread = 0.0

[[dialogue.box.shadows]]
blur = 22.0
color = "#30623055"
dx = 0.0
dy = 0.0
inset = true
spread = 0.0

[dialogue.continue]
bob_px = 3.0
color = "#0f380f"
glyph = "▼"
motion = "blink"
period_s = 0.800000011920929

[dialogue.nameplate]
border_color = "#306230"
border_width = 2.0
color = "#0f380f"
contour = "pixel"
offset = [14.0, -16.0]
padding = [12.0, 3.0]
size = 24.0
text_color = "#9bbc0f"

[dialogue.responsive.landscape]
decor = []

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 40.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
offset = [12.0, 4.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 40.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
offset = [12.0, 4.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame", "nameplate.border_color", "nameplate.contour"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
border_width = 0.0
color = "#0876d0"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
size = 18.0
text_color = "#ffffff"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal]
base_ms = 45

[[dialogue.shader_effects]]
shader = "artwork"
target = "artwork"

[dialogue.text]
color = "#0f380f"
line_height = 1.5
size = 24.0

[effects]
contrast_guard = 3.0
jump_px = 4.0
shake_px = 2.0

[fonts.body]
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "SimSun"]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
weight = 400

[fonts.name]
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "SimSun"]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
weight = 400

[history]
bubble_border = "#0f380f"
bubble_border_width = 3.0
bubble_color = "#9bbc0f"
bubble_contour = "pixel"
name_color = "#0f380f"
name_size = 24.0
name_weight = 400
time_color = "#306230"
time_size = 12.0

[history.avatar]
color = "#9bbc0f"
radius = 0.0
ring_color = "#0f380f"
ring_width = 2.0
shape = "square"
size = 36.0

[[history.bubble_shadows]]
blur = 0.0
color = "#0f380f"
dx = 2.0
dy = 2.0
inset = false
spread = 0.0

[history.chat]
bubble_opacity = 1.0
text_scale = 1.0

[history.panel]
border_color = "#0f380f"
border_style = "solid"
border_width = 3.0
color = "#c4d7a0"
contour = "pixel"
margin = [8.0, 8.0, 10.0, 8.0]
padding = [12.0, 12.0, 12.0, 12.0]
radius = 0.0

[[history.panel.shadows]]
blur = 0.0
color = "#306230"
dx = 2.0
dy = 2.0
inset = false
spread = 0.0

[history.reply]
size = 12.0

[history.text]
color = "#0f380f"
line_height = 1.5
size = 24.0

[mention]
fill = "#306230"
scale = 1.0
text_color = "#c4d7a0"

[shaders.artwork]
animated = true
intensity = 1.0
params = []
period_s = 16.0
source = "artwork.wgsl"
static_fallback = false
textures = []

[shaders.compact_print]
