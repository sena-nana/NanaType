[chrome]
accent = "#7a4824"
surface = "#fffcf5"
text = "#3e2a1c"

[dialogue]
padding = [34.0, 38.0, 34.0, 16.0]
region = [780.0, 178.0]

[dialogue.box]
border_color = "#8a5a2b"
border_width = 2.0
color = "#f1dfbc"
margin = [6.0, 4.0, 4.0, 4.0]
radius = 5.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [60, 152, 60, 152]

[dialogue.box.gradient]
angle = 180.0
center = [50.0, 50.0]
circle = false
kind = "radial"
stops = [[0.0, "#f8ebd1"], [1.0, "#e9d1a4"]]

[dialogue.box.shadow]
blur = 10.0
color = "#3a261747"
dx = 0.0
dy = 6.0

[dialogue.continue]
bob_px = 3.0
color = "#5c341c"
glyph = "▼"
motion = "bob"

[dialogue.nameplate]
border_color = "#d9b26a"
border_width = 1.0
color = "#5c341c"
offset = [38.0, -6.0]
padding = [12.0, 3.0]
radius = 1.0
size = 20.0
text_color = "#f0d79e"

[dialogue.nameplate.gradient]
angle = 180.0
center = [50.0, 50.0]
circle = false
kind = "linear"
stops = [[0.0, "#663b20"], [1.0, "#52301a"]]

[[dialogue.nameplate.shadows]]
blur = 0.0
color = "#5c341c"
dx = 0.0
dy = 0.0
inset = false
spread = 3.0

[[dialogue.nameplate.shadows]]
blur = 0.0
color = "#8c5a33"
dx = 0.0
dy = 0.0
inset = false
spread = 4.0

[[dialogue.nameplate.shadows]]
blur = 2.5
color = "#2a170b73"
dx = 0.0
dy = 1.5
inset = false
spread = 4.0

[dialogue.responsive.landscape]
decor = []

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]
margin = [0.0, 0.0, 0.0, 0.0]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 44.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]

[dialogue.responsive.rules.layout.nameplate]
