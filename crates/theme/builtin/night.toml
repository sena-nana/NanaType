[meta]
id = "nanatype.night"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["classic"]
name = { zh-CN = "夜色", en-US = "Night", ja-JP = "夜色" }
description = { zh-CN = "深蓝玻璃底、霓虹描边与流光下划线", en-US = "Deep-blue glass with a neon edge and a glowing underline", ja-JP = "深い青のガラスにネオンの縁取りと光るライン" }
schema = 2

[chrome]
appearance = "dark"
accent = "#5cb8ff"
surface = "#1c2531"
text = "#e6edf5"

[dialogue]
padding = [26, 26, 26, 16]
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "hud"
color = "#0b1220f0"
border_color = "#5cb8ff"
border_width = 1.5
radius = 16
glow = "#5cb8ff59"
glow_blur = 12
gradient = { stops = [[0, "#101c2cf2"], [1, "#0b1220f2"]] }
shadows = [{ color = "#5cb8ff30", blur = 14, inset = true }]

# Neon underline fading out at both ends.
frame = { image = "night/still.png", slice = [32, 110, 22, 28], layout_inset = false }

[dialogue.text]
color = "#bae0ff"
shadow = { color = "#5cb8ff88", blur = 6 }

[dialogue.nameplate]
contour = "hud"
color = "#0b1220"
text_color = "#e4f4ff"
radius = 3
padding = [12, 3]
offset = [20, -15]
border_color = "#5cb8ff"
border_width = 1.5
shadows = [{ color = "#5cb8ff66", blur = 10 }]
text_shadow = { color = "#5cb8ff", blur = 8 }
gradient = { angle = 180, stops = [[0, "#193953"], [1, "#101D30"]] }

[dialogue.continue]
color = "#5cb8ff"
motion = "blink"
period_s = 1.0

[history]
bubble_contour = "hud"
name_color = "#5cb8ff"
bubble_color = "#0b1220e6"
bubble_border = "#5cb8ff59"
bubble_radius = 12
bubble_shadows = [{ color = "#5cb8ff33", blur = 10 }]
time_color = "#84a0bc"
avatar = { shape = "circle", size = 40, ring_color = "#5cb8ff", ring_width = 1.5 }

[history.text]
color = "#d4ebff"

[shaders.artwork]
source = "night/artwork.wgsl"
period_s = 16
intensity = 1


[shaders.responsive_print]
source = "night/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [1]

[shaders.compact_print]
source = "night/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [2]

[shaders.minimal_print]
source = "night/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 72], box = { contour = "hud", color = "#0b1220f0", border_color = "#5cb8ff", border_width = 1.5, radius = 16, glow = "#5cb8ff59", glow_blur = 12, gradient = { stops = [[0, "#101c2cf2"], [1, "#0b1220f2"]] }, shadows = [{ color = "#5cb8ff30", blur = 14, inset = true }], width_fraction = 1 }, nameplate = { contour = "hud", color = "#0b1220", text_color = "#e4f4ff", radius = 3, padding = [4, 4], offset = [-8, 12], border_color = "#5cb8ff", border_width = 1.5, shadows = [{ color = "#5cb8ff66", blur = 10 }], text_shadow = { color = "#5cb8ff", blur = 8 }, gradient = { angle = 180, stops = [[0, "#193953"], [1, "#101D30"]] }, anchor = "top_right", rotate = 0 }, continue = { color = "#5cb8ff", motion = "blink", period_s = 1.0, anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { contour = "hud", color = "#0b1220", text_color = "#e4f4ff", radius = 3, padding = [12, 3], offset = [12, 4], border_color = "#5cb8ff", border_width = 1.5, shadows = [{ color = "#5cb8ff66", blur = 10 }], text_shadow = { color = "#5cb8ff", blur = 8 }, gradient = { angle = 180, stops = [[0, "#193953"], [1, "#101D30"]] }, anchor = "top_left", rotate = 0 }, box = { contour = "hud", color = "#0b1220f0", border_color = "#5cb8ff", border_width = 1.5, radius = 16, glow = "#5cb8ff59", glow_blur = 12, gradient = { stops = [[0, "#101c2cf2"], [1, "#0b1220f2"]] }, shadows = [{ color = "#5cb8ff30", blur = 14, inset = true }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { contour = "hud", color = "#0b1220", text_color = "#e4f4ff", radius = 3, padding = [12, 3], offset = [12, 4], border_color = "#5cb8ff", border_width = 1.5, shadows = [{ color = "#5cb8ff66", blur = 10 }], text_shadow = { color = "#5cb8ff", blur = 8 }, gradient = { angle = 180, stops = [[0, "#193953"], [1, "#101D30"]] }, anchor = "top_left", rotate = 0 }, box = { contour = "hud", color = "#0b1220f0", border_color = "#5cb8ff", border_width = 1.5, radius = 16, glow = "#5cb8ff59", glow_blur = 12, gradient = { stops = [[0, "#101c2cf2"], [1, "#0b1220f2"]] }, shadows = [{ color = "#5cb8ff30", blur = 14, inset = true }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { contour = "hud", color = "#0b1220f0", border_color = "#5cb8ff", border_width = 1.5, radius = 16, glow = "#5cb8ff59", glow_blur = 12, gradient = { stops = [[0, "#101c2cf2"], [1, "#0b1220f2"]] }, shadows = [{ color = "#5cb8ff30", blur = 14, inset = true }], width_fraction = 1 } }
