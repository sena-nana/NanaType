[meta]
id = "nanatype.bubble"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "cute"]
name = { zh-CN = "气泡", en-US = "Bubble", ja-JP = "バブル" }
description = { zh-CN = "粗描边圆润对话气泡，带小尾巴和倾斜名牌", en-US = "A chunky outlined speech bubble with a tail and a tilted name tag", ja-JP = "太い縁取りの丸い吹き出しに、しっぽと傾いた名札" }
schema = 2

[chrome]
accent = "#ff7aa8"
surface = "#ffffff"
text = "#2b2b3a"

[fonts.body]
weight = 700

[fonts.name]
weight = 800

[fonts.accent]
families = ["Segoe UI Symbol", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[dialogue]
region = [760, 170]
padding = [30, 30, 30, 18]
shader_effects = [{ shader = "artwork", target = "artwork" }]

[dialogue.box]
contour = "rounded"
color = "#ffffff"
border_color = "#2b2b3a"
border_width = 4
radius = 30
margin = [0, 0, 26, 0]
shadows = [{ color = "#2b2b3a40", dy = 6 }]
frame = { image = "bubble/still.png", slice = [32, 74, 36, 34], layout_inset = false }

[dialogue.tail]
side = "bottom"
at = 0.14
width = 34
length = 24
lean = -10

[dialogue.text]
color = "#2b2b3a"

[dialogue.nameplate]
color = "#ff7aa8"
text_color = "#6A2445"
radius = 999
padding = [14, 3]
offset = [28, -18]
border_color = "border"
border_width = 3
rotate = -2
gradient = { angle = 180, stops = [[0, "#FF95B8"], [1, "#F36D9D"]] }

[dialogue.continue]
color = "#ff7aa8"
offset = [-26, -12]

[history]
bubble_contour = "rounded"
name_color = "#ff5c95"
bubble_color = "#ffffff"
bubble_border = "#2b2b3a"
bubble_border_width = 3
bubble_radius = 18
bubble_radii = [5, 18, 18, 18]
bubble_shadows = [{ color = "#2b2b3a40", dy = 3 }]
avatar = { shape = "circle", size = 40, ring_color = "#2b2b3a", ring_width = 3 }
name_plate = { color = "name", text_color = "name_text", border_color = "#2b2b3a", border_width = 2, radius = 999, padding = [9, 2] }

[history.text]
color = "#2b2b3a"

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0

[shaders.artwork]
source = "bubble/artwork.wgsl"
period_s = 16
intensity = 1


[shaders.responsive_print]
source = "bubble/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [1]

[shaders.compact_print]
source = "bubble/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = true
params = [2]

[shaders.minimal_print]
source = "bubble/artwork.wgsl"
intensity = 1
period_s = 16
static_fallback = true
animated = false
params = [2, 1]

# Preserve the original print; resize its reading field, not a flattened plate.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 72], box = { contour = "rounded", color = "#ffffff", border_color = "#2b2b3a", border_width = 4, radius = 30, margin = [0, 0, 26, 0], shadows = [{ color = "#2b2b3a40", dy = 6 }], width_fraction = 1 }, nameplate = { color = "#ff7aa8", text_color = "#6A2445", radius = 999, padding = [4, 4], offset = [-8, 12], border_color = "border", border_width = 3, rotate = 0, gradient = { angle = 180, stops = [[0, "#FF95B8"], [1, "#F36D9D"]] }, anchor = "top_right" }, continue = { color = "#ff7aa8", offset = [12, -8], anchor = "bottom_left" }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#ff7aa8", text_color = "#6A2445", radius = 999, padding = [14, 3], offset = [12, 4], border_color = "border", border_width = 3, rotate = 0, gradient = { angle = 180, stops = [[0, "#FF95B8"], [1, "#F36D9D"]] }, anchor = "top_left" }, box = { contour = "rounded", color = "#ffffff", border_color = "#2b2b3a", border_width = 4, radius = 30, margin = [0, 0, 26, 0], shadows = [{ color = "#2b2b3a40", dy = 6 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#ff7aa8", text_color = "#6A2445", radius = 999, padding = [14, 3], offset = [12, 4], border_color = "border", border_width = 3, rotate = 0, gradient = { angle = 180, stops = [[0, "#FF95B8"], [1, "#F36D9D"]] }, anchor = "top_left" }, box = { contour = "rounded", color = "#ffffff", border_color = "#2b2b3a", border_width = 4, radius = 30, margin = [0, 0, 0, 0], shadows = [{ color = "#2b2b3a40", dy = 6 }], width_fraction = 1 }, shader_effects = [{ shader = "compact_print", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 48], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 24], decor = [], shader_effects = [{ shader = "responsive_print", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "minimal_print", target = "artwork" }], box = { contour = "rounded", color = "#ffffff", border_color = "#2b2b3a", border_width = 4, radius = 30, margin = [0, 0, 0, 0], shadows = [{ color = "#2b2b3a40", dy = 6 }], width_fraction = 1 } }
