[chrome]
accent = "#33ff66"
appearance = "dark"
surface = "#0d140e"
text = "#c8ffd4"

[dialogue]
padding = [22.0, 40.0, 22.0, 14.0]

[dialogue.box]
border_color = "#1f5f2a"
border_width = 1.0
color = "#0a0f0af2"
contour = "terminal"
radius = 4.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [28, 28, 16, 54]

[[dialogue.box.shadows]]
blur = 16.0
color = "#33ff6626"
dx = 0.0
dy = 0.0
inset = false
spread = 0.0

[dialogue.continue]
bob_px = 3.0
color = "#33ff66"
glyph = "█"
motion = "blink"
period_s = 1.0

[dialogue.nameplate]
anchor = "top_right"
offset = [-12.0, 4.0]
padding = [0.0, 0.0]
size = 13.0
text_color = "#33ff66"

[dialogue.nameplate.text_shadow]
blur = 4.0
color = "#33ff6680"
dx = 0.0
dy = 0.0

[dialogue.responsive.landscape]
decor = []

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
offset = [-8.0, 12.0]
padding = [4.0, 4.0]

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 46.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
anchor = "top_left"
offset = [82.0, 3.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 46.0, 16.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
anchor = "top_left"
offset = [82.0, 3.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame", "nameplate.text_shadow"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
anchor = "top_left"
color = "#0876d0"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
size = 18.0
text_color = "#ffffff"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal]
base_ms = 35
cjk_factor = 1.600000023841858

[[dialogue.shader_effects]]
shader = "artwork"
target = "artwork"

[dialogue.text]
color = "#33ff66"
letter_spacing = 0.5
size = 24.0

[dialogue.text.shadow]
blur = 6.0
color = "#33ff6680"
dx = 0.0
dy = 0.0

[effects]
contrast_guard = 3.0

[fonts.accent]
families = ["Cascadia Mono", "Consolas", "Segoe UI Symbol"]
weight = 400

[fonts.body]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 400

[fonts.name]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 400

[history]
bubble_border = "#286637"
bubble_border_width = 1.0
bubble_color = "#0a0f0ae6"
bubble_contour = "terminal"
bubble_radius = 2.0
name_color = "#33ff66"
name_size = 17.0
name_weight = 400
time_color = "#4f8f5e"
time_size = 12.0

[history.avatar]
color = "#0a0f0a"
radius = 0.0
ring_color = "#33ff66"
ring_width = 1.0
shape = "square"
size = 32.0

[history.panel]
border_color = "#286637"
border_style = "solid"
border_width = 1.0
color = "#0a0f0af5"
margin = [8.0, 8.0, 8.0, 8.0]
padding = [12.0, 12.0, 12.0, 12.0]
radius = 2.0
shadows = []

[history.text]
color = "#33ff66"
size = 17.0

[history.text.shadow]
blur = 4.0
color = "#33ff6660"
dx = 0.0
dy = 0.0

[history.title]
background = "#102416"
color = "#33ff66"
height = 36.0
padding = 14.0
size = 13.0
text = "> HISTORY"
weight = 400

[shaders.artwork]
animated = true
intensity = 1.0
params = []
period_s = 16.0
source = "artwork.wgsl"
static_fallback = false
textures = []

[shaders.compact_print]
animated = true
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
animated = true
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []
