[chrome]
accent = "#ffb000"
appearance = "dark"
surface = "#1a1308"
text = "#ffc547"

[dialogue]
padding = [24.0, 60.0, 48.0, 14.0]
region = [760.0, 184.0]

[[dialogue.decor]]
anchor = "top"
font = "accent"
offset = [0.0, 3.0]
size = [160.0, 18.0]
text = "~/stream"
text_color = "#a88536"
text_size = 12.0

[[dialogue.decor]]
anchor = "top_right"
font = "accent"
offset = [-10.0, 3.0]
opacity = 0.7
size = [48.0, 18.0]
text = "utf-8"
text_color = "#a88536"
text_size = 12.0

[dialogue.box]
border_color = "#ffb00052"
border_width = 1.5
color = "#0d0a05f2"
radius = 6.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [28, 28, 16, 72]

[[dialogue.box.shadows]]
blur = 8.0
color = "#00000059"
dx = 0.0
dy = 3.0
inset = false
spread = 0.0

[dialogue.continue]
bob_px = 3.0
color = "#ffb000"
glyph = "▯"
motion = "blink"
offset = [-22.0, -18.0]
period_s = 1.0
size = 24.0

[dialogue.nameplate]
offset = [24.0, 33.0]
padding = [0.0, 0.0]
size = 17.0
text_color = "#ffb000"

[dialogue.nameplate.text_shadow]
blur = 4.0
color = "#ffb00080"
dx = 0.0
dy = 0.0

[dialogue.reply]
color = "#a88536"
size = 14.0

[dialogue.responsive.landscape]

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [14.0, 38.0, 14.0, 14.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
radius = 5.0

[dialogue.responsive.rules.layout.nameplate]
offset = [14.0, 10.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [14.0, 38.0, 14.0, 14.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
radius = 5.0

[dialogue.responsive.rules.layout.nameplate]
offset = [14.0, 10.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame", "nameplate.text_shadow"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
color = "#ffb000"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
size = 18.0
text_color = "#0d0a05"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal]
base_ms = 35
cjk_factor = 1.600000023841858

[[dialogue.shader_effects]]
shader = "artwork"
target = "artwork"

[dialogue.text]
color = "#ffc547"
letter_spacing = 0.5
line_height = 1.5
size = 24.0

[dialogue.text.shadow]
blur = 5.0
color = "#ffb0008c"
dx = 0.0
dy = 0.0

[effects]
contrast_guard = 3.0

[fonts.accent]
families = ["Cascadia Mono", "Consolas", "Segoe UI Symbol"]
weight = 400

[fonts.body]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 400

[fonts.name]
families = ["Cascadia Mono", "Consolas", "Sarasa Mono SC", "NSimSun", "Menlo"]
weight = 700

[history]
bubble_border = "#ffb00052"
bubble_border_width = 1.0
bubble_color = "#0d0a05e6"
bubble_contour = "terminal"
bubble_radius = 2.0
name_color = "#ffb000"
name_size = 17.0
name_weight = 400
time_color = "#a88536"
time_size = 12.0

[history.avatar]
color = "#ffb000"
radius = 0.0
ring_color = "#ffb000"
ring_width = 1.0
shape = "square"
size = 32.0

[history.panel]
border_color = "#ffb00052"
border_style = "solid"
border_width = 1.0
color = "#0d0a05f5"
margin = [8.0, 8.0, 8.0, 8.0]
padding = [12.0, 12.0, 12.0, 12.0]
radius = 2.0
shadows = []

[history.reply]
color = "#a88536"

[history.text]
color = "#ffc547"
size = 17.0

[history.text.shadow]
blur = 4.0
color = "#ffb00060"
dx = 0.0
dy = 0.0

[history.title]
background = "#1a1308"
color = "#ffb000"
height = 36.0
padding = 14.0
size = 13.0
text = "> HISTORY"
weight = 400

[mention]
avatar = true
fill = "#2f2104"
scale = 0.72
text_color = "#ffd27a"

[shaders.artwork]
animated = true
intensity = 1.0
params = []
period_s = 16.0
source = "artwork.wgsl"
static_fallback = false
textures = []

[shaders.compact_print]
animated = true
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
animated = true
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []
