[meta]
schema = 2
id = "nanatype.lantern"
version = "1.1.2"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "elegant"]
name = { zh-CN = "朱砂华灯", en-US = "Vermilion Lantern", ja-JP = "朱の華灯" }
description = { zh-CN = "朱砂侧栏、金色窗棂与华灯；完整程序版画", en-US = "Original procedural print artwork", ja-JP = "オリジナルのプロシージャル版画" }

[chrome]
appearance = "light"
accent = "#B83B38"
surface = "#FAF0DD"
text = "#55312A"

[dialogue]
region = [920, 220]
overscan = 16
padding = [66, 66, 155, 28]
shader_effects = [{ shader = "artwork", target = "artwork" }]
box = { color = "#FAF0DD", border_color = "#C6A15B", frame = { image = "lantern/still.png", slice = [0, 0, 0, 0] } }
text = { color = "#55312A", size = 25, line_height = 1.45 }
nameplate = { color = "#B83B38", text_color = "#FAF0DD", contour = "seal", border_color = "#D9B77A", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#BC4540"], [1, "#A23030"]] }, radius = 1, padding = [10, 4], offset = [66, 11], size = 19 }
continue = { glyph = "· · ·", color = "#B83B38", motion = "none" }

[shaders.artwork]
static_fallback = true
source = "lantern/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["lantern/ornament.png"]

[shaders.responsive_artwork]
static_fallback = true
source = "lantern/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["lantern/ornament.png"]
params = [1, 1]

[shaders.responsive_compact]
static_fallback = true
source = "lantern/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["lantern/ornament.png"]
params = [1, 0, 1]

[history]
name_color = "#B83B38"
time_color = "#8B6B42"
bubble_color = "#FAF0DD"
bubble_border = "#C6A15B"
bubble_border_width = 0.8
bubble_radius = 2
bubble_shadows = [{ color = "#B83B3840", dx = 3, inset = true }]
name_plate = { contour = "seal", color = "#B83B38", text_color = "#FAF0DD", gradient = { angle = 180, stops = [[0, "#BC4540"], [1, "#A23030"]] }, border_color = "#D9B77A", border_width = 0.8, radius = 1, padding = [8, 2] }
avatar = { shape = "square", size = 36, radius = 1, color = "#FAF0DD", ring_color = "#B83B38", ring_width = 2 }
panel = { color = "#FAF0DDFA", border_color = "#C6A15B", border_width = 1, radius = 2, padding = [14, 14, 14, 18], margin = [8, 8, 8, 8], shadows = [{ color = "#B83B38", dx = 4, inset = true }] }
title = { text = "HISTORY", color = "#B83B38", size = 14, weight = 600, height = 56, padding = 18 }
text = { color = "#55312A" }

[[history.decor]]
inset = [6, 6, 6, 10]
border_color = "#C6A15B70"
border_width = 0.6
layer = "below"

[[history.decor]]
anchor = "top_right"
offset = [-12, 3]
size = [34, 50]
image = "lantern/ornament.png"

[[history.decor]]
anchor = "bottom_right"
offset = [-14, -14]
size = [54, 54]
polygon = [[50, 0], [100, 50], [50, 100], [0, 50]]
border_color = "#C6A15B"
border_width = 1
opacity = 0.25
layer = "below"

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#FAF0DD", border_color = "#C6A15B", width_fraction = 1, border_width = 1, radius = 18 }, nameplate = { color = "#B83B38", text_color = "#FAF0DD", contour = "seal", border_color = "#D9B77A", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#BC4540"], [1, "#A23030"]] }, radius = 1, padding = [4, 4], offset = [-8, 12], size = 19, anchor = "top_right", rotate = 0 }, continue = { glyph = "· · ·", color = "#B83B38", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [{ image = "lantern/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 52, 16], nameplate = { color = "#B83B38", text_color = "#FAF0DD", contour = "seal", border_color = "#D9B77A", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#BC4540"], [1, "#A23030"]] }, radius = 1, padding = [10, 4], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#FAF0DD", border_color = "#C6A15B", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [{ image = "lantern/ornament.png", size = [32, 40], aspect_ratio = 0.8, anchor = "bottom_right", offset = [-8, -8], min_window = [280, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#B83B38", text_color = "#FAF0DD", contour = "seal", border_color = "#D9B77A", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#BC4540"], [1, "#A23030"]] }, radius = 1, padding = [10, 4], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#FAF0DD", border_color = "#C6A15B", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 84], decor = [{ image = "lantern/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 92], decor = [{ image = "lantern/ornament.png", size = [56, 70], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 }, min_window = [160, 260] }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_compact", target = "artwork" }], box = { color = "#FAF0DD", border_color = "#C6A15B", width_fraction = 1, border_width = 1, radius = 18 } }
