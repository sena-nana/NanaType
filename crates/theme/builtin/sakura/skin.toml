[chrome]
accent = "#c2416f"
surface = "#fff7fa"
text = "#6b2141"

[dialogue]
padding = [38.0, 74.0, 106.0, 32.0]
region = [780.0, 210.0]

[dialogue.box]
border_color = "#e7a3bc"
border_width = 0.0
color = "#fff0f5d9"
radius = 18.0

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [64, 150, 40, 40]

[dialogue.continue]
bob_px = 3.0
color = "#c2416f"
glyph = "♥"
motion = "pulse"
offset = [-56.0, -16.0]
period_s = 1.0

[[dialogue.decor]]
anchor = "top_left"
border_color = "#c2416f"
border_width = 1.6
color = "#c2416f"
layer = "above"
motif = "blossom"
offset = [37.0, 42.0]
size = [17.0, 17.0]
when = "speaker"

[dialogue.nameplate]
color = "#00000000"
offset = [60.0, 40.0]
padding = [0.0, 0.0]
radius = 0.0
size = 18.0
text_color = "#c2416f"

[dialogue.reply]
color = "#8e4c68"
opacity = 1.0
size = 15.0

[dialogue.responsive.landscape]

[[dialogue.responsive.landscape.decor]]
anchor = "top_left"
border_color = "#c2416f"
border_width = 1.6
color = "#c2416f"
layer = "above"
motif = "blossom"
offset = [37.0, 42.0]
size = [17.0, 17.0]
when = "speaker"


[dialogue.responsive.portrait]
padding = [22.0, 48.0, 22.0, 40.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[[dialogue.responsive.portrait.decor]]
anchor = "top_right"
border_color = "#c2416f"
border_width = 1.6
color = "#c2416f"
layer = "above"
motif = "blossom"
offset = [-18.0, 14.0]
size = [15.0, 15.0]
when = "speaker"

# Vertical writing: the blossom sits above the name at the top right.
[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-14.0, 34.0]
size = 17.0

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
padding = [18.0, 42.0, 18.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[[dialogue.responsive.rules.layout.decor]]
anchor = "top_left"
border_color = "#c2416f"
border_width = 1.6
color = "#c2416f"
layer = "above"
motif = "blossom"
offset = [16.0, 15.0]
size = [14.0, 14.0]
when = "speaker"

[dialogue.responsive.rules.layout.nameplate]
offset = [35.0, 12.0]
size = 17.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
padding = [18.0, 42.0, 18.0, 16.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[[dialogue.responsive.rules.layout.decor]]
anchor = "top_left"
border_color = "#c2416f"
border_width = 1.6
color = "#c2416f"
layer = "above"
motif = "blossom"
offset = [16.0, 15.0]
size = [14.0, 14.0]
when = "speaker"

[dialogue.responsive.rules.layout.nameplate]
offset = [35.0, 12.0]
size = 17.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]

[dialogue.responsive.rules.layout.nameplate]
color = "#c2416f"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
text_color = "#ffffff"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal.entrance]
kind = "fade"
ms = 140

[[dialogue.shader_effects]]
shader = "artwork"
target = "artwork"

[dialogue.text]
color = "#6b2141"
line_height = 1.45
size = 27.0

[effects]
contrast_guard = 3.0

[fonts.accent]
families = ["Segoe UI Symbol", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[fonts.body]
families = ["LXGW WenKai", "KaiTi", "Kaiti SC", "Noto Sans SC"]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
weight = 400

[fonts.name]
families = ["LXGW WenKai", "KaiTi", "Kaiti SC", "Noto Sans SC"]
file = "builtin:fonts/LXGWWenKai-Regular.ttf"
weight = 400

[history]
bubble_border = "#f2c4d5"
bubble_border_width = 1.5
bubble_color = "#fff0f5f2"
bubble_contour = "rounded"
bubble_radius = 16.0
entrance = "slide_up"
name_color = "#c2416f"
time_color = "#8e4c68"

[history.avatar]
ring_color = "#f7b8ce"
ring_width = 2.0

[history.bubble_gradient]
angle = 135.0
center = [50.0, 50.0]
circle = false
kind = "linear"
stops = [[0.0, "#fff7faf2"], [1.0, "#fdeaf1ee"]]

[[history.bubble_shadows]]
blur = 10.0
color = "#c2416f1f"
dx = 0.0
dy = 3.0
inset = false
spread = 0.0

[history.name_plate]
border_color = "#f2c4d5"
border_style = "solid"
border_width = 0.0
color = "#f8d3e1"
padding = [8.0, 1.0]
radius = 12.0
shadows = []
text_color = "#8e2a55"

[history.reply]
color = "#8e4c68"
opacity = 1.0

[history.text]
color = "#6b2141"

[mention]
fill = "#f8d3e1"
scale = 0.72
text_color = "#8e2a55"

[shaders.artwork]
animated = true
intensity = 1.0
params = []
period_s = 16.0
source = "artwork.wgsl"
static_fallback = false
textures = ["ornament.png"]

[shaders.compact_print]
animated = false
intensity = 1.0
params = [2.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = ["ornament.png"]

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = ["ornament.png"]

[shaders.responsive_print]
animated = false
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = ["ornament.png"]
