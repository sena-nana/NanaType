[meta]
schema = 2
id = "nanatype.celestial"
version = "1.1.2"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "elegant"]
name = { zh-CN = "星月魔法", en-US = "Celestial", ja-JP = "星月の魔法" }
description = { zh-CN = "偏心天球仪、月相与夜空星图；完整程序版画", en-US = "Original procedural print artwork", ja-JP = "オリジナルのプロシージャル版画" }

[chrome]
appearance = "dark"
accent = "#B5A1E8"
surface = "#211C39"
text = "#F4EEFF"

[dialogue]
region = [920, 220]
overscan = 16
padding = [36, 65, 217, 28]
shader_effects = [{ shader = "artwork", target = "artwork" }]
box = { color = "#211C39", border_color = "#E7CC94", frame = { image = "celestial/still.png", slice = [0, 0, 0, 0] } }
text = { color = "#F4EEFF", size = 26, line_height = 1.45 }
nameplate = { color = "#211C39", text_color = "#E7CC94", border_color = "#E7CC94", border_width = 1, gradient = { angle = 180, stops = [[0, "#393153"], [0.5, "#211C39"], [1, "#29223F"]] }, radius = 12, padding = [12, 3], offset = [36, -4], size = 19 }
continue = { glyph = "· · ·", color = "#B5A1E8", motion = "none" }

[shaders.artwork]
static_fallback = true
source = "celestial/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["celestial/ornament.png"]

[shaders.responsive_artwork]
static_fallback = true
source = "celestial/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["celestial/ornament.png"]
params = [1, 1]

[shaders.responsive_compact]
static_fallback = true
source = "celestial/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["celestial/ornament.png"]
params = [1, 0, 1]

[history]
name_color = "#E7CC94"
time_color = "#C4B5D7"
bubble_color = "#211C39"
bubble_border = "#E7CC9480"
bubble_border_width = 0.8
bubble_contour = "orbit"
bubble_radius = 14
bubble_gradient = { angle = 160, stops = [[0, "#393153"], [1, "#211C39"]] }
bubble_shadows = [{ color = "#E7CC9426", spread = 1, inset = true }]
name_plate = { color = "#211C39", text_color = "#E7CC94", gradient = { angle = 180, stops = [[0, "#393153"], [1, "#211C39"]] }, border_color = "#E7CC94", border_width = 0.8, radius = 8, padding = [9, 2] }
avatar = { shape = "circle", size = 36, color = "#393153", ring_color = "#E7CC94", ring_width = 1 }
panel = { color = "#211C39F5", border_color = "#E7CC9480", border_width = 1, radius = 20, padding = [14, 14, 14, 18], margin = [8, 8, 8, 8], shadows = [{ color = "#E7CC9420", spread = 3, inset = true }] }
title = { text = "HISTORY", color = "#E7CC94", size = 14, weight = 600, height = 56, padding = 18 }
text = { color = "#F4EEFF" }

[[history.decor]]
anchor = "top_right"
offset = [-12, 4]
size = [48, 48]
image = "celestial/ornament.png"

[[history.decor]]
anchor = "bottom_right"
offset = [-12, -12]
size = [96, 96]
motif = "orbit"
color = "#E7CC94"
opacity = 0.12
layer = "below"

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#211C39", border_color = "#E7CC94", width_fraction = 1, border_width = 1, radius = 18 }, nameplate = { color = "#211C39", text_color = "#E7CC94", border_color = "#E7CC94", border_width = 1, gradient = { angle = 180, stops = [[0, "#393153"], [0.5, "#211C39"], [1, "#29223F"]] }, radius = 12, padding = [4, 4], offset = [-8, 12], size = 19, anchor = "top_right", rotate = 0 }, continue = { glyph = "· · ·", color = "#B5A1E8", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [{ image = "celestial/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 52, 16], nameplate = { color = "#211C39", text_color = "#E7CC94", border_color = "#E7CC94", border_width = 1, gradient = { angle = 180, stops = [[0, "#393153"], [0.5, "#211C39"], [1, "#29223F"]] }, radius = 12, padding = [12, 3], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#211C39", border_color = "#E7CC94", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [{ image = "celestial/ornament.png", size = [32, 40], aspect_ratio = 0.8, anchor = "bottom_right", offset = [-8, -8], min_window = [280, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#211C39", text_color = "#E7CC94", border_color = "#E7CC94", border_width = 1, gradient = { angle = 180, stops = [[0, "#393153"], [0.5, "#211C39"], [1, "#29223F"]] }, radius = 12, padding = [12, 3], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#211C39", border_color = "#E7CC94", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 84], decor = [{ image = "celestial/ornament.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 92], decor = [{ image = "celestial/ornament.png", size = [56, 70], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 }, min_window = [160, 260] }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_compact", target = "artwork" }], box = { color = "#211C39", border_color = "#E7CC94", width_fraction = 1, border_width = 1, radius = 18 } }
