[chrome]
accent = "#ff7aa8"
text = "#4a2440"

[dialogue]
padding = [50.0, 52.0, 68.0, 50.0]
region = [760.0, 214.0]

[dialogue.box]
border_color = "#7a2e59"
border_width = 0.0
color = "#ffe8f100"

[dialogue.box.frame]
fill = true
image = "still.png"
layout_inset = false
repeat = false
scale = 1.0
slice = [64, 80, 64, 170]

[dialogue.continue]
bob_px = 3.0
color = "#ff7aa8"
glyph = "▼"
motion = "bob"
offset = [-60.0, -46.0]

[dialogue.nameplate]
border_color = "#7a2e59"
border_width = 3.0
color = "#ff7aa8"
offset = [44.0, 8.0]
padding = [14.0, 2.0]
radius = 999.0
size = 19.0
text_color = "#5a1e42"

[dialogue.nameplate.gradient]
angle = 180.0
center = [50.0, 50.0]
circle = false
kind = "linear"
stops = [[0.0, "#ff9cbf"], [1.0, "#ff7aa8"]]

[[dialogue.nameplate.shadows]]
blur = 0.0
color = "#ffb3cf"
dx = 3.0
dy = 3.0
inset = false
spread = 0.0

[dialogue.responsive.landscape]
decor = []

[dialogue.responsive.portrait]
decor = []
padding = [20.0, 24.0, 56.0, 72.0]
unset = ["box.frame"]

[dialogue.responsive.portrait.box]

[dialogue.responsive.portrait.continue]
anchor = "bottom_left"
offset = [12.0, -8.0]

[dialogue.responsive.portrait.nameplate]
anchor = "top_right"
offset = [-8.0, 12.0]
padding = [4.0, 4.0]
rotate = 0.0

[dialogue.responsive.portrait.portrait]

[[dialogue.responsive.portrait.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 600.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 48.0, 18.0, 18.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]

[dialogue.responsive.rules.layout.nameplate]
offset = [14.0, 10.0]
rotate = 0.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 160.0
max_width = 8192.0
portrait = false

[dialogue.responsive.rules.layout]
decor = []
padding = [16.0, 48.0, 18.0, 18.0]
unset = ["box.frame"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]

[dialogue.responsive.rules.layout.nameplate]
offset = [14.0, 10.0]
rotate = 0.0

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "compact_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 8192.0
max_width = 240.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 48.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 480.0
max_width = 8192.0
portrait = true

[dialogue.responsive.rules.layout]
decor = []
padding = [12.0, 16.0, 48.0, 24.0]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "responsive_print"
target = "artwork"

[[dialogue.responsive.rules]]
max_height = 140.0
max_width = 200.0

[dialogue.responsive.rules.layout]
decor = []
padding = [10.0, 12.0, 10.0, 12.0]
unset = ["box.frame", "nameplate.border_color", "nameplate.gradient"]

[dialogue.responsive.rules.layout.box]
margin = [0.0, 0.0, 0.0, 0.0]

[dialogue.responsive.rules.layout.nameplate]
border_width = 0.0
color = "#ff7aa8"
offset = [16.0, -12.0]
padding = [10.0, 4.0]
radius = 10.0
rotate = 0.0
text_color = "#5a1e42"
visible = false

[dialogue.responsive.rules.layout.portrait]

[[dialogue.responsive.rules.layout.shader_effects]]
shader = "minimal_print"
target = "artwork"

[dialogue.reveal.entrance]
kind = "fade"
ms = 140

[[dialogue.shader_effects]]
shader = "artwork"
target = "artwork"

[dialogue.reply]
color = "#86566f"
size = 15.0

[dialogue.text]
color = "#4a2440"
line_height = 1.4
size = 28.0

[effects]
contrast_guard = 3.0

[fonts.accent]
families = ["Segoe UI Symbol", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[fonts.body]
weight = 600

[fonts.name]
weight = 800

[history]
bubble_border = "#7a2e59"
bubble_border_width = 3.0
bubble_color = "#fff4f8"
bubble_contour = "rounded"
bubble_radii = [5.0, 18.0, 18.0, 18.0]
bubble_radius = 18.0
entrance = "slide_up"
name_color = "#7a2e59"
time_color = "#86566f"

[history.avatar]
ring_color = "#7a2e59"
ring_width = 3.0

[[history.bubble_shadows]]
blur = 0.0
color = "#ffb3cf"
dx = 4.0
dy = 4.0
inset = false
spread = 0.0

[history.name_plate]
border_color = "#7a2e59"
border_style = "solid"
border_width = 2.0
color = "#ff7aa8"
padding = [9.0, 2.0]
radius = 999.0
shadows = []
text_color = "#5a1e42"

[history.text]
color = "#4a2440"

[shaders.artwork]
animated = true
intensity = 1.0
params = []
period_s = 16.0
source = "artwork.wgsl"
static_fallback = false
textures = []

[shaders.compact_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.minimal_print]
animated = false
intensity = 1.0
params = [2.0, 1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[shaders.responsive_print]
animated = true
intensity = 1.0
params = [1.0]
period_s = 16.0
source = "artwork.wgsl"
static_fallback = true
textures = []

[mention]
fill = "#ffd6e6"
scale = 0.72
text_color = "#7a2e59"
