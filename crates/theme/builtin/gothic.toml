[meta]
schema = 2
id = "nanatype.gothic"
version = "1.1.2"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "elegant"]
name = { zh-CN = "蔷薇哥特", en-US = "Rose Gothic", ja-JP = "薔薇ゴシック" }
description = { zh-CN = "玫瑰窗、酒红书脊与蚀刻尖拱；完整程序版画", en-US = "Original procedural print artwork", ja-JP = "オリジナルのプロシージャル版画" }

[chrome]
appearance = "dark"
accent = "#9E3153"
surface = "#18131C"
text = "#F5E8ED"

[dialogue]
region = [920, 220]
overscan = 16
padding = [145, 70, 128, 28]
shader_effects = [{ shader = "artwork", target = "artwork" }]
box = { color = "#18131C", border_color = "#C7AB76", frame = { image = "gothic/still.png", slice = [0, 0, 0, 0] } }
text = { color = "#F5E8ED", size = 24, line_height = 1.45 }
nameplate = { color = "#9E3153", text_color = "#F5E8ED", contour = "terminal", border_color = "#C7AB76", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#A13D5D"], [1, "#76263F"]] }, radius = 2, padding = [12, 3], offset = [140, 12], size = 19 }
continue = { glyph = "· · ·", color = "#9E3153", motion = "none" }

[shaders.artwork]
static_fallback = true
source = "gothic/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["gothic/ornament.png"]

[shaders.responsive_artwork]
static_fallback = true
source = "gothic/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["gothic/ornament.png"]
params = [1, 1]

[shaders.responsive_compact]
static_fallback = true
source = "gothic/artwork.wgsl"
period_s = 16
intensity = 1
textures = ["gothic/ornament.png"]
params = [1, 0, 1]

[history]
name_color = "#F5E8ED"
time_color = "#C7AB76"
bubble_color = "#221720"
bubble_border = "#C7AB7680"
bubble_border_width = 1
bubble_contour = "terminal"
bubble_radius = 3
bubble_gradient = { angle = 180, stops = [[0, "#30202E"], [1, "#18131C"]] }
bubble_shadows = [{ color = "#9E315340", dx = 3, inset = true }]
name_plate = { contour = "terminal", color = "#9E3153", text_color = "#F5E8ED", gradient = { angle = 180, stops = [[0, "#A13D5D"], [1, "#76263F"]] }, border_color = "#C7AB76", border_width = 0.8, radius = 2, padding = [9, 2] }
avatar = { shape = "square", size = 36, radius = 2, color = "#76263F", ring_color = "#C7AB76", ring_width = 1 }
panel = { color = "#18131CF5", border_color = "#C7AB76", border_width = 1, radius = 3, padding = [14, 14, 14, 18], margin = [8, 8, 8, 8] }
title = { text = "HISTORY", color = "#F5E8ED", background = "#76263F", size = 14, weight = 600, height = 52, padding = 18 }
text = { color = "#F5E8ED" }

[[history.decor]]
inset = [5, 5, 5, 5]
border_color = "#C7AB7640"
border_width = 0.6
radius = 1
layer = "below"

[[history.decor]]
anchor = "top_right"
offset = [-12, 7]
size = [52, 38]
image = "gothic/ornament.png"
opacity = 0.85

# Native responsive dialogue: logical client dimensions select orientation.
[dialogue.responsive]
landscape = { decor = [] }
portrait = { padding = [20, 24, 56, 164], box = { color = "#18131C", border_color = "#C7AB76", width_fraction = 1, border_width = 1, radius = 18 }, nameplate = { color = "#9E3153", text_color = "#F5E8ED", contour = "terminal", border_color = "#C7AB76", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#A13D5D"], [1, "#76263F"]] }, radius = 2, padding = [4, 4], offset = [-8, 12], size = 19, anchor = "top_right", rotate = 0 }, continue = { glyph = "· · ·", color = "#9E3153", motion = "none", anchor = "bottom_left", offset = [12, -8] }, portrait = { visible = false }, decor = [{ image = "gothic/rose.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }, { image = "gothic/tracery.png", size = [92, 115], anchor = "bottom_right", offset = [-16, -14], aspect_ratio = 0.8, max_fraction = [0.32, 0.15], min_window = [260, 500] }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_width = 600
portrait = false
layout = { padding = [16, 40, 52, 16], nameplate = { color = "#9E3153", text_color = "#F5E8ED", contour = "terminal", border_color = "#C7AB76", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#A13D5D"], [1, "#76263F"]] }, radius = 2, padding = [12, 3], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#18131C", border_color = "#C7AB76", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [{ image = "gothic/rose.png", size = [32, 40], aspect_ratio = 0.8, anchor = "bottom_right", offset = [-8, -8], min_window = [280, 180] }] }

[[dialogue.responsive.rules]]
max_height = 160
portrait = false
layout = { padding = [16, 40, 16, 16], nameplate = { color = "#9E3153", text_color = "#F5E8ED", contour = "terminal", border_color = "#C7AB76", border_width = 0.8, gradient = { angle = 180, stops = [[0, "#A13D5D"], [1, "#76263F"]] }, radius = 2, padding = [12, 3], offset = [12, 4], size = 19, anchor = "top_left", rotate = 0 }, box = { color = "#18131C", border_color = "#C7AB76", width_fraction = 1, border_width = 1, radius = 18 }, shader_effects = [{ shader = "responsive_compact", target = "artwork" }], decor = [] }

[[dialogue.responsive.rules]]
max_width = 240
portrait = true
layout = { padding = [12, 16, 48, 84], decor = [{ image = "gothic/rose.png", size = [112, 140], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 } }], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }] }

[[dialogue.responsive.rules]]
max_height = 480
portrait = true
layout = { padding = [12, 16, 48, 92], decor = [{ image = "gothic/rose.png", size = [56, 70], anchor = "bottom_left", offset = [12, -12], aspect_ratio = 0.8, max_fraction = [0.32, 0.18], motion = { kind = "float", period_s = 16, amplitude = 1.5 }, min_window = [160, 260] }, { image = "gothic/tracery.png", size = [46, 57.5], anchor = "bottom_right", offset = [-16, -14], aspect_ratio = 0.8, max_fraction = [0.32, 0.15], min_window = [260, 280] }] }

[[dialogue.responsive.rules]]
max_height = 240
portrait = true
layout = { padding = [12, 12, 12, 12], decor = [], shader_effects = [{ shader = "responsive_artwork", target = "artwork" }], nameplate = { visible = false, anchor = "top_right" } }

[[dialogue.responsive.rules]]
max_width = 200
max_height = 140
layout = { padding = [10, 12, 10, 12], nameplate = { visible = false }, portrait = { visible = false }, decor = [], shader_effects = [{ shader = "responsive_compact", target = "artwork" }], box = { color = "#18131C", border_color = "#C7AB76", width_fraction = 1, border_width = 1, radius = 18 } }
