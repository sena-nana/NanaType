# Design reference: https://github.com/sheep-realms/Echo-Live (Sheep-realms and contributors).
# CC0-1.0 below covers NanaType's own contributions to this local skin implementation.
[meta]
id = "nanatype.echo_vanilla"
version = "2.1.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming", "minimal"]
name = { zh-CN = "Echo-Live 原版", en-US = "Echo-Live Vanilla", ja-JP = "Echo-Live オリジナル" }
description = { zh-CN = "还原 Echo-Live 的原版主题：白底、顶部灰线、右上角三角、名字左凸，底部灰色菜单栏", en-US = "Echo-Live's vanilla theme: white bar, grey top rule, corner notch, a hanging name and the grey menu row", ja-JP = "Echo-Live のオリジナルテーマを再現：白地に灰色の上線、右上の三角、はみ出す名前、下段の灰色メニュー" }
schema = 2

[chrome]
accent = "#606266"
surface = "#ffffff"
text = "#000000"

[fonts.body]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

[fonts.name]
families = ["Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC"]
weight = 400

# Echo-Live draws on a 1920-wide page; every length here is two thirds of it.
# Its columns are 2 : 7 : 3, so the text sits left of centre.
[dialogue]
region = [1280, 180]
padding = [226, 52, 333, 44]
shader_effects = []

[dialogue.box]
color = "#ffffff"
border_color = "#cccccc"
border_width = 0
border_widths = [1.5, 0, 0, 0]
radius = 0

# The grey notch in the top-right corner.
frame = { image = "echo_vanilla/still.png", slice = [10, 24, 10, 100], layout_inset = false }

[[dialogue.decor]]
anchor = "top_right"
size = [13, 13]
polygon = [[0, 0], [100, 0], [100, 100]]
color = "#cccccc"

# The menu row: SAVE LOAD Q.SAVE Q.LOAD ⭰ ⯬ 🡄 🡆 ⯮ ⭲ HISTORY ╳.
[[dialogue.decor]]
anchor = "bottom_left"
offset = [222, -8]
size = [46, 22]
text = "SAVE"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [281, -8]
size = [48, 22]
text = "LOAD"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [342, -8]
size = [62, 22]
text = "Q.SAVE"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [417, -8]
size = [64, 22]
text = "Q.LOAD"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [494, -8]
size = [52, 22]
text = "« ‹ › »"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [559, -8]
size = [78, 22]
text = "HISTORY"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [650, -8]
size = [18, 22]
text = "✕"
when = "display"
text_color = "#888888"
text_size = 18
font = "body"

[dialogue.text]
color = "#000000"
size = 27

# The name has its own line and hangs 1em left of the text.
[dialogue.nameplate]
color = "#00000000"
text_color = "#000000"
size = 27
radius = 0
padding = [0, 0]
offset = [200, 14]

[dialogue.continue]
glyph = ""
motion = "none"

# 30 ms a character; CJK skips a tick.
[dialogue.reveal]
base_ms = 30
cjk_factor = 2.0
punct = { comma_ms = 0, stop_ms = 0, ellipsis_ms = 0 }

[dialogue.reveal.entrance]
kind = "none"
ms = 0

# Echo-Live's history page at half size (its base font is 36px): one row
# per line with name, message and HH:MM:SS side by side, no bubbles.
[history]
width = 640
height = 480
layout = "inline"
name_width = 120
name_size = 18
time_size = 16
time_seconds = true
gap = 9
entrance = "none"
# Like Echo-Live, the line still on the dialogue box joins once it clears.
hide_latest = true
bubble_color = "#00000000"
bubble_border_width = 0
bubble_radius = 0
bubble_padding = [0, 0]
avatar = { shape = "none" }
name_weight = 500
name_color = "#000000"
time_color = "#888888"
panel = { color = "#edeef0", padding = [18, 18, 18, 18] }
title = { text = "HISTORY", color = "#606266", size = 21, weight = 600, background = "#ffffff", height = 42, padding = 18 }

# The notch in the title bar's top-right corner.
[[history.decor]]
anchor = "top_right"
size = [11, 11]
polygon = [[0, 0], [100, 0], [100, 100]]
color = "#00000026"

# The shade the title bar casts on the list.
[[history.decor]]
anchor = "top_left"
offset = [0, 42]
size = ["100%", 12]
gradient = { stops = [[0, "#0000001a"], [1, "#00000000"]] }

[history.text]
color = "#000000"
size = 18
line_height = 1.4

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0
