size = 34.0

[dialogue.text.shadow]
blur = 2.0
color = "#000000a0"
dx = 0.0
dy = 2.0

[dialogue.text.stroke]
color = "#000000"
width = 5.0

[fonts.body]
weight = 800

[fonts.name]
weight = 800

[history]
bubble_border_width = 1.0
bubble_padding = [2.0, 0.0]
