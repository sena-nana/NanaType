name_color = "#ffe1a3"
time_color = "#c8c8d0"

[history.avatar]
shape = "none"

[history.name_stroke]
color = "#000000"
width = 2.5

[history.text]
color = "#ffffff"

[history.text.stroke]
color = "#000000"
width = 3.0
