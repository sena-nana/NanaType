[package]
name = "nanatype-blive"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NanaType live chat: blivechat, LAPLACE Event Bridge and 彗星号 clients"

[dependencies]
nanatype-model = { workspace = true, features = ["ws"] }
serde_json.workspace = true
# `wss://` LAPLACE bridges; rustls and its roots already come with ureq.
tungstenite = { workspace = true, features = ["handshake", "rustls-tls-webpki-roots"] }
url.workspace = true
# The one crypto provider, as ureq picks it, so the crate works on its own.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
crossbeam-channel.workspace = true
ring.workspace = true
