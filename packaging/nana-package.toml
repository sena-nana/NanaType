# nana-packager configuration. Packages an already built executable into the
# NanaUI platform layout; see NanaUI docs/reference/packaging.md.
schema_version = 1

[application]            # must match the identity marker in the binary
id = "dev.sena-nana.nanatype"
name = "NanaType"
version = "0.1.0"
vendor = "sena-nana"

[executable]
file_name = "NanaType"

[distribution]
backend = "installer"

[platform.windows]
# NanaUI loads the DX12 shader compiler only from beside the executable;
# scripts/package.ps1 stages it here.
root_exceptions = [
    { source = "../target/dxc/dxcompiler.dll", reason = "DX12 shader compiler: NanaUI loads it from the executable directory (startup about 2x faster than FXC)" },
    { source = "../target/licenses/THIRD_PARTY_LICENSES.txt", reason = "Complete redistribution licences in a readable text file beside the application" },
]

[platform.macos]
minimum_system_version = "13.0"
info_plist_extra = "Info.extra.plist"

[runtime]
# Windows ships the same file beside the executable (root_exceptions above);
# scripts/package-macos.sh stages it.
resources = [{ source = "../target/licenses/THIRD_PARTY_LICENSES.txt", platforms = ["macos"] }]
