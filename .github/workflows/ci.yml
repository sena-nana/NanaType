name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy, llvm-tools
      - name: libvpx source build tools (Intel Mac)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test --workspace
      # After the build, so every crate is in the local cache (the script
      # runs cargo metadata --offline). Fails when a linked crate has no
      # licence expression or THIRD_PARTY_NOTICES.md is out of date.
      - name: Third-party notices
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/third-party-notices.ps1 -Check
