name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Valve's test app: the Steam edition's real ids stay out of the repository
  # (docs/steam.md); release workflows take them from secrets.
  NANATYPE_STEAM_APP_ID: "480"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy, llvm-tools
      - name: libvpx source build tools (Intel Mac)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      # Each product alone, as its release builds it: a workspace build
      # unifies features and could hide one a product forgot to enable.
      - name: Clippy (each product)
        run: |
          cargo clippy -p nanatype --all-targets --no-deps -- -D warnings
          cargo clippy -p nanatype --no-default-features --features builtin-fonts,steam --all-targets --no-deps -- -D warnings
          cargo clippy -p nanatype-editor --all-targets --no-deps -- -D warnings
      - name: Product split
        shell: bash
        run: sh scripts/check-product-split.sh
      - name: Test
        run: cargo test --workspace
      # The Steam edition's own paths (no unofficial chat, no updater, Workshop
      # folders); cargo puts the Steamworks library where the tests find it.
      - name: Test (Steam edition)
        run: cargo test -p nanatype --no-default-features --features builtin-fonts,steam --lib
      # After the build, so every crate is in the local cache (the script
      # runs cargo metadata --offline). Fails when a linked crate has no
      # licence expression or THIRD_PARTY_NOTICES.md is out of date.
      - name: Third-party notices
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/third-party-notices.ps1 -Check
          ./scripts/third-party-notices.ps1 -Check -Package nanatype-editor -Texts target/licenses-editor
          ./scripts/third-party-notices.ps1 -Steam -Texts target/licenses-steam
          if (Select-String -Path target/licenses-steam/* -Pattern 'Bilibili-API-collect|DouyinLive' -List) {
              throw "The Steam edition's notices still name the unofficial chat sources"
          }
