<svg xmlns="http://www.w3.org/2000/svg" width="760" height="188" viewBox="0 0 760 188">
  <!-- RPG 窗口 rpg · 设计稿：经典 JRPG 搪瓷窗，外暗边 / 白主边 / 浅蓝内边三层倒角；名牌是同材质独立小窗，像素字 -->
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3FB8"/>
      <stop offset="1" stop-color="#14257E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#050A33" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#lift)">
