<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200">
  <!-- 十四行诗 sonnet · 设计稿：透明无框，霞鹜文楷诗句带暖金光晕；说话人 = 霞鹜文楷 + Tangerine 花体拉丁；继续提示是暖金四芒星；几粒金色光尘。去掉框线与光环蓝。皮肤本身透明，底下的暗色画面只是示意背景，不属于皮肤。region 由 190 加高到 200，容纳引用 + 两行 1.55 行高正文 -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1A2B"/>
      <stop offset="0.55" stop-color="#2C2333"/>
      <stop offset="1" stop-color="#3A2A2A"/>
    </linearGradient>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- 暗色压边（可读性）+ 暖金光晕 + 原字 -->
    <filter id="glow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="a"/>
      <feOffset in="a" dy="1" result="ao"/>
      <feFlood flood-color="#17121D" flood-opacity="0.7"/>
      <feComposite in2="ao" operator="in" result="dark"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#FFD593" flood-opacity="0.38"/>
      <feComposite in2="b" operator="in" result="gold"/>
      <feMerge><feMergeNode in="gold"/><feMergeNode in="dark"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mote" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="star" d="M0 -10 Q1.3 -1.3 10 0 Q1.3 1.3 0 10 Q-1.3 1.3 -10 0 Q-1.3 -1.3 0 -10 Z"/>
  </defs>
  <!-- 示意背景 -->
  <rect width="960" height="200" fill="url(#night)"/>
  <g filter="url(#bokeh)" opacity="0.5">
    <circle cx="820" cy="60" r="34" fill="#6A4E6E"/>
    <circle cx="700" cy="150" r="26" fill="#5B4258"/>
    <circle cx="140" cy="180" r="40" fill="#3B3150"/>
  </g>
  <!-- 光尘 -->
  <g fill="#F2D29A" filter="url(#mote)">
    <circle cx="742" cy="54" r="1.4" opacity="0.9"/>
    <circle cx="812" cy="96" r="1.1" opacity="0.7"/>
    <circle cx="868" cy="40" r="1.6" opacity="0.85"/>
    <circle cx="902" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="664" cy="118" r="1" opacity="0.55"/>
    <circle cx="560" cy="34" r="1.1" opacity="0.6"/>
    <use href="#star" transform="translate(790 72) scale(0.5)" opacity="0.85"/>
    <use href="#star" transform="translate(884 156) scale(0.38)" opacity="0.7"/>
  </g>
  <g font-family="LXGW WenKai" filter="url(#glow)">
    <!-- 说话人：文楷 + Tangerine 花体 -->
    <text x="36" y="35" font-size="25" fill="#E5BF83">奈奈</text>
    <text x="92" y="35" font-family="Tangerine" font-weight="700" font-size="34" fill="#E5BF83" opacity="0.8">Nana</text>
    <!-- 回复引用 -->
    <rect x="36" y="48" width="2" height="18" fill="#CDB89A" opacity="0.6"/>
    <text x="45" y="63" font-size="16" fill="#CDB89A">星野ほたる：主播晚上好！今天打什么字呀</text>
    <!-- 提及：暖金浅底 -->
    <rect x="36" y="81" width="176" height="34" rx="17" fill="#E5BF83" fill-opacity="0.13"/>
    <circle cx="53" cy="98" r="11" fill="#9C7E5A"/>
    <text x="72" y="107" font-size="26" fill="#FFE9C2">星野ほたる</text>
    <text x="222" y="110" font-size="32" fill="#FFF8EA">晚上好！今天也谢谢你来～</text>
    <text x="36" y="160" font-size="32" fill="#FFF8EA">我们接着上次的故事讲吧。</text>
  </g>
  <!-- 继续提示：暖金四芒星 -->
  <use href="#star" transform="translate(440 148) scale(0.8)" fill="#F2D29A" filter="url(#mote)"/>
</svg>
