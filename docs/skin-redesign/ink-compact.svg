<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 水墨 ink · 紧凑态（300 宽窄窗）：去墨竹，左侧不画，底边留一短笔干笔；朱印 + 朱色姓名 #B0302A -->
  <defs>
    <filter id="xuan" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.07 0.1" numOctaves="1" seed="21" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.48  -9 0 0 0 0.16" result="fiber"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="9" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 -0.9 0.5" result="grain"/>
      <feMerge result="tex"><feMergeNode in="fiber"/><feMergeNode in="grain"/></feMerge>
      <feComposite in="tex" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="6" result="d"/>
      <feDisplacementMap in="SourceGraphic" in2="d" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="seal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="31" result="d"/>
      <feDisplacementMap in="SourceGraphic" in2="d" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="296" height="116" rx="2" fill="#FBFAF6"/>
  <rect x="2" y="2" width="296" height="116" rx="2" fill="#000" filter="url(#xuan)"/>
  <path d="M22 110 C 26 108 34 108 46 109 C 80 109.5 110 110 140 111 C 132 113 112 114 90 114 C 66 114.5 46 114.5 34 114.5 C 28 114.5 24 113 22 110 Z" fill="#1E1E1E" opacity="0.85" filter="url(#rough)"/>
  <g filter="url(#seal)"><rect x="24" y="14" width="18" height="18" rx="1" fill="#B0302A"/></g>
  <g font-family="LXGW WenKai">
    <text x="33" y="27.5" font-size="13" fill="#FBFAF6" text-anchor="middle">奈</text>
    <text x="48" y="29" font-size="15" fill="#B0302A" letter-spacing="1.5">奈奈</text>
    <text x="24" y="66" font-size="21" fill="#1E1E1E">晚上好！今天也谢谢</text>
    <text x="24" y="98" font-size="21" fill="#1E1E1E">你来～我们接着讲吧。</text>
  </g>
</svg>
