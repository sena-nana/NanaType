<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 樱花 sakura · 紧凑态（300 宽窄窗）：去花枝与落瓣；保留毛玻璃 + 粉雾；小樱花 + #C2416F 字 -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFF7FA" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFF0F5" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="mist" cx="0.1" cy="1" r="0.7">
      <stop offset="0" stop-color="#F7B8CE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F7B8CE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="294" height="114" rx="14" fill="url(#glass)"/>
  <rect x="3" y="3" width="294" height="114" rx="14" fill="url(#mist)"/>
  <rect x="3.75" y="3.75" width="292.5" height="112.5" rx="13.25" fill="none" stroke="url(#sheen)" stroke-width="1.5"/>
  <rect x="3.25" y="3.25" width="293.5" height="113.5" rx="13.75" fill="none" stroke="#E7A3BC" stroke-width="1" opacity="0.45"/>
  <g transform="translate(25 25) scale(0.8)" fill="#C2416F">
    <ellipse cx="0" cy="-4.2" rx="3" ry="4"/>
    <ellipse cx="0" cy="-4.2" rx="3" ry="4" transform="rotate(72)"/>
    <ellipse cx="0" cy="-4.2" rx="3" ry="4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-4.2" rx="3" ry="4" transform="rotate(216)"/>
    <ellipse cx="0" cy="-4.2" rx="3" ry="4" transform="rotate(288)"/>
    <circle r="1.8" fill="#FFF0F5"/>
  </g>
  <g font-family="LXGW WenKai">
    <text x="35" y="30" font-size="14" fill="#C2416F">奈奈</text>
    <text x="18" y="66" font-size="20" fill="#6B2141">晚上好！今天也谢谢</text>
    <text x="18" y="96" font-size="20" fill="#6B2141">你来～我们接着讲吧。</text>
  </g>
</svg>
