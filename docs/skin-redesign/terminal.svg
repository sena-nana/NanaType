<svg xmlns="http://www.w3.org/2000/svg" width="760" height="184" viewBox="0 0 760 184">
  <!-- 终端 terminal · 设计稿：琥珀 P3 荧光屏；标题栏写真实提示符路径，姓名是 shell 提示，扫描线只作极弱静态材质 -->
  <defs>
    <radialGradient id="screen" cx="0.5" cy="0.55" r="0.75" gradientTransform="translate(0.5 0.55) scale(0.6 1) translate(-0.5 -0.55)">
      <stop offset="0" stop-color="#17110A"/>
      <stop offset="1" stop-color="#0D0A05"/>
    </radialGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000"/>
    </pattern>
    <filter id="phosphor" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feComponentTransfer in="b" result="bd"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="bd"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win"><rect x="8" y="8" width="744" height="168" rx="6"/></clipPath>
  </defs>
  <rect x="8" y="8" width="744" height="168" rx="6" fill="#0D0A05" filter="url(#lift)"/>
  <g clip-path="url(#win)">
    <rect x="8" y="32" width="744" height="144" fill="url(#screen)"/>
    <!-- 标题栏 -->
    <rect x="8" y="8" width="744" height="24" fill="#1A1308"/>
    <rect x="8" y="31.5" width="744" height="1" fill="#FFB000" opacity="0.22"/>
  </g>
  <rect x="8.75" y="8.75" width="742.5" height="166.5" rx="5.25" fill="none" stroke="#FFB000" stroke-opacity="0.32" stroke-width="1.5"/>
  <!-- 三个状态方块 -->
  <rect x="20" y="16" width="8" height="8" fill="#FFB000"/>
  <rect x="33.75" y="16.75" width="6.5" height="6.5" fill="none" stroke="#FFB000" stroke-width="1.5" opacity="0.7"/>
  <rect x="46" y="16" width="8" height="8" fill="#A88536" opacity="0.45"/>
  <g font-family="Maple Mono NF CN">
    <text x="380" y="24.5" font-size="12" fill="#A88536" text-anchor="middle">~/stream — nana --say</text>
    <text x="740" y="24.5" font-size="12" fill="#A88536" opacity="0.7" text-anchor="end">utf-8</text>
    <g filter="url(#phosphor)">
      <text x="32" y="59" font-size="16" fill="#FFB000"><tspan font-weight="700">奈奈</tspan>@live:~$</text>
      <rect x="32" y="69" width="2" height="16" fill="#A88536" opacity="0.7"/>
      <text x="42" y="82" font-size="13" fill="#A88536"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
      <rect x="32" y="95" width="157" height="28" fill="#FFB000" fill-opacity="0.14"/>
      <rect x="39" y="102" width="14" height="14" fill="#FFB000"/>
      <text x="59" y="116" font-size="20" fill="#FFD27A">星野ほたる</text>
      <text x="200" y="118" font-size="24" fill="#FFC547">晚上好！今天也谢谢你来～</text>
      <text x="32" y="154" font-size="24" fill="#FFC547">我们接着上次的故事讲吧。</text>
      <!-- 等待：空心方块 -->
      <rect x="716.75" y="137.75" width="10.5" height="16.5" fill="none" stroke="#FFB000" stroke-width="1.5"/>
    </g>
  </g>
  <!-- 极弱静态扫描线 -->
  <rect x="8" y="32" width="744" height="144" fill="url(#scan)" opacity="0.16" clip-path="url(#win)"/>
</svg>
