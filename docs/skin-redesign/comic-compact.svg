<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 漫画 comic · 紧凑态（300 宽窄窗）：去尾巴、网点与速度线，保留粗细墨线、硬投影和黄色说明框（不倾斜） -->
  <defs>
    <path id="panel" d="M12 8 Q150 5 284 8 Q290 8 290 14 Q291 60 289 102 Q289 108 283 108 Q150 110 12 108 Q6 108 6 102 Q5 60 6 14 Q6 8 12 8 Z"/>
  </defs>
  <use href="#panel" transform="translate(5 5)" fill="#111111"/>
