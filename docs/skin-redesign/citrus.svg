<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230">
  <!-- 柠檬汽水 citrus · 设计稿：斜切包装标签。奶油标签右边斜切，露出薄荷网点底；柠檬片从右上角出血；名牌是倾斜 -4° 的大号模切贴纸 -->
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="4.5" cy="4.5" r="1.9" fill="#4FA48A"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <mask id="dotmask"><rect width="920" height="230" fill="url(#fade)"/></mask>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9E4"/>
      <stop offset="1" stop-color="#FFF6D6"/>
    </linearGradient>
    <clipPath id="boxclip"><rect x="6" y="14" width="908" height="210" rx="14"/></clipPath>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2F6E5C" flood-opacity="0.25"/>
    </filter>
    <filter id="label" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#2F6E5C" flood-opacity="0.3"/>
    </filter>
    <filter id="sticker" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#4A3720" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 薄荷网点底 -->
  <rect x="6" y="14" width="908" height="210" rx="14" fill="#7CC4AE" filter="url(#lift)"/>
  <rect x="6" y="14" width="908" height="210" rx="14" fill="url(#dots)" mask="url(#dotmask)" clip-path="url(#boxclip)"/>

  <!-- 奶油标签：右边斜切 -->
  <path d="M30 28 H772 L694 212 H30 Q22 212 22 204 V36 Q22 28 30 28 Z" fill="url(#paper)" filter="url(#label)"/>
  <path d="M34 34 H762 L689.5 206 H34 Q28 206 28 200 V40 Q28 34 34 34 Z" fill="none" stroke="#7CC4AE" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- 斜切口一条印刷黄色带 -->
  <path d="M772 28 L784 28 L706 212 L694 212 Z" fill="#FFC93C"/>

  <!-- 上升气泡（动效物件） -->
  <g fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.85">
    <circle cx="806" cy="198" r="7"/>
    <circle cx="836" cy="176" r="4.5"/>
    <circle cx="864" cy="196" r="3"/>
  </g>

  <!-- 柠檬片：右上角出血，叶片朝左下探入 -->
  <g clip-path="url(#boxclip)">
    <g transform="translate(882 34) rotate(200) scale(1.2) translate(-128 -181)" filter="url(#sticker)">
      <image href="ornament/citrus.png" x="0" y="0" width="256" height="320"/>
    </g>
  </g>

  <g font-family="PingFang SC">
    <!-- 名牌：模切贴纸，奶油白描边 + 投影，-4° -->
    <g transform="rotate(-4 98 28)" filter="url(#sticker)">
      <rect x="52" y="8" width="92" height="40" rx="12" fill="#FFC93C" stroke="#FFFDF2" stroke-width="4"/>
      <text x="98" y="35.5" font-size="20" font-weight="800" fill="#5A3B12" text-anchor="middle" letter-spacing="1">奈奈</text>
    </g>
    <!-- 回复引用 -->
    <rect x="56" y="74" width="2" height="18" rx="1" fill="#7A6243" opacity="0.7"/>
    <text x="66" y="88" font-size="14" fill="#7A6243"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
    <!-- 提及 + 正文 -->
    <rect x="56" y="113" width="150" height="31" rx="15.5" fill="#7CC4AE" fill-opacity="0.2"/>
    <circle cx="72" cy="128.5" r="10.5" fill="#F4A340"/>
    <text x="88" y="136" font-size="21" font-weight="700" fill="#2F6E5C">星野ほたる</text>
    <text x="216" y="138" font-size="26" font-weight="500" fill="#4A3720">晚上好！今天也谢谢你来～</text>
    <text x="56" y="182" font-size="26" font-weight="500" fill="#4A3720">我们接着上次的故事讲吧。</text>
  </g>
</svg>
