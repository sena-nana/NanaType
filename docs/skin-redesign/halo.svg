<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200">
  <!-- 光环 halo · 保持现有风格：蓝白圆润卡片、轻阴影、压在上沿的天蓝渐变胶囊名牌。只做共性修正：浅底提及、两行正文的框高 -->
  <defs>
    <linearGradient id="face" x1="0.33" y1="0" x2="0.67" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#EEF6FD" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087FD1"/>
      <stop offset="1" stop-color="#249FDF"/>
    </linearGradient>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#2388C9" flood-opacity="0.13"/>
    </filter>
    <filter id="plateShadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0876D0" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="14" y="22" width="732" height="164" rx="30" fill="url(#face)" filter="url(#lift)"/>
  <rect x="14.5" y="22.5" width="731" height="163" rx="29.5" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <g font-family="PingFang SC, Hiragino Sans GB">
    <rect x="38" y="7" width="68" height="30" rx="15" fill="url(#plate)" stroke="#D7EFFF" stroke-width="0.8" filter="url(#plateShadow)"/>
    <text x="72" y="28" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">奈奈</text>
    <rect x="42" y="51" width="2" height="17" rx="1" fill="#0876D0" opacity="0.45"/>
    <text x="52" y="64" font-size="14" fill="#5A6B85"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
    <rect x="42" y="84" width="155" height="30" rx="15" fill="#0876D0" fill-opacity="0.12"/>
    <circle cx="57" cy="99" r="10" fill="#8CC8F2"/>
    <text x="72" y="107" font-size="23" fill="#0B5FA8" font-weight="600">星野ほたる</text>
    <text x="205" y="109" font-size="28" fill="#1B2F4B">晚上好！今天也谢谢你来～</text>
    <text x="42" y="150" font-size="28" fill="#1B2F4B">我们接着上次的故事讲吧。</text>
    <path d="M714 164 l10 0 l-5 7 z" fill="#0876D0"/>
  </g>
</svg>
