    </filter>
    <clipPath id="box"><rect x="10" y="10" width="840" height="180" rx="6"/></clipPath>
  </defs>
  <rect x="10" y="10" width="840" height="180" rx="6" fill="#191C22" filter="url(#lift)"/>
