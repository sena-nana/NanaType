<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180">
  <!-- 字幕 subtitle · 设计稿：广播字幕规范——白字居中、3px 黑描边 + 柔投影；说话人 #FFD27F 写在引用上方，无底板；提及只换色不加胶囊。皮肤本身透明，底下的暗色游戏画面只是示意背景，不属于皮肤。region 由 156 加高到 180，容纳名字行 + 引用 + 两行正文 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27304A"/>
      <stop offset="0.6" stop-color="#3D3448"/>
      <stop offset="1" stop-color="#4A3A36"/>
    </linearGradient>
    <filter id="haze" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-5%" y="-30%" width="110%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- 示意背景：模糊的游戏画面 -->
  <g>
    <rect width="960" height="180" fill="url(#sky)"/>
    <g filter="url(#haze)">
      <ellipse cx="760" cy="40" rx="90" ry="40" fill="#E9A15F" opacity="0.45"/>
      <path d="M-20 130 Q160 80 330 120 T640 110 T980 120 V200 H-20 Z" fill="#1E2531"/>
      <path d="M-20 160 Q240 130 520 150 T980 150 V200 H-20 Z" fill="#141820"/>
      <rect x="120" y="60" width="40" height="90" fill="#121620" opacity="0.8"/>
      <ellipse cx="300" cy="70" rx="60" ry="22" fill="#6E7FA8" opacity="0.35"/>
    </g>
  </g>
  <!-- 字幕 -->
  <g font-family="PingFang SC, Hiragino Sans GB" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#000000" stroke-linejoin="round" filter="url(#soft)">
    <text x="480" y="30" font-size="22" fill="#FFD27F" stroke-width="5">奈奈</text>
    <rect x="287" y="44" width="4" height="22" fill="#000000" stroke="none"/>
    <rect x="288" y="45" width="2" height="20" fill="#E6E6E6" stroke="none"/>
    <text x="481" y="61" font-size="19" fill="#E6E6E6" stroke-width="4"><tspan font-weight="700">星野ほたる：</tspan><tspan font-weight="500">主播晚上好！今天打什么字呀</tspan></text>
    <text x="184" y="105" font-size="30" fill="#FFD27F" stroke-width="6" text-anchor="start">星野ほたる</text>
    <text x="344" y="105" font-size="36" fill="#FFFFFF" stroke-width="6" text-anchor="start">晚上好！今天也谢谢你来～</text>
    <text x="480" y="153" font-size="36" fill="#FFFFFF" stroke-width="6">我们接着上次的故事讲吧。</text>
    <path d="M708 136 L722 136 L715 146 Z" fill="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
