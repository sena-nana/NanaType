<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 森林精灵 forest · 紧凑态（300 宽窄窗）：去蕨叶与标本签；保留衬卡 + 标本纸 + 纸胶带名牌，名字 #2E4A36 -->
  <defs>
    <filter id="mount" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="5" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 -1.2 0.66"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="sheetLift" x="-3%" y="-10%" width="106%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#22382B" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="2" y="8" width="296" height="110" rx="3" fill="#C9D3B6"/>
  <rect x="2" y="8" width="296" height="110" rx="3" fill="#000" filter="url(#mount)"/>
  <rect x="9" y="16" width="282" height="95" rx="1" fill="#EEF0E2" filter="url(#sheetLift)"/>
  <g transform="rotate(-3 40 16)">
    <path d="M12 4 L 66 4 L 68.5 6.5 L 66 9 L 68.5 11.5 L 66 14 L 68.5 16.5 L 66 19 L 68.5 21.5 L 66 24 L 68.5 26.5 L 66 29 L 12 29 L 9.5 26.5 L 12 24 L 9.5 21.5 L 12 19 L 9.5 16.5 L 12 14 L 9.5 11.5 L 12 9 L 9.5 6.5 Z" fill="#B8CDA4" fill-opacity="0.85"/>
    <text x="22" y="22" font-family="Songti SC" font-size="15" font-weight="900" fill="#2E4A36">奈奈</text>
  </g>
  <g font-family="PingFang SC" fill="#22382B">
    <text x="22" y="66" font-size="19">晚上好！今天也谢谢</text>
    <text x="22" y="95" font-size="19">你来～我们接着讲吧。</text>
  </g>
</svg>
