<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200">
  <!-- Echo 原版 echo_vanilla · 还原稿：构图、字号与菜单栏照 Echo-Live 原作不改；只修共性——提及改浅底 #0000000F + 原文字色、头像占位用原作灰、继续提示去光环蓝。region 由 180 加高到 200，容纳第二行正文，菜单栏仍贴底 -8 -->
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CCCCCC" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#CCCCCC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#CCCCCC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="200" fill="#FFFFFF"/>
  <rect width="1280" height="1.5" fill="#CCCCCC"/>
  <rect x="18" y="4" width="78" height="1" fill="url(#hair)"/>
  <path d="M1267 0 H1280 V13 Z" fill="#CCCCCC"/>
  <g font-family="PingFang SC, Hiragino Sans GB" fill="#202124">
    <text x="200" y="40" font-size="27">奈奈</text>
    <rect x="226" y="54" width="2" height="18" fill="#C0C4CC"/>
    <text x="235" y="68" font-size="14" fill="#606266"><tspan font-weight="600">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
    <rect x="226" y="83" width="148" height="30" rx="15" fill="#000000" fill-opacity="0.06"/>
    <circle cx="241" cy="98" r="10" fill="#C0C4CC"/>
    <text x="256" y="106" font-size="22">星野ほたる</text>
    <text x="382" y="108" font-size="27">晚上好！今天也谢谢你来～</text>
    <text x="226" y="146" font-size="27">我们接着上次的故事讲吧。</text>
    <path d="M560 136 H572 L566 143 Z" fill="#606266"/>
    <g font-size="18" fill="#888888">
      <text x="222" y="187">SAVE</text>
      <text x="281" y="187">LOAD</text>
      <text x="342" y="187">Q.SAVE</text>
      <text x="417" y="187">Q.LOAD</text>
      <text x="494" y="187">« ‹ › »</text>
      <text x="559" y="187">HISTORY</text>
      <text x="650" y="187">✕</text>
    </g>
  </g>
</svg>
