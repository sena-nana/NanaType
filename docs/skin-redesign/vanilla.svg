<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200">
  <!-- 香草 vanilla · 设计稿：瑞士编辑版式；暖白直角纸面 + 6px 香草荚深棕竖线，栏目头式名牌，右下对位十字 -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#FBF8F1"/>
    </linearGradient>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#24201B" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="740" height="180" rx="2" fill="url(#face)" filter="url(#lift)"/>
  <rect x="10.5" y="10.5" width="739" height="179" rx="1.5" fill="none" stroke="#24201B" stroke-opacity="0.10" stroke-width="1"/>
  <rect x="10" y="10" width="6" height="180" fill="#3B2A20"/>
  <g font-family="PingFang SC, Hiragino Sans GB">
    <text x="56" y="46" font-size="17" font-weight="700" letter-spacing="2" fill="#8A6A3A">奈奈</text>
    <rect x="104" y="39" width="24" height="2" fill="#8A6A3A"/>
    <rect x="56" y="62" width="2" height="18" fill="#6E655A" opacity="0.6"/>
    <text x="66" y="76" font-size="14" fill="#6E655A"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
    <rect x="56" y="96" width="148" height="30" rx="2" fill="#EFE6D2"/>
    <circle cx="71" cy="111" r="9.5" fill="#C9A86A"/>
    <text x="87" y="119" font-size="22" font-weight="500" fill="#5B4128">星野ほたる</text>
    <text x="214" y="121" font-size="27" fill="#24201B">晚上好！今天也谢谢你来～</text>
    <text x="56" y="160" font-size="27" fill="#24201B">我们接着上次的故事讲吧。</text>
  </g>
  <!-- 对位十字：兼作继续提示 -->
  <g stroke="#3B2A20" stroke-width="1.5" fill="none">
    <circle cx="706" cy="152" r="6"/>
    <path d="M694 152 h24 M706 140 v24"/>
  </g>
</svg>
