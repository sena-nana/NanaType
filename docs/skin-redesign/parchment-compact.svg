<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 羊皮纸 parchment · 紧凑态（300 宽窄窗）：去藤蔓角饰，单压线；皮签保留，#5C341C 底 #FFF1D6 字 -->
  <defs>
    <radialGradient id="vellum" cx="0.45" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#F8EBD1"/>
      <stop offset="0.65" stop-color="#F4E3C3"/>
      <stop offset="1" stop-color="#E9D1A4"/>
    </radialGradient>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.36  0 0 0 0 0.16  1.4 0 0 0 -0.6" result="blot"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.15  0 0 0 -1.1 0.62" result="grain"/>
      <feMerge result="tex"><feMergeNode in="blot"/><feMergeNode in="grain"/></feMerge>
      <feComposite in="tex" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="294" height="114" rx="4" fill="url(#vellum)"/>
  <rect x="3" y="3" width="294" height="114" rx="4" fill="#000" filter="url(#mottle)"/>
  <rect x="3.75" y="3.75" width="292.5" height="112.5" rx="3.5" fill="none" stroke="#B48A55" stroke-width="1.5" opacity="0.6"/>
  <rect x="10" y="10" width="280" height="100" rx="1.5" fill="none" stroke="#FFF6E2" stroke-width="1" opacity="0.7" transform="translate(0.8 0.8)"/>
  <rect x="10" y="10" width="280" height="100" rx="1.5" fill="none" stroke="#8A5A2B" stroke-width="1.5" opacity="0.7"/>
  <rect x="18" y="1" width="58" height="22" rx="2.5" fill="#5C341C"/>
  <rect x="21.5" y="4.5" width="51" height="15" rx="1" fill="none" stroke="#D9B26A" stroke-width="1" opacity="0.8"/>
  <g font-family="Songti SC">
    <text x="47" y="17" font-size="14" font-weight="900" fill="#FFF1D6" text-anchor="middle">奈奈</text>
    <text x="18" y="64" font-size="20" fill="#3A2617">晚上好！今天也谢谢</text>
    <text x="18" y="94" font-size="20" fill="#3A2617">你来～我们接着讲吧。</text>
  </g>
</svg>
