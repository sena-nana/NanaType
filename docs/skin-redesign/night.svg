<svg xmlns="http://www.w3.org/2000/svg" width="760" height="192" viewBox="0 0 760 192">
  <!-- 夜色 night · 设计稿：霓虹灯管招牌；茄紫黑背板上一根连续品红灯管（外辉 + 管体 + 亮芯），名牌是点亮的一段字，打断上沿灯管 -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1128"/>
      <stop offset="1" stop-color="#120B1C"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.12" cy="0" r="0.75" gradientTransform="scale(1 4)">
      <stop offset="0" stop-color="#FF4FB8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF4FB8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A5064"/>
      <stop offset="0.45" stop-color="#B9B0C4"/>
      <stop offset="1" stop-color="#4A4054"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5064"/>
      <stop offset="0.45" stop-color="#B9B0C4"/>
      <stop offset="1" stop-color="#4A4054"/>
    </linearGradient>
    <filter id="haze" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="bloom" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="bloomWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="litText" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#FF4FB8"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b2"/>
      <feFlood flood-color="#FF4FB8"/>
      <feComposite in2="b2" operator="in" result="g2"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="clipShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- 灯管：上沿在名牌处断开，两端是电极帽 -->
    <path id="tube" d="M100 24 H728 A16 16 0 0 1 744 40 V160 A16 16 0 0 1 728 176 H32 A16 16 0 0 1 16 160 V40 A16 16 0 0 1 32 24 H34"/>
  </defs>
  <!-- 背板 -->
  <rect x="4" y="8" width="752" height="180" rx="22" fill="url(#board)"/>
  <rect x="4" y="8" width="752" height="180" rx="22" fill="url(#spill)"/>
  <rect x="4.75" y="8.75" width="750.5" height="178.5" rx="21.25" fill="none" stroke="#3A2650" stroke-width="1.5"/>
  <!-- 灯管三层描边 -->
  <use href="#tube" fill="none" stroke="#FF4FB8" stroke-width="16" stroke-opacity="0.26" filter="url(#haze)"/>
  <use href="#tube" fill="none" stroke="#FF4FB8" stroke-width="7" stroke-opacity="0.65" filter="url(#bloom)"/>
  <use href="#tube" fill="none" stroke="#FF4FB8" stroke-width="3" stroke-linecap="round"/>
  <use href="#tube" fill="none" stroke="#FFE3F4" stroke-width="1" stroke-linecap="round"/>
  <!-- 电极帽 -->
  <rect x="30" y="20" width="6" height="8" rx="1.5" fill="#2A2034" stroke="#5A4A66" stroke-width="1"/>
  <rect x="98" y="20" width="6" height="8" rx="1.5" fill="#2A2034" stroke="#5A4A66" stroke-width="1"/>
  <!-- 金属卡扣 -->
  <g filter="url(#clipShadow)">
    <rect x="257" y="17" width="6" height="14" rx="1.5" fill="url(#metal)"/>
    <rect x="557" y="17" width="6" height="14" rx="1.5" fill="url(#metal)"/>
    <rect x="177" y="169" width="6" height="14" rx="1.5" fill="url(#metal)"/>
    <rect x="477" y="169" width="6" height="14" rx="1.5" fill="url(#metal)"/>
    <rect x="9" y="97" width="14" height="6" rx="1.5" fill="url(#metalV)"/>
    <rect x="737" y="97" width="14" height="6" rx="1.5" fill="url(#metalV)"/>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB">
    <!-- 名牌：点亮的一段字 -->
    <text x="46" y="32" font-size="22" font-weight="700" fill="#FFE3F4" stroke="#FF4FB8" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke" filter="url(#litText)">奈奈</text>
    <rect x="46" y="54" width="2" height="18" rx="1" fill="#9B6BFF" opacity="0.8"/>
    <text x="56" y="68" font-size="14" fill="#9B6BFF"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
    <rect x="46" y="84" width="148" height="30" rx="15" fill="#FF4FB8" fill-opacity="0.14"/>
    <circle cx="61" cy="99" r="9.5" fill="#9B6BFF"/>
    <text x="76" y="107" font-size="22" fill="#FFC2E6">星野ほたる</text>
    <text x="204" y="109" font-size="27" fill="#F3E9FF">晚上好！今天也谢谢你来～</text>
    <text x="46" y="148" font-size="27" fill="#F3E9FF">我们接着上次的故事讲吧。</text>
  </g>
  <!-- 继续提示：小段霓虹折线 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M702 140 l7 7 l7 -7" stroke="#FF4FB8" stroke-width="7" stroke-opacity="0.6" filter="url(#bloomWide)"/>
    <path d="M702 140 l7 7 l7 -7" stroke="#FF4FB8" stroke-width="3"/>
    <path d="M702 140 l7 7 l7 -7" stroke="#FFE3F4" stroke-width="1"/>
  </g>
</svg>
