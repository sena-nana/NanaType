<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- RPG 窗口 rpg · 紧凑态（300 宽窄窗）：保留三层倒角搪瓷窗；名牌收成 #10206E 深蓝底白字像素小牌，去水晶 -->
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3FB8"/>
      <stop offset="1" stop-color="#14257E"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="296" height="116" rx="8" fill="#050A33"/>
  <rect x="4" y="4" width="292" height="112" rx="6" fill="#FFFFFF"/>
  <rect x="8" y="8" width="284" height="104" rx="3" fill="#C6D0FF"/>
  <rect x="10" y="10" width="280" height="100" rx="2" fill="url(#enamel)"/>
  <rect x="10" y="10" width="280" height="2" fill="#10206E" opacity="0.55"/>
  <rect x="16" y="12" width="60" height="28" fill="#10206E"/>
  <text x="22" y="34" font-family="'Fusion Pixel 12px Prop zh-Hans'" font-size="24" fill="#FFFFFF">奈奈</text>
  <g font-family="PingFang SC, Hiragino Sans GB" font-size="20">
    <g fill="#10206E" transform="translate(2 2)">
      <text x="18" y="68">晚上好！今天也谢谢</text>
      <text x="18" y="97">你来～我们接着讲吧。</text>
    </g>
    <g fill="#FFFFFF">
      <text x="18" y="68">晚上好！今天也谢谢</text>
      <text x="18" y="97">你来～我们接着讲吧。</text>
    </g>
  </g>
</svg>
