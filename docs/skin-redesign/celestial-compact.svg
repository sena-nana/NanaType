<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 星月魔法 celestial · 紧凑态（300 宽窄窗）：星盘缩成右下角一段刻度弧作提示；名牌改金底靛字 -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1638"/>
      <stop offset="1" stop-color="#2A1E52"/>
    </linearGradient>
    <clipPath id="box"><rect x="4" y="4" width="292" height="112" rx="12"/></clipPath>
  </defs>
  <rect x="4" y="4" width="292" height="112" rx="12" fill="url(#face)"/>
  <g clip-path="url(#box)" fill="none" stroke="#C9A35A">
    <circle cx="296" cy="116" r="54" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="296" cy="116" r="46" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="1.5 4"/>
  </g>
  <rect x="4.75" y="4.75" width="290.5" height="110.5" rx="11.25" fill="none" stroke="#C9A35A" stroke-width="1.5" stroke-opacity="0.55"/>
  <g font-family="Songti SC">
    <rect x="18" y="16" width="50" height="22" rx="4" fill="#C9A35A"/>
    <text x="43" y="32" font-size="13" font-weight="700" fill="#1B1638" text-anchor="middle" letter-spacing="1">奈奈</text>
    <text x="18" y="68" font-size="20" fill="#F4EEFF">晚上好！今天也谢谢</text>
    <text x="18" y="98" font-size="20" fill="#F4EEFF">你来～我们接着讲吧。</text>
  </g>
</svg>
