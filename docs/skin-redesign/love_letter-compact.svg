<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- 情书 love_letter · 紧凑态（300 宽窄窗）：去火漆；保留罗纹与对齐基线的横格；From 奈奈 #7E1F35 -->
  <defs>
    <pattern id="laid" width="6" height="3" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#E9DCC8" opacity="0.35"/>
    </pattern>
    <pattern id="chain" x="20" width="46" height="120" patternUnits="userSpaceOnUse">
      <rect x="0" width="1.2" height="120" fill="#E9DCC8"/>
    </pattern>
    <clipPath id="sheet"><rect x="2" y="2" width="296" height="116" rx="2"/></clipPath>
  </defs>
  <rect x="2" y="2" width="296" height="116" rx="2" fill="#FFFCF5"/>
  <g clip-path="url(#sheet)">
    <rect x="2" y="2" width="296" height="116" fill="url(#laid)"/>
    <rect x="2" y="2" width="296" height="116" fill="url(#chain)" opacity="0.45"/>
  </g>
  <rect x="2.5" y="2.5" width="295" height="115" rx="1.5" fill="none" stroke="#E4C9C9" stroke-width="1"/>
  <g stroke="#E4C9C9" stroke-width="1.5">
    <line x1="10" y1="72" x2="290" y2="72"/>
    <line x1="10" y1="102" x2="290" y2="102"/>
  </g>
  <text x="18" y="34" font-family="Tangerine" font-size="28" fill="#7E1F35">From</text>
  <g font-family="LXGW WenKai">
    <text x="67" y="33" font-size="15" fill="#7E1F35">奈奈</text>
    <text x="18" y="69" font-size="20" fill="#4E2A33">晚上好！今天也谢谢</text>
    <text x="18" y="99" font-size="20" fill="#4E2A33">你来～我们接着讲吧。</text>
  </g>
</svg>
