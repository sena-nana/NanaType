  <circle cx="846" cy="166" r="34" fill="#E7CC94" opacity="0.1"/>
  <rect x="780" y="110" width="120" height="110" fill="url(#brass)" mask="url(#moon)"/>
  <circle cx="900" cy="218" r="5" fill="#E7CC94"/>

  <g font-family="Songti SC">
    <!-- 说话人：无底板，金字 + 四芒星 + 渐隐刻线 -->
    <path d="M47 40 Q47 48 50.6 48 Q47 48 47 56 Q47 48 43.4 48 Q47 48 47 40 Z" fill="#E7CC94" opacity="1"/>
    <text x="62" y="56" font-size="19" font-weight="700" fill="#E7CC94" letter-spacing="1.5">奈奈</text>
    <rect x="110" y="49" width="160" height="1.5" fill="url(#rule)"/>
    <!-- 回复引用 -->
    <rect x="40" y="80" width="2" height="17" rx="1" fill="#A99CC8" opacity="0.7"/>
    <text x="50" y="93" font-size="14" fill="#A99CC8"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>
    <!-- 提及 + 正文 -->
    <rect x="40" y="114" width="150" height="31" rx="15.5" fill="#C9A35A" fill-opacity="0.15"/>
    <circle cx="56" cy="129.5" r="10.5" fill="#8E7CC3"/>
    <text x="72" y="137" font-size="21" font-weight="700" fill="#E7CC94">星野ほたる</text>
    <text x="200" y="139" font-size="26" fill="#F4EEFF">晚上好！今天也谢谢你来～</text>
    <text x="40" y="180" font-size="26" fill="#F4EEFF">我们接着上次的故事讲吧。</text>
  </g>
