<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230">
  <!-- 星月魔法 celestial · 设计稿：星盘以框右下角为圆心出血；外圈刻度弧以 12% 透明度穿过正文背后；新月贴近圆心 -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1638"/>
      <stop offset="1" stop-color="#2A1E52"/>
    </linearGradient>
    <radialGradient id="disk" cx="900" cy="218" r="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2B6E"/>
      <stop offset="0.75" stop-color="#2A1E52"/>
      <stop offset="1" stop-color="#231A47"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DDA8"/>
      <stop offset="0.5" stop-color="#C9A35A"/>
      <stop offset="1" stop-color="#9C7638"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A35A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C9A35A" stop-opacity="0"/>
    </linearGradient>
    <mask id="moon">
      <rect x="780" y="110" width="120" height="110" fill="#000"/>
      <circle cx="846" cy="166" r="27" fill="#fff"/>
      <circle cx="860" cy="157" r="23" fill="#000"/>
    </mask>
    <clipPath id="boxclip"><rect x="6" y="16" width="894" height="202" rx="14"/></clipPath>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B0820" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 框体 -->
  <rect x="6" y="16" width="894" height="202" rx="14" fill="url(#face)" filter="url(#lift)"/>
  <!-- 稀疏星点（材质） -->
  <g fill="#F4EEFF" opacity="0.35">
    <circle cx="352" cy="38" r="1"/><circle cx="560" cy="64" r="0.8"/><circle cx="640" cy="34" r="1.1"/>
    <circle cx="430" cy="200" r="0.9"/><circle cx="610" cy="186" r="1"/><circle cx="700" cy="120" r="0.8"/>
    <circle cx="260" cy="200" r="0.8"/><circle cx="520" cy="112" r="0.7"/>
  </g>
  <!-- 外圈弧线：12% 穿过正文背后 -->
  <g clip-path="url(#boxclip)" opacity="0.12">
    <circle cx="900" cy="218" r="470" fill="none" stroke="#C9A35A" stroke-width="1.5"/>
