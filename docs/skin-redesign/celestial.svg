    <circle cx="900" cy="218" r="380" fill="none" stroke="#A99CC8" stroke-width="1.5"/>
    <circle cx="900" cy="218" r="290" fill="none" stroke="#C9A35A" stroke-width="1.5" stroke-dasharray="2 6"/>
    <ellipse cx="860" cy="228" rx="420" ry="150" transform="rotate(-14 900 218)" fill="none" stroke="#A99CC8" stroke-width="1.5"/>
  </g>
  <!-- 框线：止于星盘外圈 -->
  <rect x="6.75" y="16.75" width="892.5" height="200.5" rx="13.25" fill="none" stroke="#C9A35A" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- 星盘（四分之一可见，右下出血） -->
  <circle cx="900" cy="218" r="210" fill="none" stroke="url(#brass)" stroke-width="2"/>
  <g stroke="#C9A35A" stroke-opacity="0.8" fill="none"><path d="M733.7 101.6 L728.0 97.5" stroke-width="1"/><path d="M744.5 87.5 L739.1 83.0" stroke-width="1"/><path d="M756.5 74.5 L751.5 69.5" stroke-width="1"/><path d="M769.5 62.5 L765.0 57.1" stroke-width="1"/><path d="M783.6 51.7 L779.5 46.0" stroke-width="1"/><path d="M798.5 42.2 L795.0 36.1" stroke-width="1"/><path d="M814.2 34.0 L811.3 27.7" stroke-width="1"/><path d="M830.6 27.2 L828.2 20.7" stroke-width="1"/><path d="M847.5 21.9 L845.6 15.2" stroke-width="1"/><path d="M864.7 18.1 L863.5 11.2" stroke-width="1"/><path d="M882.3 15.8 L881.7 8.8" stroke-width="1"/><path d="M900.0 15.0 L900.0 8.0" stroke-width="1"/></g>
  <circle cx="900" cy="218" r="186" fill="#1B1638" fill-opacity="0.55" clip-path="url(#boxclip)"/>
  <circle cx="900" cy="218" r="176" fill="url(#disk)" stroke="url(#brass)" stroke-width="2.5"/>
  <circle cx="900" cy="218" r="168" fill="none" stroke="#C9A35A" stroke-width="1" stroke-opacity="0.8"/>
