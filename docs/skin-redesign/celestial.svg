  <circle cx="900" cy="218" r="132" fill="none" stroke="#C9A35A" stroke-width="1.5" stroke-opacity="0.75"/>
  <circle cx="900" cy="218" r="98" fill="none" stroke="#C9A35A" stroke-width="1" stroke-opacity="0.5"/>
  <g stroke="#C9A35A" stroke-opacity="0.35" stroke-width="1"><path d="M900 218 L737.7 174.5"/><path d="M900 218 L781.2 99.2"/><path d="M900 218 L856.5 55.7"/></g>
  <!-- 网环：偏心黄道 + 轨道 -->
  <circle cx="866" cy="188" r="104" fill="none" stroke="#A99CC8" stroke-width="1.5" stroke-opacity="0.85"/>
  <ellipse cx="840" cy="178" rx="120" ry="46" transform="rotate(-28 840 178)" fill="none" stroke="#C9A35A" stroke-width="1.5" stroke-opacity="0.8"/>
  <ellipse cx="850" cy="158" rx="64" ry="110" transform="rotate(-36 850 158)" fill="none" stroke="#A99CC8" stroke-width="1" stroke-opacity="0.6"/>
  <!-- 照准规（运动物件） -->
  <path d="M900 218 L702.9 161.5" stroke="url(#brass)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="702.9" cy="161.5" r="3.2" fill="#E7CC94"/>
  <path d="M786 85 Q786 92 789.15 92 Q786 92 786 99 Q786 92 782.85 92 Q786 92 786 85 Z" fill="#E7CC94" opacity="1"/><path d="M838 69 Q838 74 840.25 74 Q838 74 838 79 Q838 74 835.75 74 Q838 74 838 69 Z" fill="#F4EEFF" opacity="0.9"/><path d="M762 144 Q762 148 763.8 148 Q762 148 762 152 Q762 148 760.2 148 Q762 148 762 144 Z" fill="#E7CC94" opacity="0.85"/><path d="M892 108 Q892 112 893.8 112 Q892 112 892 116 Q892 112 890.2 112 Q892 112 892 108 Z" fill="#F4EEFF" opacity="0.8"/>
