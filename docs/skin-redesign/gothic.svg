<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="244" viewBox="0 0 920 244">
  <!-- 蔷薇哥特 gothic · 设计稿：教堂立面对称。两端尖窗与中轴山墙玫瑰窗刺破上沿，线条全部锡银，彩窗宝石色 -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1420"/>
      <stop offset="1" stop-color="#17111A"/>
    </linearGradient>
    <linearGradient id="pewter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6D7DF"/>
      <stop offset="0.5" stop-color="#A8A9B4"/>
      <stop offset="1" stop-color="#7C7D89"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="spillL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B3224A" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#B3224A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spillC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F4DA8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F4DA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="quarry" width="12" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 L6 0 L12 8 L6 16 Z" fill="none" stroke="#17111A" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <radialGradient id="lit" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFF4E0" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="boxclip"><path d="M18 30 H408 C418 16 440 8 460 2 C480 8 502 16 512 30 H902 L912 40 V226 L902 236 H18 L8 226 V40 Z"/></clipPath>
    <filter id="lift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- 一扇尖窗（原点 = 窗左下角，宽 68，高 214） -->
    <clipPath id="subL"><path d="M10 206 V86 C10 74 16 66 23 61 C30 66 34 74 34 86 V206 Z"/></clipPath>
    <clipPath id="subR"><path d="M34 206 V86 C34 74 38 66 45 61 C52 66 58 74 58 86 V206 Z"/></clipPath>
    <g id="lancet">
      <!-- 外框 -->
      <path d="M0 214 V44 C0 26 14 10 34 0 C54 10 68 26 68 44 V214 Z" fill="#120C14" stroke="url(#pewter)" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 窗头圆窗：四叶 -->
      <circle cx="34" cy="38" r="15" fill="#17111A" stroke="#A8A9B4" stroke-width="1.5"/>
      <g stroke="#17111A" stroke-width="1">
        <circle cx="34" cy="31" r="6.2" fill="#D99A3A"/>
        <circle cx="34" cy="45" r="6.2" fill="#D99A3A"/>
        <circle cx="27" cy="38" r="6.2" fill="#2E8B6A"/>
        <circle cx="41" cy="38" r="6.2" fill="#2E8B6A"/>
        <circle cx="34" cy="38" r="3.4" fill="#B3224A"/>
      </g>
      <!-- 两条子尖窗玻璃 -->
      <g clip-path="url(#subL)">
        <rect x="8" y="56" width="28" height="30" fill="#B3224A"/>
        <rect x="8" y="86" width="28" height="22" fill="#2F4DA8"/>
        <rect x="8" y="108" width="28" height="22" fill="#D99A3A"/>
        <rect x="8" y="130" width="28" height="22" fill="#B3224A"/>
        <rect x="8" y="152" width="28" height="22" fill="#2E8B6A"/>
        <rect x="8" y="174" width="28" height="34" fill="#2F4DA8"/>
        <rect x="8" y="56" width="28" height="152" fill="url(#quarry)"/>
        <rect x="8" y="56" width="28" height="152" fill="url(#lit)"/>
      </g>
      <g clip-path="url(#subR)">
        <rect x="32" y="56" width="28" height="30" fill="#2F4DA8"/>
        <rect x="32" y="86" width="28" height="22" fill="#B3224A"/>
        <rect x="32" y="108" width="28" height="22" fill="#2E8B6A"/>
        <rect x="32" y="130" width="28" height="22" fill="#2F4DA8"/>
        <rect x="32" y="152" width="28" height="22" fill="#D99A3A"/>
        <rect x="32" y="174" width="28" height="34" fill="#B3224A"/>
        <rect x="32" y="56" width="28" height="152" fill="url(#quarry)"/>
        <rect x="32" y="56" width="28" height="152" fill="url(#lit)"/>
      </g>
      <!-- 铅条 -->
      <g stroke="#17111A" stroke-width="1.5" fill="none">
        <path d="M10 86 H34 M10 108 H34 M10 130 H34 M10 152 H34 M10 174 H34"/>
        <path d="M34 86 H58 M34 108 H58 M34 130 H58 M34 152 H58 M34 174 H58"/>
      </g>
      <!-- 窗棂（锡银） -->
      <g fill="none" stroke="#A8A9B4" stroke-width="1.5" stroke-linejoin="round">
        <path d="M10 206 V86 C10 74 16 66 23 61 C30 66 34 74 34 86 V206"/>
        <path d="M34 86 C34 74 38 66 45 61 C52 66 58 74 58 86 V206"/>
        <path d="M6 208 V46 C6 30 18 16 34 7 C50 16 62 30 62 46 V208" stroke-opacity="0.55"/>
      </g>
      <!-- 窗台 -->
      <rect x="-4" y="208" width="76" height="5" rx="1" fill="url(#pewter)"/>
    </g>
  </defs>

  <!-- 框体：上沿中央升起山墙 -->
  <path d="M18 30 H408 C418 16 440 8 460 2 C480 8 502 16 512 30 H902 L912 40 V226 L902 236 H18 L8 226 V40 Z" fill="url(#face)" stroke="url(#pewter)" stroke-width="2" stroke-linejoin="round" filter="url(#lift)"/>
  <!-- 彩窗透光落在漆面 -->
  <g clip-path="url(#boxclip)">
  <ellipse cx="56" cy="130" rx="120" ry="110" fill="url(#spillL)"/>
  <ellipse cx="864" cy="130" rx="120" ry="110" fill="url(#spillL)"/>
  <ellipse cx="460" cy="40" rx="140" ry="60" fill="url(#spillC)"/>
  </g>
  <!-- 内线 -->
  <path d="M22 36 H404 M516 36 H898 L906 44 V222 L898 230 H22 L14 222 V44 Z" fill="none" stroke="#A8A9B4" stroke-width="1.5" stroke-opacity="0.32"/>
  <path d="M414 36 C424 22 444 15 460 10 C476 15 496 22 506 36" fill="none" stroke="#A8A9B4" stroke-width="1.5" stroke-opacity="0.32"/>

  <!-- 中轴：山墙顶饰 + 玫瑰窗 -->
  <circle cx="460" cy="2.5" r="2.5" fill="#D6D7DF"/>
  <g transform="translate(460 38)">
    <circle r="23" fill="#120C14" stroke="url(#pewter)" stroke-width="2"/>
    <g stroke="#17111A" stroke-width="1">
      <circle cx="0" cy="-14" r="7" fill="#B3224A"/>
      <circle cx="9.9" cy="-9.9" r="7" fill="#2F4DA8"/>
      <circle cx="14" cy="0" r="7" fill="#B3224A"/>
      <circle cx="9.9" cy="9.9" r="7" fill="#2F4DA8"/>
      <circle cx="0" cy="14" r="7" fill="#B3224A"/>
      <circle cx="-9.9" cy="9.9" r="7" fill="#2F4DA8"/>
      <circle cx="-14" cy="0" r="7" fill="#B3224A"/>
      <circle cx="-9.9" cy="-9.9" r="7" fill="#2F4DA8"/>
    </g>
    <circle r="23" fill="none" stroke="#A8A9B4" stroke-width="1" stroke-opacity="0.5" transform="scale(0.86)"/>
    <circle r="7" fill="#D99A3A" stroke="#A8A9B4" stroke-width="1.5"/>
    <circle r="2" fill="#2E8B6A"/>
    <circle r="23" fill="url(#sheen)" opacity="0.8"/>
  </g>

  <!-- 两端尖窗：窗尖越过上沿 -->
  <use xlink:href="#lancet" x="22" y="10"/>
  <use xlink:href="#lancet" x="830" y="10"/>

  <g font-family="Songti SC">
    <!-- 名牌：切角盾形小牌，锡银描边 -->
    <path d="M114 44 H176 L182 50 V64 L179 68 L148 74 L111 68 L108 64 V50 Z" fill="#B3224A" stroke="url(#pewter)" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="145" y="64" font-size="19" font-weight="700" fill="#F3E6EC" text-anchor="middle" letter-spacing="1">奈奈</text>

    <!-- 回复引用 -->
    <rect x="108" y="88" width="2" height="17" rx="1" fill="#B79AA8" opacity="0.6"/>
    <text x="118" y="101" font-size="13" fill="#B79AA8"><tspan font-weight="700">星野ほたる：</tspan>主播晚上好！今天打什么字呀</text>

    <!-- 提及 + 正文 -->
    <rect x="108" y="123" width="148" height="30" rx="4" fill="#B3224A" fill-opacity="0.2" stroke="#B3224A" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="123" cy="138" r="10" fill="#B3224A"/>
    <text x="139" y="145.5" font-size="20.5" font-weight="700" fill="#F3C6D3">星野ほたる</text>
    <text x="266" y="147" font-size="25" fill="#F3E6EC">晚上好！今天也谢谢你来～</text>
    <text x="108" y="190" font-size="25" fill="#F3E6EC">我们接着上次的故事讲吧。</text>
  </g>
  <!-- 继续标记：锡银小尖拱 -->
  <path d="M800 212 L806 204 L812 212 Z" fill="#A8A9B4"/>
</svg>
